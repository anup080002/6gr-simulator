scenario:
  runner_profile: "system_level_lls"
  target_cases:
    - "bundle"
  notes: "Browser-owned multi-cell study root. The active execution path is the truthful coupled browser-owned system-level LLS runner launched from /run, stored into MySQL, and consumed by /result and /analytics. Large-scale geometry, serving-cell selection, mobility, handover, scheduler grants, inter-cell interference state, and waveform-backed grant replay come from the same active runtime. The default study mode is lls_calibrated_link2system rather than full simultaneous 57-cell full-waveform execution, and that approximation boundary must remain explicitly labeled in reports and browser runtime context.\n"
  bundle_anchor_cases:
    - "ul_lowpapr"
  expected_outputs:
    - "reports/csv/scenario_summary.csv"
    - "reports/csv/runtime_operating_mode.csv"
    - "reports/csv/config_roundtrip_verification.csv"
    - "reports/csv/browser_runtime_db_consistency.csv"
    - "reports/csv/summary_vs_raw_consistency.csv"
    - "reports/csv/value_source_audit.csv"
    - "packet_flow/csv/live_dl_scheduler_grants.csv"
