<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="#f8fafc"/><rect x="40" y="40" width="1020" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">UE-wise / link-wise waveform comparison</text><text x="72" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">The browser is preserving honesty for this chart family.</text><text x="72" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Unavailable Without Faking</text><text x="72" y="214" font-family="Consolas,Segoe UI Mono,monospace" font-size="14" fill="#334155">The run exports a single runtime waveform preview, not a full UE-by-UE waveform sample bank suitable for an honest comparison chart.</text><text x="72" y="242" font-family="Consolas,Segoe UI Mono,monospace" font-size="14" fill="#334155">No synthetic per-layer/per-codeword/per-symbol/per-subcarrier values were generated.</text></svg>