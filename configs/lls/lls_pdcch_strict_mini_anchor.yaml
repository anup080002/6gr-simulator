inherits:
  - ../../simulator/configs/defaults/global.yaml
  - ../../simulator/configs/defaults/logging.yaml
  - ../../simulator/configs/defaults/kpi.yaml
  - ../../simulator/configs/bands/band_4ghz.yaml
  - ../../simulator/configs/waveforms/cp_ofdm.yaml
  - ../../simulator/configs/coding/ldpc_polar_baseline.yaml
  - ../../simulator/configs/channels/awgn.yaml
  - ../../simulator/configs/mimo/mimo_2x2.yaml
  - ../../simulator/configs/control/pdcch_baseline.yaml
  - ../../simulator/configs/control/harq_baseline.yaml
  - ../../simulator/configs/control/ra_baseline.yaml
  - ../../simulator/configs/ai_ml/disabled.yaml

meta:
  scenario_id: lls_pdcch_strict_mini_anchor
  description: Strict NR baseline PDCCH waveform blind-decode validation mini anchor.
  version: "1.0"
  owner: codex
  research_class: baseline_benchmark
  maturity_tag: regression
  scenario_group: control_channel
  tags: [pdcch, coreset, dci, strict, waveform_validation]

scenario:
  name: lls_pdcch_strict_mini_anchor
  description: PDCCH-only strict waveform validation with blind candidates, wrong-RNTI, no-signal, corruption, false-alarm, low-SNR, DCI-field, and grant evidence.
  runner_profile: pdcch_strict_validation
  target_cases: [pdcch]
  bundle_anchor_cases: [pdcch_strict_validation]
  honesty_mode: strict
  notes: "AUD-PDCCH-001 strict mini-run; validates NR baseline/study PDCCH anchor behavior, not exhaustive 6G normative conformance."

run_control:
  num_workers: 1
  parallel_pool_kind: auto
  parallel_pool_idle_timeout_minutes: 5

simulation:
  link_direction: dl
  n_frames: 1
  n_slots: 1
  n_subframes: 1
  monte_carlo_iterations: 1
  random_seed: 240617
  deterministic_mode: true
  snr_db: 35
  min_duration_s: 0.001
  snr_sweep_offsets_db: [0]

frequency:
  range_name: FR1
  center_frequency_hz: 4000000000
  bandwidth_hz: 10000000
  duplex_mode: FDD
  carrier_count: 1
  carrier_aggregation_enabled: false
  band_name: n77
  bandwidth_options_hz: [10000000]
  numerology_options_khz: [30]
  max_mimo_size: 1
  mobility_defaults_kmph: 3
  channel_model_defaults: AWGN
  reference_signal_defaults: baseline
  power_model_defaults: baseline
  energy_model_defaults: disabled
  rf_impairment_defaults: disabled
  n_size_grid: 52

frame:
  scs_khz: 30
  cp_type: normal
  slot_format: dl
  tdd_pattern: FDD

channels:
  model_type: AWGN
  profile: AWGN
  delay_spread_ns: 0
  doppler_hz: 0
  mobility_kmph: 0
  los_enabled: true
  spatial_consistency_enabled: false
  pathloss_enabled: false
  shadow_fading_enabled: false
  pathloss_model: none
  shadow_fading_std_db: 0

mimo:
  n_tx_ant: 1
  n_rx_ant: 1
  n_layers: 1
  precoder_type: none
  codebook_type: type1
  reciprocity_mode: FDD
  beam_sweep_enabled: false
  beam_count: 1
  mtrp_ready: false
  multi_panel_ready: false
  panel_count: 1

control:
  pdcch_enabled: true
  coreset_type: ue
  search_space_type: ue
  aggregation_levels: [4]
  dci_formats: ["1_0", "0_0"]
  blind_decode_candidates: 8
  coreset_duration: 2
  coreset_frequency_resources: [1, 1, 1, 1]
  candidate_aggregation_levels: [4]
  scheduler_aggregation_level: 4
  aggregation_selection_policy: configured_scheduler_level
  search_space_num_candidates: [0, 0, 2, 0, 0]
  pdcch_payload_bits: 37
  blind_decode_list_length: 8
  pdcch_strict:
    rnti_type: C-RNTI
    rnti_value: 4660
    binding_source: scenario_config
    false_alarm_snr_db: [-6, 0, 6]
    false_alarm_trials: 3
    low_snr_sweep_db: [-8, 0, 10, 35]
    low_snr_trials: 1
  pucch_enabled: false
  pucch_format: 2

output:
  bucket: lls
  profile: strict_pdcch_waveform
  save_csv: true
  save_mat: false
  save_figures: true
  save_png: true
  save_yaml_snapshot: true
  save_json_snapshot: true
  organize_by_block: true
  generate_summary_plots: false
