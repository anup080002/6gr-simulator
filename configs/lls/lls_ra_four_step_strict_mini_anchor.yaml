inherits:
  - ../../simulator/configs/defaults/global.yaml
  - ../../simulator/configs/defaults/logging.yaml
  - ../../simulator/configs/defaults/kpi.yaml
  - ../../simulator/configs/bands/band_4ghz.yaml
  - ../../simulator/configs/waveforms/cp_ofdm.yaml
  - ../../simulator/configs/coding/ldpc_polar_baseline.yaml
  - ../../simulator/configs/channels/awgn.yaml
  - ../../simulator/configs/mimo/mimo_2x2.yaml
  - ../../simulator/configs/control/pdcch_baseline.yaml
  - ../../simulator/configs/control/harq_baseline.yaml
  - ../../simulator/configs/control/ra_baseline.yaml
  - ../../simulator/configs/ai_ml/disabled.yaml

meta:
  scenario_id: lls_ra_four_step_strict_mini_anchor
  description: Strict NR-like contention-based four-step random-access anchor.
  version: "1.0"
  owner: codex
  research_class: baseline_benchmark
  maturity_tag: regression
  scenario_group: initial_access
  tags: [random_access, four_step_ra, strict]

scenario:
  name: lls_ra_four_step_strict_mini_anchor
  description: Strict MSG1-MSG4 random-access validation using explicit scenario RACH config.
  runner_profile: random_access_four_step
  target_cases: [prach, pdcch, pusch]
  bundle_anchor_cases: [random_access_four_step]
  honesty_mode: strict
  notes: "Strict Release-18 initial-access validation: SSB/MIB/Type0/SIB1 are waveform-decoded before decoded SIB1 owns the four-step RA configuration."

run_control:
  num_workers: 1
  parallel_pool_kind: auto
  parallel_pool_idle_timeout_minutes: 5

simulation:
  link_direction: both
  n_frames: 1
  n_slots: 4
  n_subframes: 1
  monte_carlo_iterations: 1
  random_seed: 240611
  deterministic_mode: true
  snr_db: 30
  min_duration_s: 0.001
  snr_sweep_offsets_db: [0]

frequency:
  range_name: FR1
  center_frequency_hz: 4000000000
  bandwidth_hz: 20000000
  duplex_mode: TDD
  carrier_count: 1
  carrier_aggregation_enabled: false
  band_name: n77
  bandwidth_options_hz: [20000000]
  numerology_options_khz: [30]
  max_mimo_size: 1
  mobility_defaults_kmph: 3
  channel_model_defaults: AWGN
  reference_signal_defaults: baseline
  power_model_defaults: baseline
  energy_model_defaults: disabled
  rf_impairment_defaults: disabled
  n_size_grid: 51

frame:
  scs_khz: 30
  cp_type: normal
  slot_format: mixed
  tdd_common:
    ReferenceSubcarrierSpacingKHz: 30
    Pattern1:
      PeriodicityMilliseconds: 2.5
      NumDownlinkSlots: 2
      NumDownlinkSymbols: 0
      NumUplinkSlots: 3
      NumUplinkSymbols: 0

channels:
  model_type: AWGN
  profile: AWGN
  delay_spread_ns: 0
  doppler_hz: 0
  mobility_kmph: 0
  los_enabled: true
  spatial_consistency_enabled: false
  pathloss_enabled: false
  shadow_fading_enabled: false
  pathloss_model: none
  shadow_fading_std_db: 0

mimo:
  n_tx_ant: 1
  n_rx_ant: 1
  n_layers: 1
  precoder_type: none
  codebook_type: type1
  reciprocity_mode: TDD
  beam_sweep_enabled: false
  beam_count: 1
  mtrp_ready: false
  multi_panel_ready: false
  panel_count: 1

reference_signals:
  pdsch_dmrs_ports: 1
  pusch_dmrs_ports: 1
  srs_ports: 1

control:
  coreset_duration: 2

initial_access:
  enabled: true
  profile: fr1_four_step_ra_rrc_connection_strict_r18
  configuration_epoch: 1
  band_context: n77
  spectrum: unpaired
  shared_spectrum: false
  random_access_procedure: four_step_contention_based
  require_explicit_ssb_bitmap: true
  validation_snr_db: 35
  validation_seed: 240611
  ssb:
    enabled: true
    case: Case C
    scs_khz: 30
    lmax: 8
    beam_count: 1
    periodicity_ms: 20
    positions_in_burst: '10000000'
    per_ssb_power_db: [0, 0, 0, 0, 0, 0, 0, 0]
    precoder_ids: [identity, identity, identity, identity, identity, identity, identity, identity]
    selected_ssb_index: 0
    observation_subframes: 5
  mib:
    enabled: true
    pdcch_config_sib1: 0
    dmrs_type_a_position: 2
  type0:
    si_rnti: 65535
    dci_format: '1_0'
    monitoring_occasion_ordinal: 2
    note17_band: false
  sib1:
    enabled: true
    si_rnti: 65535
    coreset0_from_mib_required: true
    searchspace0_from_mib_required: true
    decode_from_waveform_required: true
    observation_subframes: 5
    pdsch:
      prb_start: 0
      num_prb: 24
      symbol_start: 2
      num_symbols: 12
      mcs: 0
      rv: 0
  rrc:
    require_setup_complete: true
    transaction_id: 0
    srb1_lcid: 1
  extensions:
    two_step_ra: false
    contention_free_ra: false
    beam_failure_recovery: false
    supplementary_uplink: false
    ntn_access: false
    redcap_access: false
    eredcap_access: false

random_access:
  enabled: true
  binding_source: scenario_config_pending_sib1
  procedure_type: contention_based_four_step
  prach_format: '0'
  preamble_length_mode: long
  configuration_index: 16
  subcarrier_spacing_khz: 1.25
  root_sequence_index: 1
  logical_root_sequence_index: 1
  sequence_index: 1
  zero_correlation_zone: 8
  restricted_set: UnrestrictedSet
  frequency_start: 0
  preamble_count: 64
  preamble_index: 7
  min_detection_trials: 1
  msg3_enabled: true
  num_prach_occasions: 1
  num_slots: 4
  num_subframes: 1
  active_preamble_pattern: [7]
  num_rx_antennas: 1
  num_tx_antennas: 1
  num_ues_per_ro: 1
  enable_collision_mode: false
  enable_inter_cell_interference: false
  enable_frequency_offset: false
  enable_phase_noise: false
  enable_timing_uncertainty: false
  enable_frequency_estimation_metric: false
  channel_model: AWGN
  delay_spread_ns: 30
  speed_kmh: 3
  cell_radius_m: 500
  timing_uncertainty_min_us: 0
  timing_uncertainty_max_us: 0
  ue_frequency_offset_hz: 0
  trp_frequency_offset_hz: 0
  phase_noise_std_rad: 0.001
  inter_cell_relative_power_db: -3
  target_false_alarm_probability: 0.001
  timing_tolerance_us: 0.25
  detection_threshold_mode: fixed
  detection_threshold: 0.02
  threshold_sweep: [0.02]
  snr_sweep_db: [30]
  occasion:
    frame: 0
    slot: 0
    symbol: 0
    frequency_index: 0
  ra_response_window_slots: 8
  ra_contention_resolution_timer_slots: 64
  preamble_trans_max: 10
  power_ramping_step_db: 2
  preamble_received_target_power_dbm: -100
  temp_crnti: 4660
  final_crnti: 4660
  timing:
    rar_processing_delay_slots: 1
    msg3_k2_slots: 1
    msg4_processing_delay_slots: 1
    setup_complete_k2_slots: 1
  dci_payload_bits: 32
  msg2_pdsch:
    prb_start: 0
    num_prb: 24
    symbol_start: 2
    num_symbols: 12
    mcs: 0
    modulation: QPSK
    target_code_rate: 0.1171875
    rv: 0
    n_layers: 1
  msg3_pusch:
    prb_start: 0
    num_prb: 24
    symbol_start: 0
    num_symbols: 14
    mcs: 0
    modulation: QPSK
    target_code_rate: 0.1171875
    rv: 0
    n_layers: 1
    transform_precoding: false
  msg4_pdsch:
    prb_start: 0
    num_prb: 24
    symbol_start: 2
    num_symbols: 12
    mcs: 0
    modulation: QPSK
    target_code_rate: 0.1171875
    rv: 0
    n_layers: 1
  setup_complete_pusch:
    prb_start: 0
    num_prb: 24
    symbol_start: 0
    num_symbols: 14
    mcs: 0
    modulation: QPSK
    target_code_rate: 0.1171875
    rv: 0
    n_layers: 1
    transform_precoding: false

output:
  bucket: lls
  profile: strict_ra_four_step
  save_csv: true
  save_mat: false
  save_figures: true
  save_png: true
  save_yaml_snapshot: true
  save_json_snapshot: true
  organize_by_block: true
  generate_summary_plots: false
