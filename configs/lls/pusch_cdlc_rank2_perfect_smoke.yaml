inherits:
  - pusch_cdlc_perfect_smoke.yaml

scenario:
  id: pusch_cdlc_qpsk_rank2_perfect_csi_smoke
  description: Dedicated 2x2 rank-2 CDL-C perfect-CSI waveform validation; not publication statistics

simulation:
  snrDb: [25]

pusch:
  numberLayers: 2
  numberAntennaPorts: 2
  dmrs:
    portSet: [0, 1]

channel:
  txAntennas: 2
  rxAntennas: 2
  cdl:
    transmitArray:
      size: [1, 1, 2, 1, 1]
      elementSpacingWavelength: [0.5, 0.5, 1.0, 1.0]
      polarizationAnglesDeg: [45.0, -45.0]
      orientationDeg: [0.0, 0.0, 0.0]
      element: '38.901'
      polarizationModel: Model-2
    receiveArray:
      size: [1, 1, 2, 1, 1]
      elementSpacingWavelength: [0.5, 0.5, 0.5, 0.5]
      polarizationAnglesDeg: [0.0, 90.0]
      orientationDeg: [0.0, 0.0, 0.0]
      element: isotropic
      polarizationModel: Model-2

antenna:
  # The strict descriptor must still match the two logical UL transmit
  # ports even when physical pattern coupling is disabled for this
  # receiver-trust regression.
  gnb:
    size: [1, 2, 1, 1]
    polarizationAnglesDeg: [0]
    steeringAzElDeg: [0, 0]
    numRFChains: 2
  ue:
    size: [1, 2, 1, 1]
    polarizationAnglesDeg: [0]
    steeringAzElDeg:
      - [0, 0]
      - [0, 0]
    numRFChains: 2
