inherits: pdsch_reference.yaml

scenario:
  id: pdsch_cdlc_rank2_perfect_regression
  description: Focused exact-channel trust-boundary regression for the production PDSCH waveform chain

simulation:
  snrDb: [35]
  minTransportBlocks: 2
  minBlockErrors: 1
  maxTransportBlocks: 2
  statisticalClass: diagnostic_only

pdsch:
  numberLayers: 2
  numberAntennaPorts: 2
  dmrs:
    numCDMGroupsWithoutData: 2
    portSet: [0, 1]

channel:
  model: CDL-C
  delaySpreadSeconds: 0.0000003
  velocityKmph: 3.0
  txAntennas: 2
  rxAntennas: 2
  seed: 20260821
  cdl:
    transmitArray:
      size: [1, 1, 2, 1, 1]
      elementSpacingWavelength: [0.5, 0.5, 1.0, 1.0]
      polarizationAnglesDeg: [45.0, -45.0]
      orientationDeg: [0.0, 0.0, 0.0]
      element: '38.901'
      polarizationModel: Model-2
    receiveArray:
      size: [1, 1, 2, 1, 1]
      elementSpacingWavelength: [0.5, 0.5, 0.5, 0.5]
      polarizationAnglesDeg: [0.0, 90.0]
      orientationDeg: [0.0, 0.0, 0.0]
      element: isotropic
      polarizationModel: Model-2

receiver:
  channelEstimation: perfect

antenna:
  # Keep the canonical antenna descriptor dimensionally identical to the
  # two-port/two-branch CDL execution even though directional coupling is
  # disabled for this receiver trust-boundary regression.
  gnb:
    size: [1, 2, 1, 1]
    polarizationAnglesDeg: [0]
    steeringAzElDeg:
      - [0, 0]
      - [0, 0]
    numRFChains: 2
  ue:
    size: [1, 2, 1, 1]
    polarizationAnglesDeg: [0]
    steeringAzElDeg: [0, 0]
    numRFChains: 2

results:
  generatePlots: false
