inherits:
  - pusch_reference.yaml

scenario:
  id: pusch_cdlc_qpsk_perfect_csi_smoke
  description: Dedicated exact per-RE CDL-C perfect-CSI validation; not publication statistics

simulation:
  snrDb: [20]
  minTransportBlocks: 2
  minBlockErrors: 1
  maxTransportBlocks: 3

channel:
  model: CDL-C
  delaySpreadSeconds: 0.0000001
  velocityKmph: 3.0
  txAntennas: 1
  rxAntennas: 1
  cdl:
    transmitArray:
      size: [1, 1, 1, 1, 1]
      elementSpacingWavelength: [0.5, 0.5, 1.0, 1.0]
      polarizationAnglesDeg: [0.0]
      orientationDeg: [0.0, 0.0, 0.0]
      element: isotropic
      polarizationModel: Model-2
    receiveArray:
      size: [1, 1, 1, 1, 1]
      elementSpacingWavelength: [0.5, 0.5, 0.5, 0.5]
      polarizationAnglesDeg: [0.0]
      orientationDeg: [0.0, 0.0, 0.0]
      element: isotropic
      polarizationModel: Model-2

receiver:
  channelEstimation: perfect

results:
  outputRoot: artifacts/focused_lls
  generatePlots: false
