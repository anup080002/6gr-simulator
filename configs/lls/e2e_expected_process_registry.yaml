version: "1.0"
registry_name: actual_mobile_2ue_full_phy_study
description: Expected process registry for the actual 1-sector / 2UE / 100 km/h full-PHY LLS study.
required_processes:
  - process_id: config_validation
    process_name: config validation
    required: true
    function_patterns: [sixgr.lls6g.config.validateScenarioConfig, sixgr.config.validateConfig]
    artifact_patterns: [reports/csv/config_roundtrip_verification.csv, reports/csv/validation_messages.csv]
  - process_id: claim_gate
    process_name: claim gate
    required: true
    function_patterns: [sixgr.truth.evaluateLLSRuntimeTruthContract]
    artifact_patterns: [reports/csv/result_status_summary.csv, reports/csv/standards_claim_audit.csv]
  - process_id: configured_effective_gate
    process_name: configured/effective gate
    required: true
    function_patterns: [sixgr.truth.summarizeEffectiveOperatingPoint]
    artifact_patterns: [reports/csv/configured_effective_operating_point.csv, reports/csv/scenario_objective_gates.csv]
  - process_id: output_root_creation
    process_name: output root creation
    required: true
    function_patterns: [sixgr.report.defaultRunFolder]
    artifact_patterns: [meta/runtime_summary.json, meta/environment.json]
  - process_id: environment_capture
    process_name: environment capture
    required: true
    function_patterns: [localCaptureEnvironment]
    artifact_patterns: [meta/environment.json]
  - process_id: matlab_profiler_start
    process_name: MATLAB profiler start
    required: true
    function_patterns: [profile]
    artifact_patterns: [reports/csv/runtime_profiler_summary.csv, reports/profiling/matlab_profile_summary.txt]
  - process_id: parallel_pool_start
    process_name: parallel pool start
    required: true
    function_patterns: [parpool]
    artifact_patterns: [reports/csv/parallel_execution_summary.csv, meta/runtime_summary.json]
  - process_id: log_capture
    process_name: log capture
    required: true
    function_patterns: [diary]
    artifact_patterns: [logs/matlab_diary.log]
  - process_id: mobility_trajectory
    process_name: mobility trajectory
    required: true
    function_patterns: [sixgr.scenario.dropUEs, sixgr.scenario.mobility.updatePositions, sixgr.scenario.mobility.MobilityTrace]
    artifact_patterns: [reports/csv/live_rsrp_serving_trace.csv, reports/csv/runtime_calculation_trace.csv]
  - process_id: tdd_pattern
    process_name: TDD pattern
    required: true
    function_patterns: [sixgr.phy.FrameStructureEngine]
    artifact_patterns: [reports/csv/runtime_operating_mode.csv]
  - process_id: channel_geometry
    process_name: channel geometry
    required: true
    function_patterns: [sixgr.channel.buildScenarioGeometry]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv]
  - process_id: pathloss
    process_name: pathloss
    required: true
    function_patterns: [nrPathLoss]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv, reports/csv/runtime_calculation_trace.csv]
  - process_id: shadowing
    process_name: shadowing
    required: true
    function_patterns: [shadow_fading]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv]
  - process_id: o2i
    process_name: O2I
    required: true
    function_patterns: [o2i]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv]
  - process_id: doppler
    process_name: Doppler
    required: true
    function_patterns: [doppler]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv, reports/csv/runtime_calculation_trace.csv]
  - process_id: cdl_tdl_channel
    process_name: CDL/TDL channel
    required: true
    function_patterns: [nrCDLChannel, nrTDLChannel]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv, air_interface/csv/dl_pdsch_trials.csv, air_interface/csv/ul_pusch_trials.csv]
  - process_id: thermal_noise
    process_name: thermal noise
    required: true
    function_patterns: [thermal_noise]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv]
  - process_id: cfo
    process_name: CFO
    required: true
    function_patterns: [InjectedCFO_Hz, EstimatedCFO_Hz]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv, reports/csv/runtime_calculation_trace.csv]
  - process_id: phase_noise
    process_name: phase noise
    required: true
    function_patterns: [phase_noise]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv]
  - process_id: iq_imbalance
    process_name: IQ imbalance
    required: true
    function_patterns: [iq_imbalance]
    artifact_patterns: [reports/csv/live_channel_state_tti.csv]
  - process_id: pa_nonlinearity
