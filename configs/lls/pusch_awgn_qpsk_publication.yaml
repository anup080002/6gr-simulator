inherits: pusch_reference.yaml

scenario:
  id: pusch_awgn_qpsk_publication
  description: Publication-candidate fixed-MCS PUSCH waterfall using only decoded waveform transport blocks

simulation:
  snrDb: [-4, -3, -2, -1, 0]
  minTransportBlocks: 1000
  minBlockErrors: 100
  # Prespecified fixed N. At 95% confidence, a zero-error Wilson upper
  # bound with N=4000 is below 1e-3, the smallest requested BLER target.
  maxTransportBlocks: 4000
  statisticalClass: publication_candidate
  studyType: fixed_mcs_bler

execution:
  parallelEnabled: true
  maximumWorkers: 4
  batchTransportBlocks: 32

receiver:
  # Perfect-CSI AWGN reference: do not replace the configured/equalized
  # noise variance with a finite-sample DM-RS or decision-directed bound.
  postEqualizationSINR:
    dmrsResidualBoundEnabled: false
    decisionDirectedResidualBoundEnabled: false
  decoderNoiseVariance:
    mode: pre_equalization

provenance:
  requireGitCommit: true
  requireCleanWorktree: true
  requireStableSourceThroughoutRun: true

comparison:
  targetBLER: [0.1, 0.01, 0.001]

results:
  outputRoot: results/lls/ran1_waveform_publication
  generatePlots: true
  imageFormat: png
