[pytest]
addopts = -m "not webgui_e2e and not phase18_recovery"
testpaths = tests
pythonpath = .
norecursedirs =
    results
    outputs
    artifacts
    node_modules
    .git
    .pytest_cache
    qualification_evidence
    canonical_runtime
    .webgui-venv
markers =
    webgui_unit: isolated canonical WebGUI unit and contract tests
    webgui_e2e: Playwright test against an externally managed WebGUI
    phase18_recovery: immutable Phase-18 source/recovery evidence verification; run explicitly with -m phase18_recovery
