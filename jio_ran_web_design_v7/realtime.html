<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jio Platforms Limited RAN Simulator — Real-Time Data</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data.js"></script>
  <script src="app.js" defer></script>
</head>
<body data-page="realtime">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <main class="main">
<section class="panel"><div class="panel-header"><div><h3 class="panel-title">Live run monitor</h3><p class="panel-subtitle">MySQL-backed operational console for grants, control state, channel state, artifacts, and truth status.</p></div><span class="badge amber">Server-side filtering assumed</span></div><div class="panel-body"><div class="metric-grid" id="rtKpis"></div></div></section>
<div class="workspace">
  <div>
    <div class="tab-rail"><span class="tab-chip active">Live grants</span><span class="tab-chip">Control state</span><span class="tab-chip">Channel state</span><span class="tab-chip">PHY stage</span><span class="tab-chip">Errors</span></div>
    <div id="rtGrants"></div>
    <div style="margin-top:18px" id="rtControl"></div>
    <div style="margin-top:18px" id="rtChannel"></div>
  </div>
  <div>
    <div class="panel"><div class="panel-header"><div><h3 class="panel-title">Runtime event stream</h3><p class="panel-subtitle">Warnings, gating events, artifact checkpoints, truth-contract notices.</p></div></div><div class="panel-body" id="rtEvents"></div></div>
  </div>
</div>
</main>
    </div>
    <aside class="rightbar" id="rightbar"></aside>
  </div>
</body>
</html>
