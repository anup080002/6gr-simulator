<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jio Platforms Limited RAN Simulator — Analytics</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data.js"></script>

<body data-page="analytics">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

<section class="panel"><div class="panel-header"><div><h3 class="panel-title">Analytics Dashboard</h3><p class="panel-subtitle">All charts read from loaded result CSVs or show an explicit unavailable state.</p></div><span class="badge green">Runtime CSV Evidence</span></div><div class="panel-body"><div class="analytics-kpi-strip" id="analyticsKpiStrip"></div><div id="analyticsCards"></div></div></section>
<section class="panel"><div class="panel-header"><div><h3 class="panel-title">Performance Charts</h3><p class="panel-subtitle">Evidence-backed LLS plots with the source CSV shown per chart.</p></div></div><div class="panel-body" id="analyticsCharts"><div class="loading-state">Waiting for analytics CSV load.</div></div></section>
</main>
    </div>
    <aside class="rightbar" id="rightbar"></aside>
  </div>
