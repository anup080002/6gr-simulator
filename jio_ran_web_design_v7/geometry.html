<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jio Platforms Limited RAN Simulator — Geometry</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="data.js"></script>
  <script src="config-store.js"></script>
  <script src="config-form-renderer.js"></script>
  <script src="analytics-data.js"></script>
  <script src="chart-engine.js"></script>
  <script src="app.js" defer></script>
</head>
<body data-page="geometry">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <main class="main">
<section class="panel"><div class="panel-header"><div><h3 class="panel-title">Geometry summary</h3><p class="panel-subtitle">Topology, site/sector layout, UE placement, wrap-around, hotspots, and mobility.</p></div><span class="badge blue">Geometry</span></div><div class="panel-body"><div class="kpi-strip" id="geomKpis"></div></div></section>
<div class="section-grid"><div id="geomControls"></div><div class="panel"><div class="panel-header"><div><h3 class="panel-title">Topology canvas</h3><p class="panel-subtitle">Visual map of sites, sectors, UE clusters, trajectories, and serving-cell view.</p></div></div><div class="panel-body" id="geomCanvas"></div></div></div>
</main>
    </div>
    <aside class="rightbar" id="rightbar"></aside>
  </div>
</body>
</html>
