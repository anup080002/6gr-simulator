{
  "inherits": [
    "./lls_700mhz_20mhz_2x2_rank2_beam_truth.yaml"
  ],
  "meta": {
    "scenario_id": "lls_700mhz_20mhz_3bs_30ue_tdlc_browser_coupled",
    "description": "Browser-driven coupled LLS scenario for 3 base stations and 30 UEs at 700 MHz / 20 MHz with TDL-C fading, Doppler derived from 30 km/h UE mobility, geometry-driven large-scale attenuation, CSI-backed AMC, HARQ, and MySQL-backed live results.",
    "version": "1.0.0",
    "owner": "codex",
    "research_class": "agreed_starting_point",
    "maturity_tag": "experimental",
    "scenario_group": "lls_web_integrated",
    "tags": ["lls", "browser", "mysql", "700mhz", "20mhz", "3bs", "30ue", "tdl-c", "coupled", "amc", "harq"]
  },
  "run_control": {
    "execution_mode": "LLS",
    "num_workers": 1
  },
  "scenario": {
    "notes": "Browser-backed coupled runtime scenario. Serving links use waveform PHY truth with geometry-driven large-scale attenuation, practical timing estimation, CSI feedback, AMC, HARQ, full per-link channel-waveform interferer summation for overlapping grants, and receiver-noise thermal noise. UE mobility is configured at 30 km/h and the runtime derives channel Doppler from UE speed plus carrier frequency. PBCH, PRACH, PDCCH, and SRS now feed persistent runtime gating state before data scheduling/execution, with simplified PRACH/SRS control timing rather than a full attach stack."
  },
  "simulation": {
    "n_frames": 10,
    "n_slots": 10,
    "n_subframes": 10,
    "monte_carlo_iterations": 4,
    "random_seed": 73030,
    "snr_db": 10,
    "noise_operating_mode": "receiver_noise_figure_thermal_noise",
    "snr_sweep_offsets_db": [0]
  },
  "sweeps_and_matrix": {
    "snr_sweep": {
      "enabled": false,
      "values_db": []
    }
  },
  "users": {
    "enabled": true,
    "n_users": 30,
    "execution_model": "slot_coupled_truth",
    "save_user_tables": true
  },
  "pdsch": {
    "execution_profile": "scheduler_truth"
  },
  "pusch": {
    "execution_profile": "scheduler_truth"
  },
  "deployment_topology": {
    "scenario_type": "multi-cell",
    "site_layout": "hex_grid",
    "cell_type": "UMa",
    "layout_type": "hex_grid",
    "num_sites": 3,
    "num_base_stations": 3,
    "num_cells": 3,
    "num_sectors_per_site": 1,
    "num_ues": 30,
    "num_trps": 3,
    "trp_topology": "per_cell_trp",
    "trp_sync_mode": "synchronous",
    "trp_switching_mode": "disabled",
    "cell_free_flag": false,
    "full_duplex_flag": false,
    "self_interference_path_model": "none",
    "inter_site_distance": 500,
    "wraparound_enabled": false
  },
  "channels": {
    "model_type": "TDL",
    "profile": "TDL-C",
    "doppler_hz": 19.45845068729019,
    "doppler_source_mode": "derive_from_ue_speed",
    "mobility_kmph": 30,
    "pathloss_enabled": true,
    "shadow_fading_enabled": true,
    "pathloss_model": "nrPathLoss",
    "shadow_fading_std_db": 6
  },
  "interference": {
    "inter_cell_interference_flag": true,
    "cochannel_interference_profile": "full_reuse",
    "interference_measurement_policy": "standard",
    "inter_cell_execution_mode": "full_per_link_channel_waveform_sum"
  },
  "control_gating": {
    "pbch_required": true,
    "prach_required": true,
    "pdcch_required": true,
    "srs_required": true,
    "srs_max_age_slots": 4,
    "trs_required": true,
    "trs_max_age_slots": 4
  },
  "power_and_rf_frontend": {
    "ue_noise_figure_db": 9
  },
  "control": {
    "dci_formats": ["1_1", "0_1"],
    "pucch_enabled": true,
    "pucch_format": 2
  },
  "reference_signals": {
    "trs_enabled": true,
    "trs": {
      "slot_numbers": [2, 7]
    },
    "tracking_rs_enabled": true,
    "ptrs_enabled": true,
    "ptrs_port_association_policy": "first_scheduled_dmrs_port",
    "ptrs_time_density": 2,
    "ptrs_frequency_density": 2,
    "ptrs_re_offset": "00",
    "tracking_rs": {
      "trp_transmission_assumption": "noncoherent_multi_trp"
    }
  },
  "mobility": {
    "ue_speed_kmh": 30,
    "trajectory_model": "zigzag",
    "update_period_s": 0.0005,
    "zigzag_segment_duration_s": 0.0025,
    "zigzag_turn_angle_deg": 38
  },
  "link_adaptation": {
    "fixed_or_amc": "amc",
    "pdsch_link_adaptation_policy": "baseline",
    "pusch_link_adaptation_policy": "baseline",
    "rank_adaptation_policy": "fixed",
    "beam_adaptation_policy": "fixed",
    "adaptation_periodicity": "slot",
    "adaptation_delay_model": "zero",
    "cqi_source": "csi_feedback"
  },
  "output": {
    "backend": "mysql_web",
    "profile": "lls_700mhz_20mhz_3bs_30ue_tdlc_browser_coupled",
    "profiler_enabled": false,
    "profiler_top_functions": 120,
    "profiler_top_edges": 200
  }
}
