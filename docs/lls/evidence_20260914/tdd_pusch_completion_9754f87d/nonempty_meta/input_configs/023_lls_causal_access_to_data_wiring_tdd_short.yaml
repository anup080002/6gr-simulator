inherits:
  - ./lls_causal_access_to_data_wiring_tdd.yaml

meta:
  scenario_id: lls_causal_access_to_data_wiring_tdd_short
  description: >
    Fifty-eight-slot bounded TDD diagnostic derived from the production causal
    access-to-data wiring profile. It preserves the complete measured
    scheduler-truth PHY, initial-access, beam, CSI/SRS/TRS, HARQ, link-
    adaptation, antenna, channel, IQ, CSV, MAT and PNG contracts while
    bounding runtime for defect isolation.
  version: "1.0.0"
  owner: sixgr
  research_class: baseline_benchmark
  maturity_tag: regression
  scenario_group: causal_access_to_data_wiring
  tags: [lls, truth, tdd, 5mhz, short, causal, initial_access, beam, csi, amc]

run_control:
  total_slots: 58
  warmup_slots: 0
  measurement_slots: 58
  total_time_ms: 58
  warmup_time_ms: 0
  measurement_time_ms: 58

simulation:
  n_frames: 5
  n_slots: 58
  n_subframes: 58
  min_duration_s: 0.058

random_access:
  num_slots: 58
  num_subframes: 58

output:
  profile: lls_causal_access_to_data_wiring_tdd_short
  # Raw trial CSVs still update causally. Defer the expensive derived PNG
  # gallery until finalization; rebuilding it after every slot previously
  # dominated this 58-slot diagnostic runtime without adding PHY evidence.
  live_heavy_refresh_interval_frames: 58
  live_heavy_refresh_each_sweep_point: false
