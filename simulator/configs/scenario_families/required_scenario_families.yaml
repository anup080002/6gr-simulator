    mandatory_plots: [shaping_gain_vs_snr, rate_loss_bar, bler_vs_dm_algorithm, complexity_vs_gain]
    pass_fail_expectations:
      - Candidate shaping gains must be reported together with rate-loss and complexity penalties.
      - DM algorithm changes must remain explicit in retransmission behavior and payload shaping traces.
      - No shaping result may be mislabeled as a baseline benchmark.
    typical_debug_traces: [distribution_matcher_trace, symbol_probability_log, shaped_constellation_trace, retransmission_shaping_log]

  - family_id: joint_coding_modulation_candidate_studies
    family_name: joint coding + modulation candidate studies
