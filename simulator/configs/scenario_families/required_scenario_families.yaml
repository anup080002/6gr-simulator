      - path: simulator/configs/scenarios/mandatory_coding_modulation_packs.yaml
        role: candidate_anchor
        override_label: shaping_mpdm
      - path: simulator/configs/scenarios/mandatory_coding_modulation_packs.yaml
        role: candidate_anchor
        override_label: shaping_ess
      - path: simulator/configs/scenarios/mandatory_coding_modulation_packs.yaml
        role: candidate_anchor
        override_label: shaping_ecc_dm
    sweep_definition:
