    optional_kpis: [energy_per_bit_nj, llr_entropy, rate_matching_loss_pct]
    mandatory_plots: [bler_vs_snr_by_joint_mode, throughput_vs_complexity, iteration_histogram, efficiency_vs_qam_order]
    pass_fail_expectations:
      - Candidate joint coding-modulation modes must be compared against equivalent conventional baselines.
      - Complexity increases must be reported alongside any throughput or BLER gains.
      - Decoder-iteration and early-stop behavior must remain visible for all candidate modes.
    typical_debug_traces: [joint_mapping_log, decoder_iteration_trace, rate_matching_trace, llr_distribution_log]

  - family_id: ai_demodulation
    family_name: AI demodulation
    research_class: study_item_candidate
    objective: Compare AI-assisted demodulation against the mandatory non-AI baseline with confidence, fallback, and robustness reporting.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_ai_ml_packs.yaml
      override_label: ai_demodulation_candidate
    config_packs:
      - path: simulator/configs/scenarios/mandatory_ai_ml_packs.yaml
        role: baseline_anchor
        override_label: non_ai_baseline
      - path: simulator/configs/scenarios/mandatory_ai_ml_packs.yaml
        role: family_anchor
        override_label: ai_demodulation_candidate
      - path: simulator/configs/scenarios/ce_non_ai_baseline.yaml
        role: non_ai_reference
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: channel_mismatch
          source: ai_ml.channel_generalization_sweeps
          recommended_values: [matched, doppler_mismatch, delay_spread_mismatch]
        - name: inference_frequency
          source: ai_ml.inference_frequency
          recommended_values: [every_slot, every_2_slots, every_4_slots]
        - name: fallback_mode
          source: ai_ml.fallback_mode
          recommended_values: [disabled, confidence_gated, hard_guard]
    primary_kpis: [bler, throughput_mbps, inference_latency_us, confidence_calibration_error, fallback_rate]
    optional_kpis: [flop_count, parameter_count, memory_use_mb, robustness_drop_pct]
    mandatory_plots: [bler_ai_vs_non_ai, fallback_rate_vs_snr, confidence_reliability_curve, inference_cost_bar]
    pass_fail_expectations:
      - Every AI demodulation scenario must include a non-AI baseline pair.
      - Confidence and fallback behavior must be explicit; poor service quality may not be hidden behind semantic correctness.
      - Robustness sweeps must report degradation under mismatch instead of silently reverting behavior.
    typical_debug_traces: [ai_feature_tensor_trace, inference_call_log, confidence_trace, fallback_decision_log]

