    mandatory_plots: [bler_vs_snr_by_modulation, throughput_vs_mcs, evm_vs_qam_order, spectral_efficiency_bar]
    pass_fail_expectations:
      - Higher-order modulation gains must only appear where the BLER target remains satisfied.
      - Candidate 1024QAM and 4096QAM modes must remain clearly separated from baseline modulation families.
      - Power and EVM penalties must remain visible rather than being hidden behind throughput summaries.
    typical_debug_traces: [constellation_snapshot, llr_histogram, amc_selection_log, evm_trace]

  - family_id: probabilistic_shaping_distribution_matching
    family_name: probabilistic shaping / DM studies
    research_class: study_item_candidate
    objective: Compare CCDM, MPDM, ESS, ECC-DM, and arithmetic-related shaping choices, including retransmission behavior and pre-coding DM placement.
