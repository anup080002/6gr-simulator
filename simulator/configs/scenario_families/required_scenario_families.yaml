    mandatory_plots: [nmse_vs_feedback_mode, overhead_vs_accuracy, scheduler_gain_bar, generalization_heatmap]
    pass_fail_expectations:
      - AI CSI compression families must always be paired with the non-AI CSI baseline.
      - Overhead reduction claims must be reported together with reconstruction quality and scheduler impact.
      - Downloadable and non-downloadable AI model assumptions must remain explicit.
    typical_debug_traces: [csi_encoder_trace, latent_vector_snapshot, csi_decoder_trace, scheduler_application_log]

  - family_id: energy_efficiency_common_signal_clustering
