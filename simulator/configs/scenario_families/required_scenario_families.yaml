library_id: required_6g_phy_lls_scenario_families
version: "1.0"
description: >
  Required 6G PHY LLS scenario-family catalog. Each family defines its
  objective, baseline config anchor, supporting config packs, sweep
  dimensions, KPI expectations, plots, pass/fail expectations, and debug
  traces.
families:
  - family_id: nr_like_benchmark_baseline
    family_name: NR-like benchmark baseline
    research_class: baseline_benchmark
    objective: Establish the NR-like OFDM, LDPC, Polar, and conventional link-adaptation benchmark that all candidate 6G studies compare against.
    baseline_config:
      path: simulator/configs/scenarios/dl_4ghz_baseline.yaml
    config_packs:
      - path: simulator/configs/releases/nr_ofdm_nr_baseline.yaml
        role: release_profile
      - path: simulator/configs/bands/band_4ghz.yaml
        role: band_pack
      - path: simulator/configs/channels/tdl_c.yaml
        role: channel_pack
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: snr_db
          source: sweeps_and_matrix.snr_sweep
          recommended_values: [-5, 0, 5, 10, 15, 20]
        - name: rank
          source: mimo_and_beam_management.rank_set
          recommended_values: [1, 2]
        - name: channel_profile
          source: channel_model.model_family
          recommended_values: [TDL-C, CDL-D]
    primary_kpis: [bler, throughput_mbps, spectral_efficiency_bps_hz, cqi, ri, pmi]
    optional_kpis: [nmse_db, llr_histogram, rs_overhead_pct, energy_per_bit_nj]
    mandatory_plots: [bler_vs_snr, throughput_vs_snr, cqi_vs_sinr, rank_selection_histogram]
    pass_fail_expectations:
      - BLER should decrease monotonically across the baseline SNR sweep.
      - CQI and selected modulation should increase with improving channel quality.
      - No candidate-only features may be active in the benchmark reference.
    typical_debug_traces: [dmrs_channel_estimate, decoder_iteration_trace, amc_selection_log, resource_grid_snapshot]

  - family_id: band_700mhz_fdd_coverage
    family_name: 700 MHz FDD coverage
    research_class: baseline_benchmark
    objective: Characterize low-band FDD coverage, long-range robustness, and common-signal acquisition margins.
    baseline_config:
      path: simulator/configs/scenarios/dl_700mhz_coverage.yaml
    config_packs:
      - path: simulator/configs/scenarios/mandatory_general_scope_packs.yaml
        role: family_anchor
        override_label: around_700mhz
      - path: simulator/configs/bands/band_700mhz.yaml
        role: band_pack
      - path: simulator/configs/channels/tdl_c.yaml
        role: channel_pack
    sweep_definition:
      mode: generic_sweep
      dimensions:
        - name: snr_db
          source: sweeps_and_matrix.snr_sweep
          recommended_values: [-15, -10, -5, 0, 5, 10]
        - name: delay_spread_ns
          source: sweeps_and_matrix.delay_spread_sweep
          recommended_values: [100, 300, 1000]
        - name: common_signal_power_boost_db
          source: signals_and_channels_common.ssb.power_boost
          recommended_values: [-3, 0, 3]
    primary_kpis: [pbch_success_rate, pdcch_detection_rate, pdsch_bler, rsrp_dbm, effective_coverage_radius]
    optional_kpis: [search_latency_ms, false_alarm_rate, energy_per_successful_access_nj]
    mandatory_plots: [pbch_success_vs_snr, rsrp_vs_pathloss, pdsch_bler_vs_snr, access_latency_cdf]
    pass_fail_expectations:
      - PBCH and SIB-related control decoding must remain robust at low SNR operating points.
      - Coverage-oriented modulation and coding should favor reliability over peak throughput.
      - FDD timing and acquisition metrics should remain stable across the sweep.
    typical_debug_traces: [pss_sss_detection_log, pbch_crc_log, common_signal_beam_map, timing_estimator_trace]

  - family_id: band_2ghz_fdd_baseline
    family_name: 2 GHz FDD baseline
    research_class: baseline_benchmark
    objective: Provide an anchored mid-low-band FDD benchmark around 2 GHz for comparison against 700 MHz coverage and 4 GHz TDD baselines.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_general_scope_packs.yaml
      override_label: around_2ghz
      inline_overrides:
        frequency:
          duplex_mode: FDD
    config_packs:
      - path: simulator/configs/scenarios/mandatory_general_scope_packs.yaml
        role: family_anchor
        override_label: around_2ghz
      - path: simulator/configs/bands/band_2ghz.yaml
        role: band_pack
      - path: simulator/configs/releases/nr_ofdm_nr_baseline.yaml
        role: release_profile
    sweep_definition:
      mode: generic_sweep
      dimensions:
        - name: snr_db
          source: sweeps_and_matrix.snr_sweep
          recommended_values: [-10, -5, 0, 5, 10, 15]
        - name: bandwidth_hz
          source: sweeps_and_matrix.bandwidth_sweep
          recommended_values: [5000000, 20000000]
        - name: rank
          source: sweeps_and_matrix.rank_sweep
          recommended_values: [1, 2]
    primary_kpis: [bler, throughput_mbps, cqi, ri, pmi, rsrp_dbm]
    optional_kpis: [latency_ms, rs_overhead_pct, energy_per_bit_nj]
    mandatory_plots: [bler_vs_snr, throughput_vs_snr, cqi_vs_snr]
    pass_fail_expectations:
      - FDD benchmark behavior must remain close to the NR-like reference operating point.
      - Link-adaptation transitions should remain smooth across bandwidth and SNR sweeps.
      - Control and data channels must stay internally consistent across the family sweeps.
    typical_debug_traces: [amc_selection_log, decoder_iteration_trace, csi_report_trace]

  - family_id: band_4ghz_tdd_baseline
    family_name: 4 GHz TDD baseline
    research_class: agreed_starting_point
    objective: Provide the reference TDD mid-band starting point for DL/UL balance, control reliability, and CSI-assisted adaptation.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_tracking_packs.yaml
      override_label: tdd_4ghz_30khz
    config_packs:
      - path: simulator/configs/scenarios/dl_4ghz_baseline.yaml
        role: direct_scenario
      - path: simulator/configs/scenarios/mandatory_tracking_packs.yaml
        role: family_anchor
        override_label: tdd_4ghz_30khz
      - path: simulator/configs/bands/band_4ghz.yaml
        role: band_pack
    sweep_definition:
      mode: generic_sweep
      dimensions:
        - name: snr_db
          source: sweeps_and_matrix.snr_sweep
          recommended_values: [-5, 0, 5, 10, 15, 20]
        - name: tdd_common
          source: frame_timing.tdd_common
          recommended_values: [standard_common_pattern, common_plus_dedicated_override]
        - name: ue_speed_kmh
          source: sweeps_and_matrix.speed_sweep
          recommended_values: [3, 30, 120]
    primary_kpis: [bler, throughput_mbps, latency_ms, cqi, ri, harq_success_rate]
    optional_kpis: [nmse_db, scheduling_delay_ms, rs_overhead_pct]
    mandatory_plots: [throughput_vs_snr, bler_vs_snr, latency_cdf, cqi_time_series]
    pass_fail_expectations:
      - TDD baseline must sustain stable DL and UL channel quality reporting across mobility points.
      - HARQ and CQI behavior should remain consistent with the NR-like agreed starting point.
      - No study-item candidate feature should be required for baseline operation.
    typical_debug_traces: [harq_process_log, cqi_report_trace, slot_allocation_trace, channel_snapshot_trace]

  - family_id: band_7ghz_wideband_high_capacity
    family_name: 7 GHz wideband / high-capacity
    research_class: agreed_starting_point
    objective: Exercise wideband 7 GHz operation with larger bandwidth, higher-order MIMO capability, and capacity-oriented link adaptation.
    baseline_config:
      path: simulator/configs/scenarios/dl_7ghz_mimo4x4.yaml
    config_packs:
      - path: simulator/configs/scenarios/mandatory_general_scope_packs.yaml
        role: family_anchor
        override_label: around_7ghz
      - path: simulator/configs/bands/band_7ghz.yaml
        role: band_pack
      - path: simulator/configs/mimo/mimo_4x4.yaml
        role: mimo_pack
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: snr_db
          source: sweeps_and_matrix.snr_sweep
          recommended_values: [0, 5, 10, 15, 20, 25]
        - name: bandwidth_hz
          source: sweeps_and_matrix.bandwidth_sweep
          recommended_values: [20000000, 100000000]
        - name: rank
          source: sweeps_and_matrix.rank_sweep
          recommended_values: [1, 2, 3, 4]
    primary_kpis: [throughput_mbps, spectral_efficiency_bps_hz, bler, ri, pmi, beamforming_gain_db]
    optional_kpis: [nmse_db, condition_number, per_layer_sinr_db, energy_per_bit_nj]
    mandatory_plots: [throughput_vs_snr, spectral_efficiency_vs_rank, rank_usage_histogram, beam_gain_cdf]
    pass_fail_expectations:
      - Capacity should scale with SNR and rank until BLER targets or channel condition limits are hit.
      - Beamforming and PMI selection must track the channel state consistently.
      - Wideband operation should not violate resource-grid or RS-overhead sanity checks.
    typical_debug_traces: [precoder_selection_log, beam_search_scores, per_layer_llr_trace, wideband_channel_estimate]

  - family_id: band_30ghz_high_band_beam_centric
    family_name: 30 GHz high-band beam-centric
    research_class: study_item_candidate
    objective: Study high-band beam-centric operation with sparse coverage, beam tracking, and high-SCS tracking requirements.
    baseline_config:
      path: simulator/configs/scenarios/dl_30ghz_beam_tracking.yaml
    config_packs:
      - path: simulator/configs/scenarios/mandatory_general_scope_packs.yaml
        role: family_anchor
        override_label: around_30ghz
      - path: simulator/configs/bands/band_30ghz.yaml
        role: band_pack
      - path: simulator/configs/channels/cdl_d.yaml
        role: channel_pack
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: snr_db
          source: sweeps_and_matrix.snr_sweep
          recommended_values: [-5, 0, 5, 10, 15, 20]
        - name: beam_count
          source: sweeps_and_matrix.beam_count_sweep
          recommended_values: [4, 8, 16]
        - name: ue_speed_kmh
          source: sweeps_and_matrix.speed_sweep
          recommended_values: [3, 30, 120]
    primary_kpis: [beam_tracking_success_rate, throughput_mbps, bler, tracking_phase_error_deg, beam_switch_latency_ms]
    optional_kpis: [trs_nmse_db, search_latency_ms, energy_per_tracking_update_nj]
    mandatory_plots: [beam_tracking_success_vs_snr, throughput_vs_beam_count, phase_error_cdf, beam_switch_latency_cdf]
    pass_fail_expectations:
      - Beam tracking and refinement must improve or maintain link quality relative to fixed-beam baselines.
      - High-band synchronization and tracking metrics must remain bounded across mobility sweeps.
      - Capacity-oriented modulation should degrade gracefully under beam mismatch stress.
    typical_debug_traces: [beam_tracking_log, trs_observation_trace, cfo_phase_tracker_log, beam_pair_selection_trace]

  - family_id: tracking_rs_synchronization_stress
    family_name: tracking RS / synchronization stress
    research_class: study_item_candidate
    objective: Stress synchronization, CFO, phase-tracking, TRS, and tracking-RS behavior across time-frequency tracking assumptions.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_tracking_packs.yaml
      override_label: cfo_initial_acquisition
    config_packs:
      - path: simulator/configs/scenarios/mandatory_tracking_packs.yaml
        role: family_anchor
        override_label: cfo_initial_acquisition
      - path: simulator/configs/scenarios/cfo_stress.yaml
        role: stress_scenario
      - path: simulator/configs/scenarios/phase_noise_stress.yaml
        role: stress_scenario
      - path: simulator/configs/scenarios/high_doppler_stress.yaml
        role: stress_scenario
    sweep_definition:
      mode: generic_sweep
      dimensions:
        - name: cfo_profile
          source: synchronization_and_tracking.cfo_estimator
          recommended_values: [initial_acquisition, non_initial_acquisition, drift_study]
        - name: ue_speed_kmh
          source: sweeps_and_matrix.speed_sweep
          recommended_values: [3, 120, 350, 500]
        - name: delay_spread_ns
          source: sweeps_and_matrix.delay_spread_sweep
          recommended_values: [30, 100, 300, 1000]
    primary_kpis: [sync_success_rate, cfo_residual_hz, timing_error_samples, trs_nmse_db, tracking_failure_rate]
    optional_kpis: [phase_error_deg, search_latency_ms, complexity_per_slot]
    mandatory_plots: [residual_cfo_vs_speed, timing_error_cdf, trs_nmse_vs_snr, sync_success_vs_impairment]
    pass_fail_expectations:
      - Residual timing and frequency error must remain bounded after tracking convergence.
      - Tracking-RS and TRS chains must show measurable benefit under drift and Doppler stress.
      - One-shot acquisition modes must report honest miss-detection behavior when they fail.
    typical_debug_traces: [coarse_timing_trace, cfo_estimator_trace, trs_tracking_log, phase_tracker_log]

  - family_id: pdcch_reliability_blind_decoding_blocking
    family_name: PDCCH reliability / blind-decoding / blocking
    research_class: study_item_candidate
    objective: Study control-channel reliability, blind-decoding burden, blocking resilience, and aggregation-level behavior.
    baseline_config:
      path: simulator/configs/scenarios/pdcch_blind_decode_sweep.yaml
    config_packs:
      - path: simulator/configs/scenarios/mandatory_pdcch_packs.yaml
        role: family_anchor
        override_label: slot_level_monitoring_baseline
      - path: simulator/configs/scenarios/mandatory_pdcch_packs.yaml
        role: stress_anchor
        override_label: control_blocking_stress
      - path: simulator/configs/control/pdcch_baseline.yaml
        role: control_pack
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: aggregation_level
          source: pdcch.aggregation_levels
          recommended_values: [1, 2, 4, 8, 16]
        - name: blind_decode_budget
          source: pdcch.max_blind_decodes
          recommended_values: [8, 16, 24, 32]
        - name: blocking_mode
          source: pdcch.control_blocking_eval_policy
          recommended_values: [baseline, control_blocking, interference_limited, puncturing]
    primary_kpis: [dci_detection_rate, false_alarm_rate, blind_decode_count, control_blocking_rate, pdcch_bler]
    optional_kpis: [energy_per_blind_decode_nj, cce_utilization_pct, detection_feedback_accuracy]
    mandatory_plots: [dci_detection_vs_al, false_alarm_vs_blind_decode_budget, blocking_rate_bar, blind_decode_energy_cdf]
    pass_fail_expectations:
      - False-alarm and miss-detection accounting must remain explicit for every search-space configuration.
      - Detection probability should improve with aggregation level in equivalent conditions.
      - Blocking and puncturing stress must visibly degrade performance rather than silently flattening metrics.
    typical_debug_traces: [blind_decode_log, crc_mask_check_log, candidate_generation_trace, control_energy_log]

  - family_id: ul_waveform_cp_ofdm_vs_dfts_ofdm
    family_name: UL waveform CP-OFDM vs DFT-s-OFDM
    research_class: study_item_candidate
    objective: Compare UL CP-OFDM and DFT-s-OFDM baselines and candidate low-PAPR extensions under power-limited and non-power-limited operation.
    baseline_config:
      path: simulator/configs/scenarios/ul_4ghz_cpofdm.yaml
    config_packs:
      - path: simulator/configs/scenarios/ul_4ghz_cpofdm.yaml
        role: baseline_scenario
      - path: simulator/configs/scenarios/ul_4ghz_dfts_pi2bpsk.yaml
        role: comparison_scenario
      - path: simulator/configs/scenarios/mandatory_ul_waveform_packs.yaml
        role: family_anchor
        override_label: ul_cp_ofdm_all_layers
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: ul_waveform
          source: waveform.ul_waveform
          recommended_values: [CP-OFDM, DFT-S-OFDM]
        - name: low_papr_mode
          source: waveform.low_papr_mode
          recommended_values: [disabled, pi_over_2_bpsk, tone_reservation, truncation]
        - name: layer_count
          source: sweeps_and_matrix.rank_sweep
          recommended_values: [1, 2, 4]
    primary_kpis: [ul_bler, ul_throughput_mbps, papr_db, pa_backoff_db, energy_per_bit_nj]
    optional_kpis: [evm_pct, dmrs_nmse_db, uci_reliability]
    mandatory_plots: [ul_bler_vs_snr, papr_ccdf, throughput_vs_waveform, energy_per_bit_vs_waveform]
    pass_fail_expectations:
      - Single-layer DFT-s-OFDM should demonstrate lower PAPR than CP-OFDM baselines.
      - Candidate low-PAPR features must show explicit trade-offs in performance and complexity.
      - Multi-layer candidate DFT-s-OFDM studies must retain honest failure behavior if unsupported settings are used.
    typical_debug_traces: [ul_waveform_snapshot, papr_trace, pa_model_log, dmrs_estimation_trace]

  - family_id: dl_based_csi_acquisition
    family_name: DL-based CSI acquisition
    research_class: agreed_starting_point
    objective: Benchmark DL reference-signal-based CSI acquisition, CQI/PMI/RI/CRI generation, and scheduler-facing CSI quality.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
      override_label: dl_based_csi
    config_packs:
      - path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
        role: family_anchor
        override_label: dl_based_csi
      - path: simulator/configs/reference_signals/csi_tracking_baseline.yaml
        role: rs_pack
    sweep_definition:
      mode: generic_sweep
      dimensions:
        - name: csi_rs_density
          source: reference_signals.nzp_csi_rs.time_density
          recommended_values: [sparse, medium, dense]
        - name: report_periodicity_ms
          source: csi_acquisition_and_reporting.report_periodicity
          recommended_values: [5, 10, 20, 40]
        - name: codebook_mode
          source: csi_acquisition_and_reporting.codebook_framework
          recommended_values: [type1_su_mimo, type2_mu_mimo, etype2_candidate]
    primary_kpis: [cqi_accuracy, pmi_selection_consistency, ri_accuracy, cri_accuracy, sgcs, nmse_db]
    optional_kpis: [feedback_overhead_bits, report_latency_ms, scheduler_gain_pct]
    mandatory_plots: [nmse_vs_snr, cqi_accuracy_vs_density, pmi_mode_histogram, report_overhead_bar]
    pass_fail_expectations:
      - CQI, PMI, RI, and CRI outputs must remain self-consistent with the measured channel state.
      - CSI-RS density increases should improve estimation quality or reduce report uncertainty.
      - Candidate codebook modes must remain explicitly labeled and comparable to the baseline.
    typical_debug_traces: [csi_rs_observation_trace, csi_report_payload_trace, pmi_candidate_score_log, channel_estimation_grid]

  - family_id: ul_based_csi_acquisition
    family_name: UL-based CSI acquisition
    research_class: agreed_starting_point
    objective: Benchmark SRS-driven UL CSI acquisition, reciprocity-oriented channel inference, and estimation quality across port and periodicity choices.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
      override_label: ul_based_csi
    config_packs:
      - path: simulator/configs/scenarios/ul_7ghz_srs_csi.yaml
        role: direct_scenario
      - path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
        role: family_anchor
        override_label: ul_based_csi
      - path: simulator/configs/reference_signals/csi_tracking_baseline.yaml
        role: rs_pack
    sweep_definition:
      mode: generic_sweep
      dimensions:
        - name: srs_ports
          source: reference_signals.srs.num_ports
          recommended_values: [1, 2, 4, 8]
        - name: srs_periodicity_ms
          source: csi_acquisition_and_reporting.report_periodicity
          recommended_values: [5, 10, 20, 40, 80, 160]
        - name: srs_sequence_family
          source: reference_signals.srs.sequence_type
          recommended_values: [baseline, low_papr_candidate, low_correlation_candidate]
    primary_kpis: [sgcs, nmse_db, ri_accuracy, reciprocity_error_db, csi_latency_ms]
    optional_kpis: [srs_overhead_pct, energy_per_srs_report_nj, beam_selection_accuracy]
    mandatory_plots: [nmse_vs_srs_periodicity, sgcs_vs_port_count, reciprocity_error_cdf, srs_overhead_bar]
    pass_fail_expectations:
      - SRS-driven estimation quality must improve with stronger port diversity when the channel supports it.
      - Periodicity sweeps must expose the overhead versus freshness trade-off directly.
      - Low-PAPR or low-correlation candidate sequences must be identifiable as candidate-only behavior.
    typical_debug_traces: [srs_observation_trace, reciprocity_mapping_log, csi_estimator_trace, port_selection_log]

  - family_id: joint_dl_ul_csi_acquisition
    family_name: joint DL/UL CSI acquisition
    research_class: study_item_candidate
    objective: Study combined DL and UL CSI acquisition with joint report synthesis, reciprocity, and feedback trade-offs.
    baseline_config:
      path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
      override_label: joint_dl_ul_csi
    config_packs:
      - path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
        role: family_anchor
        override_label: joint_dl_ul_csi
      - path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
        role: reference_anchor
        override_label: tdd_reciprocity_operation
      - path: simulator/configs/scenarios/mandatory_csi_acquisition_packs.yaml
        role: reference_anchor
        override_label: fdd_feedback_operation
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: acquisition_mode
          source: csi_acquisition_and_reporting.joint_dl_ul_csi_enabled
          recommended_values: [joint_baseline, reciprocity_oriented, feedback_oriented]
        - name: report_periodicity_ms
          source: sweeps_and_matrix.report_periodicity_sweep
          recommended_values: [5, 10, 20, 40]
        - name: codebook_mode
          source: csi_acquisition_and_reporting.codebook_framework
          recommended_values: [type1_su_mimo, type2_mu_mimo, etype2_candidate]
    primary_kpis: [csi_fusion_accuracy, cqi_accuracy, pmi_consistency, ri_accuracy, cri_accuracy, report_overhead_bits]
    optional_kpis: [scheduler_gain_pct, reciprocity_error_db, report_latency_ms]
    mandatory_plots: [fusion_accuracy_vs_snr, overhead_vs_periodicity, pmi_consistency_heatmap, scheduler_gain_bar]
    pass_fail_expectations:
      - Joint CSI families must show whether combining DL and UL information improves report quality or scheduler utility.
      - Report overhead and latency must remain explicit across feedback-oriented and reciprocity-oriented modes.
      - Candidate codebook and joint-report modes must remain separable from the baseline.
    typical_debug_traces: [joint_csi_merge_log, csi_payload_trace, scheduler_application_log, codebook_selection_log]

  - family_id: prach_initial_access_beam_management
    family_name: PRACH / initial access / beam management
    research_class: study_item_candidate
    objective: Cover SSB, PBCH, PRACH, SSB-RO mapping, beam sweep, and beam refinement studies for initial access.
    baseline_config:
      path: simulator/configs/scenarios/prach_detection.yaml
    config_packs:
      - path: simulator/configs/scenarios/prach_detection.yaml
        role: direct_scenario
      - path: simulator/configs/scenarios/mandatory_initial_access_packs.yaml
        role: family_anchor
        override_label: periodic_ssb_baseline
      - path: simulator/configs/scenarios/mandatory_initial_access_packs.yaml
        role: beam_anchor
        override_label: beam_sweep_clustering
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: ssb_periodicity_ms
          source: signals_and_channels_common.ssb.periodicity
          recommended_values: [20, 40, 80, 160]
        - name: prach_format
          source: prach.format_set
          recommended_values: [A1, A2, B1, long]
        - name: beam_policy
          source: prach.msg1_beam_policy
          recommended_values: [same_beam, different_beam, predicted_beam]
    primary_kpis: [prach_detection_rate, miss_detection_rate, false_alarm_rate, access_latency_ms, beam_pair_success_rate]
    optional_kpis: [ta_error_samples, msg3_success_rate, common_signal_energy_nj]
    mandatory_plots: [prach_detection_vs_snr, access_latency_cdf, beam_pair_success_bar, ta_error_cdf]
    pass_fail_expectations:
      - Detection, miss, and false-alarm accounting must remain explicit for every PRACH configuration.
      - SSB and RO mapping changes must produce measurable effects on access latency and beam success metrics.
      - Candidate beam prediction and refinement modes must remain clearly tagged as non-baseline behavior.
    typical_debug_traces: [prach_correlation_trace, ssb_beam_sweep_log, beam_refinement_trace, msg2_msg3_linkage_log]

  - family_id: harq_latency_reliability_tradeoff
    family_name: HARQ latency-reliability trade-off
    research_class: agreed_starting_point
    objective: Study HARQ process count, RV sequencing, combining, stop conditions, and feedback timing trade-offs between latency and reliability.
    baseline_config:
      path: simulator/configs/scenarios/harq_process_sweep.yaml
    config_packs:
      - path: simulator/configs/scenarios/harq_process_sweep.yaml
        role: direct_scenario
      - path: simulator/configs/scenarios/mandatory_harq_packs.yaml
        role: family_anchor
      - path: simulator/configs/control/harq_baseline.yaml
        role: harq_pack
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: process_count
          source: harq.process_count
          recommended_values: [4, 8, 16]
        - name: max_retx
          source: harq.max_retx
          recommended_values: [1, 2, 4]
        - name: combining_mode
          source: harq.combining_mode
          recommended_values: [chase, incremental_redundancy]
    primary_kpis: [harq_success_rate, median_latency_ms, p95_latency_ms, retx_count, reliability_target_hit_rate]
    optional_kpis: [feedback_overhead_bits, ue_energy_per_success_nj, scheduler_retx_utilization]
    mandatory_plots: [latency_reliability_tradeoff_curve, retx_histogram, success_rate_vs_process_count, combining_gain_bar]
    pass_fail_expectations:
      - Reliability should improve with additional HARQ opportunities at the expected latency and overhead cost.
      - DL and UL HARQ behavior may differ, but both must remain internally consistent.
      - Stop conditions and DTX handling must remain explicit in the logged outcomes.
    typical_debug_traces: [harq_process_log, rv_sequence_trace, ack_nack_dtx_log, combining_buffer_trace]

  - family_id: high_order_modulation_and_coding_chain
    family_name: high-order modulation and coding chain
    research_class: study_item_candidate
    objective: Stress high-order modulation, higher code rates, and modulation-aware mapping across DL and UL data channels.
    baseline_config:
      path: simulator/configs/scenarios/high_order_modulation_stress.yaml
    config_packs:
      - path: simulator/configs/scenarios/high_order_modulation_stress.yaml
        role: direct_scenario
      - path: simulator/configs/scenarios/mandatory_coding_modulation_packs.yaml
        role: family_anchor
        override_label: 1024qam_candidate
      - path: simulator/configs/scenarios/mandatory_coding_modulation_packs.yaml
        role: candidate_anchor
        override_label: 4096qam_candidate
    sweep_definition:
      mode: native_matrix
      dimensions:
        - name: qam_order
          source: modulation_and_mapping.qam_order
          recommended_values: [64, 256, 1024, 4096]
        - name: mcs_index
          source: sweeps_and_matrix.mcs_sweep
