tdoc10512:
  schema_version: sixgr.rach.tdoc10512.v1
  agenda_item: "10.5.1.2"
  campaign_mode: analytical
  campaign_id: ran1_10512
  master_seed: 10512001
  speed_of_light_mps: 299792458
  target_delay:
    channel_excess_delay_quantile_us: 0.3
    timing_margin_us: 0.3
    precompensation_error_us: 0.0
  analytical:
    timing_allowance_us: 0.3
    collision_preamble_counts: [64, 128, 256]
    collision_attempt_counts: [1, 2, 4, 8, 16, 32, 64]
    partition_counts: [1, 2, 4, 8, 16]
    unbalanced_attempts: [40, 8, 8, 8]
    root_ncs_values: [1, 2, 4, 6, 8, 10, 12, 13, 15, 18, 22, 26, 32, 38, 46, 59, 76, 93]
    root_target_preambles: [64, 128, 256]
    rar_entries: [4, 8, 16, 32]
    nr_rar_bytes_per_entry: 8
    expanded_rar_bytes_per_entry: 9
    root_sequence_length: 139
  procedure:
    receiver_cases:
      - id: PRACH_ONLY
        prach_detected: true
        msga_valid: false
        other_ue_evidence: false
        description: PRACH detected with no valid MsgA
      - id: PRACH_AND_MSGA
        prach_detected: true
        msga_valid: true
        other_ue_evidence: false
        description: PRACH and valid MsgA with no evidence of another UE
      - id: MIXED_SAME_PREAMBLE
        prach_detected: true
        msga_valid: true
        other_ue_evidence: true
        description: Same preamble used by PRACH-only and PRACH-plus-MsgA UEs
      - id: AMBIGUOUS_MSGA
        prach_detected: true
        msga_valid: false
        other_ue_evidence: true
        description: MsgA is ambiguous or undecodable
    response_policies:
      - id: MSGB_ONLY
        research_class: study_item_candidate
      - id: RAR_ONLY
        research_class: study_item_candidate
      - id: COMBINED_MSGB_PLUS_FALLBACK_GRANT
        research_class: study_item_candidate
      - id: ALL_SAME_PREAMBLE_FALLBACK_TO_4STEP
        research_class: study_item_candidate
  frequency_stress_mode: study_table_screening
  waveform_frequency_stress_mode: physical_channel_plus_residual_cfo
  result_classification:
    analytical: ANALYTICAL_DERIVATION
    smoke: QUICK_SANITY_MODEL
    engineering_lls: ENGINEERING_LLS
    core_lls: CALIBRATED_LLS
    full: MULTICELL_SLS
  engineering:
    full_ra_snr_db: [20]
    full_ra_trials_per_snr: 3
    full_ra_seed: 10512101
    pucch_ack_snr_db: [0, 10, 20]
    pucch_trials_per_point: 3
    pucch_formats: [0, 1]
    contention_snr_db: 20
    negative_false_rar_trials: 3
    cfo_offsets_hz: [-250, 0, 250]
    cfo_trials_per_point: 3
    type2_trials_per_tier: 3
    type2_tiers:
      - tier: 3
        inter_cell_relative_power_db: -6
      - tier: 4
        inter_cell_relative_power_db: -12
      - tier: 5
        inter_cell_relative_power_db: -18
    msg3_link_budget:
      ue_pcmax_dbm: 23
      receiver_noise_density_dbm_hz: -174
      gnb_noise_figure_db: 5
      implementation_loss_db: 0
    complete_fit_trials: 2000
    complete_fit_seed: 10512901
