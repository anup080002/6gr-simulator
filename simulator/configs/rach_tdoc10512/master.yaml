meta:
  scenario_id: ran1_10512_prach_rach
  description: Config-driven PRACH/RACH evidence campaign using the canonical SixGR waveform and RA chains.
  version: "1.0"
  owner: SixGR
  research_class: study_item_candidate
  maturity_tag: experimental
  scenario_group: initial_access
  tags: [prach, rach, ran1_10_5_1_2, waveform_truth]

scenario:
  name: ran1_10512_prach_rach
  description: Reusable PRACH/RACH TDoc campaign adapter over sixgr.rach, sixgr.phy.prach, and sixgr.phy.ra.
  runner_profile: prach_strict_validation
  target_cases: [prach]
  bundle_anchor_cases: [prach_strict_validation]
  honesty_mode: strict

simulation:
  # The RAN1 LLS curves use a received-waveform SNR reference.  Geometry
  # and link-budget studies must select receiver_noise_figure_thermal_noise
  # in their own YAML instead of inheriting this normalized LLS setting.
  noise_operating_mode: standalone_awgn_snr_argument

