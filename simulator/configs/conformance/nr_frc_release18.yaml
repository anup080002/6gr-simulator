    "scope_statement": "This catalog contains twenty-one selected Release 18 conformance operating points: the ten Phase 1 gate anchors plus eleven representative coverage records spanning FDD PDSCH QPSK through 256QAM and ranks 1 through 4, and selected FR1 and FR2 PUSCH families including 16QAM, 256QAM, and rank-4 codebook transmission. It is not a complete transcription of the PDSCH reference measurement channels in TS 38.101-4 Annex A or the PUSCH G-FR1-A*/G-FR2-A* fixed reference channel families in TS 38.104 Annex A.",
    "operating_point_count": 21,
    "unique_frc_count": 19,
    "downlink": {
      "standard_key": "ts_38_101_4",
      "standards_role": "UE receiver PDSCH demodulation requirements; the UE is the downlink receiver.",
      "operating_point_count": 11,
      "unique_frc_count": 9,
      "represented_modulations": ["QPSK", "16QAM", "64QAM", "256QAM"],
      "represented_layers": [1, 2, 3, 4],
      "known_gaps": [
        "FR2, TDD, HD-FDD, RedCap, HST, carrier-aggregation, multi-TRP, interference, 1024QAM, and other Annex A reference-channel families are not represented."
      ]
    },
    "uplink": {
      "standard_key": "ts_38_104",
      "standards_role": "Base-station receiver PUSCH demodulation requirements; the gNB is the uplink receiver.",
      "operating_point_count": 10,
      "unique_frc_count": 10,
      "represented_modulations": ["QPSK", "16QAM", "64QAM", "256QAM"],
      "represented_layers": [1, 4],
      "known_gaps": [
        "Only eight selected FR1 and two selected FR2-1 operating points are represented.",
        "The complete G-FR1-A*/G-FR2-A* Annex A families, including other allocations, transform-precoding choices, two-layer configurations, most multi-layer antenna configurations, FR2-2, and other propagation conditions, are not represented."
      ]
    },
    "standards_role_boundary": "TS 38.101-4 does not define a UE-Rx PUSCH demodulation FRC because the UE transmits PUSCH. TS 38.104 does not define a gNB-Rx PDSCH demodulation FRC because the gNB transmits PDSCH."
