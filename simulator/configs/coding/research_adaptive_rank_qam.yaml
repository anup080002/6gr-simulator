# ILLA thresholds must be generated by actual coded calibration for this
# exact allocation/receiver; this file contains no invented SINR thresholds.
research_adaptation:
  enabled: true
  candidate_modulations: [1024QAM, 1024QAM, 256QAM]
  candidate_layers: [2, 4, 4]
  candidate_code_rates: [0.9, 0.9, 0.9]
  bootstrap_candidate: 3
  target_bler: 0.1
  ack_step_db: 0.05
  margin_min_db: -5
  margin_max_db: 5
  max_measurement_age_slots: 16
  calibration_file: results/research_adaptation_calibration/trials.csv
  calibration_snr_db: [28, 30, 32]
  calibration_trials_per_point: 30
  calibration_confidence: 0.95
