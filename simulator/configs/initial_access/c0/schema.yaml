allowed_run_modes: [smoke, quick_sanity, tdoc, exhaustive]
allowed_research_classes: [baseline_benchmark, agreed_starting_point, study_item_candidate, optional_research_experiment]
allowed_channels: [AWGN, TDL-C, CDL-C]
allowed_normalizations: [equal_epre, equal_total_energy, equal_tf_resource]
allowed_candidates: [A20RB4]
allowed_declaration_statistics: [minimum_pss_sss_normalized_metric]
allowed_fine_cfo_methods: [cyclic_prefix]
allowed_pbch_component_residual_cfo_models: [reuse_practical_estimate]
