run:
  # Bounded execution of the complete C0 processing and artifact path.
  # This is QUICK_SANITY, never TDOC, and cannot satisfy TDoc statistics.
  mode: quick_sanity
  max_trials_per_snr: 1000
  min_errors_per_snr: 100
  checkpoint_interval: 100
  developer_allow_non_tdoc_tdoc_figures: true
false_alarm:
  calibration_trials: 10000
  validation_trials: 10000
snr:
  # Exercise deep-failure, waterfall, and clean high-SNR operating regions.
  coarse_grid_db: [-20, -16, -12, -8, -4, 0, 20]
