# Full, operator-owned WebGUI LLS campaign derived from the canonical SINR master.
# The inherited master supplies the complete PHY/MAC/control/reporting surface;
# every field below is an intentional override for this 64x4 coupled MU-MIMO run.
inherits: master_sinr_sweep.yaml

# Directional digital/RF-chain capacities are explicit because two rank-2
# users require four simultaneous gNB spatial streams.  Physical element
# counts remain 64 at the gNB and 4 at each UE.
antenna_and_array:
  bs_num_txrus: 4
  bs_num_rxrus: 4
  ue_num_txrus: 2
  ue_num_rxrus: 4

canonical_control:
  identity:
    scenario_id: webgui_sinr_sweep_64x4_mu_mimo_full
    scenario_name: Full WebGUI SINR sweep — 64x4 coupled MU-MIMO
    description: Full CDL-C waveform LLS sweep at -20, 0, and 20 dB with one 64-element gNB, four 4-element UEs, element-domain hybrid precoding, and slot-coupled MU-MIMO truth execution.
    version: 1.0.0
    owner: operator
    research_class: study_item_candidate
    maturity_tag: experimental
    purpose: Complete WebGUI-launched multi-user waveform LLS execution for the requested 64x4 antenna configuration.
    baseline_reference_name: master_sinr_sweep
    comparison_group_name: coupled_mu_mimo_64x4_three_point_sinr
    tags:
      - lls
      - webgui
      - cdl_c
      - sinr_sweep
      - mu_mimo
      - 64tx
      - 4rx
      - slot_coupled_truth
      - waveform_bundle
  launch:
    runner_profile: waveform_bundle
    target_cases: [bundle]
    bundle_anchor_cases: [dl_pdsch_throughput, ul_pusch_throughput]
    expected_outputs:
      - reports/csv/scenario_summary.csv
      - reports/csv/runtime_operating_mode.csv
      - reports/csv/run_classification.csv
      - reports/csv/slot_trace.csv
      - reports/csv/live_control_gating_summary.csv
      - reports/csv/config_roundtrip_verification.csv
      - reports/csv/browser_runtime_db_consistency.csv
      - reports/csv/summary_vs_raw_consistency.csv
      - reports/csv/value_source_audit.csv
      - air_interface/csv/dl_pdsch_trials.csv
      - air_interface/csv/ul_pusch_trials.csv
      - packet_flow/csv/live_dl_scheduler_grants.csv
      - packet_flow/csv/live_ul_scheduler_grants.csv
    honesty_mode: strict
    unsupported_output_policy: show_unavailable_with_reason
    provenance_logging: true
    notes: The three configured values control post-CDL waveform noise injection; receiver-derived post-equalization SINR remains separately reported.
    run_class: adaptive_system_diagnostic
    scenario_mode: sinr_sweep_coupled_mu_mimo
    sweep_enabled: true
    fixed_link_campaign_enabled: false
    geometry_enabled: false
  run:
    seed: 104729
    deterministic_mode: true
    link_direction: both
    n_frames: 1
    total_slots: 20
    total_time_ms: 10
    warmup_slots: 0
    measurement_slots: 20
    n_subframes: 10
    monte_carlo_iterations: 1
    num_seeds: 1
    seed_list: [104729]
    campaign_mode: single_seed_coupled_truth
    fixed_link_campaign_enabled: false
    fixed_link_snr_grid_db: [-20, 0, 20]
    min_campaign_snr_points: 3
    # Twenty coupled slots per point provide a diagnostic sweep, not a
    # publication-scale confidence campaign. Require two real trials in an
    # aggregate measured-SINR bin and retain every raw trial in the export.
    min_trials_per_sinr_bin: 2
    snr_db: 0
    noise_operating_mode: standalone_awgn_snr_argument
    snr_sweep_offsets_db: []
    reference_sweep_enabled: true
    reference_trials_per_snr: 1
    harq_diagnostics_enabled: true
    adaptive_sweep_enabled: true
    adaptive_sweep_step_db: 2
    adaptive_sweep_max_points: 12
    max_raw_rows_per_sweep: 0
    execution_mode: LLS
    study_mode: campaign
    simulation_mode: full_phy
    run_profile: exhaustive
    trace_capture_level: full
    save_intermediate: true
    fixed_link_campaign_only: false
  radio:
    # Keep the requested full 64x4 element-domain channel, but use a
    # diagnostic 10 MHz carrier so the 64x4 CDL tensor remains bounded.
    # This is an explicit scenario choice, not a runtime hardcoded cap.
    bandwidth_hz: 10000000
    bandwidth_options_hz: [10000000]
    occupied_bandwidth_hz: 8640000
    n_size_grid: 24
    sample_rate_hz: 15360000
    fft_size: 512
  channel:
    model_type: CDL
    profile: CDL-C
    delay_spread_ns: 100
    doppler_hz: 0
    doppler_source_mode: configured
    mobility_kmph: 0
    los_enabled: false
    spatial_consistency_enabled: false
    pathloss_enabled: false
    shadow_fading_enabled: false
    pathloss_model: nrPathLoss
    shadow_fading_std_db: 6
    inter_cell_execution_mode: none
  topology:
    site_layout: hex_grid
    cell_type: UMa
    num_sites: 1
    num_sectors_per_site: 1
    num_cells: 1
    num_trps: 1
    num_ues: 4
    users_enabled: true
    rnti_start: 1
    seed_stride: 17
    execution_model: slot_coupled_truth
    beam_selection_strategy: runtime_best_beam_per_link
    save_user_tables: true
  antenna:
    bs_array_geometry: URA
    ue_array_geometry: ULA
    bs_num_antenna_elements: 64
    ue_num_antenna_elements: 4
    bs_panel_count: 2
    ue_panel_count: 1
    polarization: dual
    element_spacing_h: 0.5
    element_spacing_v: 0.5
    digital_precoder_family: wideband
  mimo:
    mode: mu_mimo
    n_tx_ant: 64
    n_rx_ant: 4
    n_layers: 2
    max_dl_layers: 2
    max_ul_layers: 2
    max_simultaneous_ue_dl: 2
    max_simultaneous_ue_ul: 2
    precoder_type: wideband
    codebook_type: type2
    beam_codebook_type: type2_mu_mimo
    beam_sweep_enabled: true
    beam_count: 32
    panel_count: 2
    trp_count: 1
    reciprocity_mode: TDD
    hybrid_beamforming_flag: true
    rank_adaptation_enable: false
    rank_adaptation_policy: fixed_rank_anchor
    su_mu_selection_policy: proportional_fair_mu
    mu_mimo_enable: true
    ul_mu_mimo_enable: true
    mu_mimo_max_users_per_prb: 2
    # A pair is admitted only after a causal SRS-derived, executable spatial
    # filter meets both bounds. These are operator inputs, not report-time
    # thresholds or configured-value substitutions.
    mu_mimo_precoder_leakage_threshold_db: -15
    mu_mimo_minimum_desired_subspace_gain_db: -30
    mu_mimo_hybrid_rf_design_policy: measured_srs_phase_only_subarray
  scheduler:
    type: PF
    # Two simultaneously scheduled UEs match the configured spatial
    # multiplexing limit. PF still rotates all four configured UEs.
    max_active_ues_per_slot: 2
    max_active_ues_per_cell_per_slot: 2
    max_active_ues_per_cell_per_slot_dl: 2
    max_active_ues_per_cell_per_slot_ul: 2
    max_prb_allocation_per_ue: 24
    fairness_alpha: 1.0
    proportional_fair_window_ms: 100
    beam_aware: true
    energy_aware: true
    qos_aware: true
    slice_aware: true
    starvation_guard: true
    cell_edge_boost: true
    # This scenario is an explicit waveform SNR sweep. Every configured
    # operating point must execute; the scheduler must not censor low-SNR
    # samples before the PHY can measure their BLER/BER.
    coverageOutageGuardEnabled: false
    minSchedulingSINR_dB: -100
    tbsMode: faithful
    fastNREApprox: false
  reference_signals:
    ssb_enabled: true
    pbch_enabled: true
    pdcch_dmrs_enabled: true
    csi_rs_enabled: true
    srs_enabled: true
    trs_enabled: true
    tracking_rs_enabled: true
    ptrs_enabled: true
    ptrs_cpe_correction_enabled: true
    csi_feedback_mode: PMI+CQI+RI+CRI
    csi_acquisition_mode: joint_dl_ul
    operation_orientation: tdd_reciprocity
    dmrs_csi_tracking_enabled: true
    csi_reporting_enabled: true
    cqi_reporting_enabled: true
    pmi_reporting_enabled: true
    ri_reporting_enabled: true
    cri_reporting_enabled: true
    pdsch_dmrs_ports: 2
    pusch_dmrs_ports: 2
    csi_rs_ports: 4
    srs_ports: 4
    trs_ports: 1
    srs_max_ues_per_slot: 4
    srs_scheduling_policy: multiplex_due_users
  control:
    pdcch_enabled: true
    blind_search_enabled: true
    pucch_enabled: true
    # Four six-PRB bitmap groups exactly cover this scenario's 24-PRB BWP.
    coreset_frequency_resources: [1, 1, 1, 1]
    # A 24-PRB, two-symbol CORESET contains eight CCEs. Do not inherit the
    # qualification master's aggregation-level-16 candidate, which cannot
    # exist in this bounded runtime CORESET.
    aggregation_levels: [4, 8]
    candidate_aggregation_levels: [4, 8]
    scheduler_aggregation_level: 4
    aggregation_selection_policy: configured_scheduler_level
    search_space_num_candidates: [0, 0, 2, 1, 0]
    pbch_required: false
    prach_required: false
    pdcch_required: false
    srs_required: false
    trs_required: false
    srs_max_age_slots: 20
    trs_max_age_slots: 20
    pre_attach_ues_before_measurement: true
    # The strict contextual PDCCH builder consumes these operator-control
    # fields after the public pdcch aliases. Keep the DCI widths and CORESET
    # inside this scenario's 24-PRB carrier instead of inheriting the
    # 273/72-PRB qualification-master values.
    pdcch_strict:
      dci_context:
        initial_dl_bwp_size: 24
        active_dl_bwp_size: 24
        initial_ul_bwp_size: 24
        active_ul_bwp_size: 24
      coreset:
        n_rb: 24
        rb_start: 0
      search_space:
        # Keep the contextual blind-search contract consistent with the
        # public bounded-CORESET candidate vector above.  The strict builder
        # intentionally gives this contextual structure final authority.
        num_candidates: [0, 0, 2, 1, 0]
  initial_access:
    enabled: true
    ssb:
      enabled: true
      # FR1 NCRBSSB/KSSB use the 15 kHz Point-A common raster. For this
      # 10 MHz, 30 kHz, 24-PRB carrier, 4*12*15 kHz places the 7.2 MHz
      # SSB inside the 8.64 MHz active grid.
      n_crb_ssb: 4
      k_ssb: 0
    mib:
      enabled: true
    sib1:
      enabled: true
      decode_from_waveform_required: false
    rrc:
      require_setup_complete: false
  random_access:
    enabled: true
    four_step_ra_required: false
    msg4_contention_resolution_required: false
    msg3_enabled: true
    min_detection_trials: 8
  random_access_evidence:
    four_step_ra_required: false
    msg1_prach_required: false
    msg2_rar_pdcch_pdsch_required: false
    msg3_pusch_required: false
    msg4_contention_resolution_required: false
    ra_rnti_decode_required: false
    rar_mac_ce_decode_required: false
  csi:
    cqi_policy: adaptive
    pmi_policy: adaptive
    ri_policy: adaptive
    cri_policy: adaptive
    pmi_codebook_mode: type2_mu_mimo
  energy:
    enabled: true
    tx_power_dbm: 46
    pa_efficiency: 0.35
    rf_chain_count: 64
  output:
    profiler_enabled: false
    # Publish lightweight run state every slot, but rebuild the expensive
    # derived browser gallery only at campaign start and final completion.
    live_heavy_refresh_interval_frames: 20
    live_heavy_refresh_each_sweep_point: false
  runtime_overrides:
    - path: output.emit_disabled_audit_artifacts
      value: true
    - path: output.persist_to_database
      value: true
    - path: output.persist_to_results_folder
      value: true
    - path: interference.inter_cell_interference_flag
      value: false
    - path: interference.intra_cell_interference_flag
      value: true
    - path: interference.intra_cell_execution_mode
      value: shared_slot_waveform_superposition
    - path: link_adaptation.fixed_or_amc
      value: amc
    - path: link_adaptation.rank_adaptation_policy
      value: fixed_rank_anchor
    - path: link_adaptation.al_adaptation_policy
      value: cqi_driven
    - path: link_adaptation.cqi_source
      value: csi_feedback
    - path: link_adaptation.pdsch_link_adaptation_policy
      value: cqi_driven
    - path: link_adaptation.pusch_link_adaptation_policy
      value: cqi_driven
    - path: link_adaptation.initial_mcs
      value: 1
    - path: link_adaptation.maximum_mcs
      value: 20
    - path: link_adaptation.bootstrap_mcs_index
      value: 1
    - path: receiver_algorithms.ssb_cfo_search_bw_hz
      value: 0
    - path: synchronization.max_timing_uncertainty_samples
      value: 0
  pdsch:
    execution_profile: scheduler_truth
    prb_start: 0
    num_prb: 24
    # Keep inherited legacy aliases identical to the canonical MIMO/data
    # operating point.  These remain configuration inputs; the runtime
    # authority builder rejects contradictory duplicates before execution.
    layer_count: 2
    modulation: 256QAM
  harq:
    enabled: true
    k2: 4

# Adaptive MCS is a policy range, not an exact configured-MCS claim.
# Bootstrap starts conservatively; measured CQI/OLLA may select up to
# MCS 20 while the rank remains the fixed two-layer anchor above.
link_adaptation:
  initial_mcs: 1
  maximum_mcs: 20
  bootstrap_mcs_index: 1

csi_acquisition_and_reporting:
  # This is the production buildInternalConfig authority consumed by
  # SchedulerPF and the waveform precoder path.
  pmi_codebook_mode: type2_mu_mimo
  joint_dl_ul_csi_enabled: true
  joint_port_mapping_policy: explicit_joint_port_map
  joint_timeline_policy: scheduler_defined_joint_timeline

pucch_resources:
  enabled: true
  # K1 resolves DL feedback onto the special slot of the D,D,D,F,U
  # pattern. That slot has 12 DL symbols, one guard symbol, and only
  # symbol 13 for UL. Resource 0 is therefore a one-symbol Format-0
  # HARQ-ACK resource; the remaining resources retain the master catalog
  # allocations for full-UL-slot SR/CSI operation.
  resources:
  - id: 0
    format: 0
    starting_prb: 0
    nrof_prbs: 1
    starting_symbol: 13
    nrof_symbols: 1
    intra_slot_hopping: false
    second_hop_start_prb: null
    initial_cyclic_shift: 0
    occ_length: 1
    occ_index: 0
    additional_dmrs: false
    pi2_bpsk: false
    nid: 1
    hopping_id: 1
  - id: 1
    format: 1
    starting_prb: 1
    nrof_prbs: 1
    starting_symbol: 10
    nrof_symbols: 4
    intra_slot_hopping: false
    second_hop_start_prb: null
    initial_cyclic_shift: 3
    occ_length: 1
    occ_index: 0
    additional_dmrs: false
    pi2_bpsk: false
    nid: 1
    hopping_id: 1
  - id: 10
    format: 2
    starting_prb: 4
    nrof_prbs: 2
    starting_symbol: 12
    nrof_symbols: 2
    intra_slot_hopping: false
    second_hop_start_prb: null
    initial_cyclic_shift: 0
    occ_length: 1
    occ_index: 0
    additional_dmrs: false
    pi2_bpsk: false
    nid: 1
    hopping_id: 1
  - id: 11
    format: 3
    starting_prb: 8
    nrof_prbs: 2
    starting_symbol: 10
    nrof_symbols: 4
    intra_slot_hopping: true
    second_hop_start_prb: 20
    initial_cyclic_shift: 0
    occ_length: 1
    occ_index: 0
    additional_dmrs: true
    pi2_bpsk: true
    nid: 1
    hopping_id: 1
  - id: 12
    format: 4
    starting_prb: 12
    nrof_prbs: 1
    starting_symbol: 10
    nrof_symbols: 4
    intra_slot_hopping: false
    second_hop_start_prb: null
    initial_cyclic_shift: 0
    occ_length: 2
    occ_index: 0
    additional_dmrs: false
    pi2_bpsk: false
    nid: 1
    hopping_id: 1

tdd_timing:
  pdcch_to_pusch_k2: 4
  ul_grant_k2: 4

bwp:
  dl:
    n_start_bwp: 0
    n_size_bwp: 24
  ul:
    n_start_bwp: 0
    n_size_bwp: 24
  component_carriers:
  - cc_id: 0
    serving_cell_id: 1
    scheduling_cc_ids: [0]
    center_frequency_hz: 4000000000
    band: lab_default_n77_style_midband
    frequency_range: FR1
    channel_bandwidth_mhz: 10
    duplex_mode: TDD
    dl_carrier_grid:
      n_start_grid: 0
      n_size_grid: 24
      scs_khz: 30
    ul_carrier_grid:
      n_start_grid: 0
      n_size_grid: 24
      scs_khz: 30
    carrier_indicator_map:
    - indicator: 0
      scheduled_cc_id: 0

pdsch6gr:
  harq_enabled: true
  channel_bandwidth_mhz: 10
  n_size_grid: 24
  n_tx: 64
  n_rx: 4
  num_layers: 2
  dmrs_num_ports: 2
  dmrs_port_set: [0, 1]

pdsch:
  execution_profile: scheduler_truth
  prb_start: 0
  num_prb: 24
  layer_count: 2
  modulation: 256QAM

pusch:
  prb_start: 0
  num_prb: 24
  layer_count: 2
  num_layers: 2
  num_antenna_ports: 2
  modulation: 256QAM
  mcs_index: 20
  dmrs_port_set: [0, 1]

# A count-only AWGN shortcut cannot exercise the configured physical array.
# CDL-C consumes the same runtime 64-element gNB and 4-element UE array
# objects as the element-domain PDSCH/PUSCH waveform paths.
channels:
  model_type: CDL
  profile: CDL-C
  delay_spread_ns: 100
  doppler_hz: 0
  doppler_source_mode: configured
  mobility_kmph: 0
  normalize_path_gains: true
  normalize_channel_outputs: true
  spatial_consistency_enabled: false
  pathloss_enabled: false
  shadow_fading_enabled: false
  los_enabled: false

validation:
  run_class: adaptive_system_diagnostic
  fixed_snr_sweep_required: false
  geometry_evidence_required: false
  fixed_link_campaign:
    enabled: false
    fixed_reference_mode: false
    single_user_mode: false
    configuration_authority: master_yaml
    direction: both
    channel_model: AWGN
    noise_operating_mode: standalone_awgn_snr_argument
    snr_db: [-20, 0, 20]

control_gating:
  pre_attach_ues_before_measurement: true
  pbch_required: false
  prach_required: false
  pdcch_required: false
  srs_required: false
  srs_max_age_slots: 20
  trs_required: false
  trs_max_age_slots: 20

sweeps_and_matrix:
  snr_sweep:
    enabled: true
    values_db: [-20, 0, 20]
  fixed_link_calibration:
    enabled: false
    only: false
    direction: both
    channel_model: AWGN
    snr_db: [-20, 0, 20]
