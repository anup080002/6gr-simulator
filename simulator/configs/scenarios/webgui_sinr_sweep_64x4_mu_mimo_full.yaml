    bs_per_rf_chain_power_w: 10
    bs_sleep_power_w: 20
    bs_pa_efficiency: 0.35
    ue_idle_power_w: 1.0
    ue_rx_power_w: 1.5
    ue_sleep_power_w: 0.1
    ue_tx_dc_per_watt_rf: 2.857142857142857
    bs_tx_power_dbm: 46
    ue_tx_power_dbm: 23
    bs_rf_chain_count: 32
    ue_rf_chain_count: 4
  output:
    backend: filesystem
    persistence_mode: results_folder
    persist_to_database: false
    persist_to_results_folder: true
    save_figures: false
    generate_summary_plots: false
    profiler_enabled: true
    profiler_top_functions: 20000
    profiler_top_edges: 50000
    export_ssb_beam_sweep: true
    # Publish lightweight run state every slot, but rebuild the expensive
