    - path: output.persist_to_database
      value: false
    - path: output.persist_to_results_folder
      value: true
    - path: interference.inter_cell_interference_flag
      value: false
    - path: interference.intra_cell_interference_flag
      value: true
    - path: interference.intra_cell_execution_mode
      value: shared_slot_waveform_superposition
    - path: link_adaptation.fixed_or_amc
      value: amc
    - path: link_adaptation.operating_point_mode
      value: bounded_adaptive
    - path: link_adaptation.rank_adaptation_policy
      value: fixed_rank_anchor
    - path: link_adaptation.al_adaptation_policy
      value: cqi_driven
    - path: link_adaptation.cqi_source
      value: csi_feedback
    - path: link_adaptation.pdsch_link_adaptation_policy
      value: cqi_driven
    - path: link_adaptation.pusch_link_adaptation_policy
      value: cqi_driven
    - path: link_adaptation.initial_mcs
      value: 1
    - path: link_adaptation.maximum_mcs
      value: 20
    - path: link_adaptation.bootstrap_mcs_index
      value: 1
    - path: link_adaptation.mu_mimo_first_data_bootstrap_enabled
      value: true
    - path: link_adaptation.mu_mimo_first_data_bootstrap_policy
      value: yaml_mcs_until_first_data_feedback
    - path: link_adaptation.mu_mimo_first_data_mcs_index
      value: 1
    - path: link_adaptation.dl_mu_mimo_first_data_mcs_index
      value: 1
    - path: link_adaptation.ul_mu_mimo_first_data_mcs_index
      value: 1
    - path: receiver_algorithms.ssb_cfo_search_bw_hz
      value: 0
    - path: synchronization.max_timing_uncertainty_samples
      value: 0
  pdsch:
    execution_profile: scheduler_truth
    prb_start: 0
    num_prb: 273
    # Keep inherited legacy aliases identical to the canonical MIMO/data
    # operating point.  These remain configuration inputs; the runtime
    # authority builder rejects contradictory duplicates before execution.
    layer_count: 2
    rank: 2
    modulation: 256QAM
  harq:
    enabled: true
    k2: 4

# Adaptive MCS is a policy range, not an exact configured-MCS claim.
# Bootstrap starts conservatively; measured CQI/OLLA may select up to
# MCS 20 while the rank remains the fixed two-layer anchor above.
link_adaptation:
  initial_mcs: 1
  maximum_mcs: 20
  bootstrap_mcs_index: 1
  # SRS remains the causal rank/spatial-pairing authority. Its pilot-only
  # SINR is not treated as a post-MU data SINR before the first decoded data
  # report, so both directions use this conservative YAML-owned first TB.
  mu_mimo_first_data_bootstrap_enabled: true
  mu_mimo_first_data_bootstrap_policy: yaml_mcs_until_first_data_feedback
  mu_mimo_first_data_mcs_index: 1
  dl_mu_mimo_first_data_mcs_index: 1
  ul_mu_mimo_first_data_mcs_index: 1

analytics:
  # This supported top-level authority enables the measured SSB/PBCH/SIB1
  # beam-sweep export; the eight-beam CSI analytics remain independently
  # controlled by the CSI and beam-management sections.
  export_beam_analytics: true

csi_acquisition_and_reporting:
  # This is the production buildInternalConfig authority consumed by
  # SchedulerPF and the waveform precoder path.
  pmi_codebook_mode: type2_mu_mimo
  joint_dl_ul_csi_enabled: true
  joint_port_mapping_policy: explicit_joint_port_map
  joint_timeline_policy: scheduler_defined_joint_timeline

pucch_resources:
  enabled: true
  # K1 resolves DL feedback onto the special slot of the D,D,D,F,U
  # pattern. That slot has 12 DL symbols, one guard symbol, and only
  # symbol 13 for UL. Resource 0 is therefore a one-symbol Format-0
  # HARQ-ACK resource; the remaining resources retain the master catalog
  # allocations for full-UL-slot SR/CSI operation.
  resources:
  - id: 0
    format: 0
    starting_prb: 0
    nrof_prbs: 1
    starting_symbol: 13
    nrof_symbols: 1
    intra_slot_hopping: false
    second_hop_start_prb: null
