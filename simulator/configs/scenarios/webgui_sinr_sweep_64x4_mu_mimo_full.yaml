# Full, operator-owned WebGUI LLS campaign derived from the canonical SINR master.
# The inherited master supplies the complete PHY/MAC/control/reporting surface;
# every field below is an intentional override for this 64x4 coupled MU-MIMO run.
inherits: master_sinr_sweep.yaml

# Directional digital/RF-chain capacities are explicit. The measured SRS
# signatures in this frequency-selective scenario retain up to 18 peer
# modes, so four TX chains cannot leave the two-dimensional nullspace needed
# by a rank-2 user. Thirty-two TX chains provide a hardware-realizable
# two-elements-per-subarray hybrid mapping; 64 RX chains match the element-
# domain branches actually consumed by the UL IRC receiver. Physical element
# counts remain 64 at the gNB and 4 at each UE.
antenna_and_array:
  bs_num_txrus: 32
  bs_num_rxrus: 64
  ue_num_txrus: 2
  ue_num_rxrus: 4
  # Two dual-polarized panels share the declared 64 physical elements; the
  # element count is total across panels and polarization branches.
  bs_panel_count: 2
  reciprocity_assumption: tdd_reciprocity

# The physical channel realization has its own scenario authority. Per-UE
# payload, decoder and HARQ seeds may be offset without changing the
# reciprocal UL-SRS/DL-PDSCH propagation channel used by MU precoding.
seeds:
  channel_seed: 104729

canonical_control:
  identity:
    scenario_id: webgui_sinr_sweep_64x4_mu_mimo_full
    scenario_name: Full WebGUI n78 initial-access SINR sweep — 64x4 coupled MU-MIMO
    description: True-waveform 3.5 GHz, 100 MHz, 30 kHz SCS TDD CDL-C LLS sweep at -20, 0, and 20 dB with a 64-element dual-polarized gNB, four 4-element UEs, four SSB beams, eight CSI measurement beams, strict initial access, and slot-coupled MU-MIMO execution.
    version: 2.0.0
    owner: operator
    research_class: study_item_candidate
    maturity_tag: experimental
    purpose: Complete WebGUI-launched multi-user waveform LLS execution including cell search, PBCH/MIB, Type-0 SIB1, PRACH miss/false-detection analysis, four-step random access, and RRC Setup Complete.
    baseline_reference_name: master_sinr_sweep
    comparison_group_name: coupled_mu_mimo_64x4_three_point_sinr
    tags:
      - lls
      - webgui
      - cdl_c
      - n78
      - 3p5ghz
      - 100mhz
      - tdd
      - sinr_sweep
      - mu_mimo
      - initial_access
      - four_step_ra
      - ssb_4beam
      - csirs_8beam
      - 64tx
      - 4rx
      - slot_coupled_truth
      - waveform_bundle
  launch:
    runner_profile: waveform_bundle
    target_cases: [bundle]
    # These are the waveform LinkLevelRunner anchor names. PDCCH, strict
    # PRACH/SRS/TRS, Channel/RF and four-step-RA evidence is enabled by the
    # explicit feature/gating sections below and runs in the supplemental
    # strict-evidence stage rather than being mislabeled as a link anchor.
    bundle_anchor_cases: [cell_search_mib_sib1, prach_detection, dl_pdsch_throughput, ul_pusch_throughput, ul_srs_channelest]
    expected_outputs:
      - reports/csv/scenario_summary.csv
      - reports/csv/runtime_operating_mode.csv
      - reports/csv/run_classification.csv
      - reports/csv/slot_trace.csv
      - reports/csv/live_control_gating_summary.csv
      - reports/csv/config_roundtrip_verification.csv
      - reports/csv/browser_runtime_db_consistency.csv
      - reports/csv/summary_vs_raw_consistency.csv
      - reports/csv/value_source_audit.csv
      - control/csv/ssb_pbch_sib1_beam_sweep.csv
      - control/csv/prach_trials.csv
      - control/csv/prach_missed_detection_sweep.csv
      - control/csv/prach_false_alarm_sweep.csv
      - control/csv/prach_detection_summary.csv
      - control/csv/prach_probability_sweep.csv
      - control/csv/prach_correlation_trace.csv
      - reports/csv/initial_access_trace.csv
      - reports/csv/rrc_setup_complete.csv
      - air_interface/csv/dl_pdsch_trials.csv
      - air_interface/csv/ul_pusch_trials.csv
      - packet_flow/csv/live_dl_scheduler_grants.csv
      - packet_flow/csv/live_ul_scheduler_grants.csv
    honesty_mode: strict
    unsupported_output_policy: show_unavailable_with_reason
    provenance_logging: true
    notes: The three configured values control post-CDL waveform noise injection; receiver-derived post-equalization SINR is reported separately. PRACH miss and false-detection sweeps are waveform trials and are not inferred from configured thresholds.
    run_class: adaptive_system_diagnostic
    scenario_mode: sinr_sweep_coupled_mu_mimo
    sweep_enabled: true
    fixed_link_campaign_enabled: false
    geometry_enabled: false
  run:
    seed: 104729
    deterministic_mode: true
    link_direction: both
    n_frames: 2
    total_slots: 40
    total_time_ms: 20
    warmup_slots: 0
    measurement_slots: 40
    n_subframes: 20
    monte_carlo_iterations: 1
    num_seeds: 1
    seed_list: [104729]
    campaign_mode: single_seed_coupled_truth
    fixed_link_campaign_enabled: false
    fixed_link_snr_grid_db: [-20, 0, 20]
    min_campaign_snr_points: 3
    # Forty coupled slots per point retain strict initial access and leave
    # repeated post-feedback DL/UL TDD opportunities for bidirectional
    # throughput and causal MU-MIMO measurement. This remains a single-seed
    # production diagnostic, not a publication confidence campaign.
    min_trials_per_sinr_bin: 2
    snr_db: 0
    noise_operating_mode: standalone_awgn_snr_argument
    snr_sweep_offsets_db: []
    reference_sweep_enabled: true
    reference_trials_per_snr: 1
    harq_diagnostics_enabled: true
    adaptive_sweep_enabled: true
    adaptive_sweep_step_db: 2
    adaptive_sweep_max_points: 12
    max_raw_rows_per_sweep: 0
    execution_mode: LLS
    study_mode: campaign
    simulation_mode: full_phy
    run_profile: exhaustive
    trace_capture_level: full
    save_intermediate: true
    fixed_link_campaign_only: false
  radio:
    range_name: FR1
    band_name: n78
    center_frequency_hz: 3500000000
    bandwidth_hz: 100000000
    bandwidth_options_hz: [100000000]
    occupied_bandwidth_hz: 98300000
