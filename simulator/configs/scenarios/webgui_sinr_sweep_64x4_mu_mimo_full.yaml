    msg2_pdsch:
      ptrs_enabled: true
      ptrs_port_set: [0]
      ptrs_time_density: 1
      ptrs_frequency_density: 2
      ptrs_re_offset: '00'
    msg3_pusch:
      ptrs_enabled: true
      ptrs_port_set: [0]
      ptrs_time_density: 1
      ptrs_frequency_density: 2
      ptrs_re_offset: '00'
    msg4_pdsch:
      ptrs_enabled: true
      ptrs_port_set: [0]
      ptrs_time_density: 1
      ptrs_frequency_density: 2
      ptrs_re_offset: '00'
    setup_complete_pusch:
      ptrs_enabled: true
      ptrs_port_set: [0]
      ptrs_time_density: 1
      ptrs_frequency_density: 2
      ptrs_re_offset: '00'
  random_access_evidence:
    four_step_ra_required: true
    msg1_prach_required: true
    msg2_rar_pdcch_pdsch_required: true
    msg3_pusch_required: true
    msg4_contention_resolution_required: true
    ra_rnti_decode_required: true
    rar_mac_ce_decode_required: true
    timing_advance_required: true
    contention_resolution_identity_required: true
    preamble_collision_test_enabled: true
    false_alarm_test_enabled: true
    missed_detection_test_enabled: true
  csi:
    cqi_policy: adaptive
    pmi_policy: adaptive
    ri_policy: adaptive
    cri_policy: adaptive
    pmi_codebook_mode: type2_mu_mimo
  energy:
