tdd_timing:
  pdcch_to_pusch_k2: 4
  ul_grant_k2: 4

bwp:
  dl:
    n_start_bwp: 0
    n_size_bwp: 273
  ul:
    n_start_bwp: 0
    n_size_bwp: 273
  component_carriers:
  - cc_id: 0
    serving_cell_id: 1
    scheduling_cc_ids: [0]
    center_frequency_hz: 3500000000
    band: n78
    frequency_range: FR1
    channel_bandwidth_mhz: 100
    duplex_mode: TDD
    dl_carrier_grid:
      n_start_grid: 0
      n_size_grid: 273
      scs_khz: 30
    ul_carrier_grid:
      n_start_grid: 0
      n_size_grid: 273
      scs_khz: 30
    carrier_indicator_map:
    - indicator: 0
      scheduled_cc_id: 0

pdsch6gr:
  harq_enabled: true
  enable_ptrs: true
  channel_bandwidth_mhz: 100
  n_size_grid: 273
  n_tx: 64
  n_rx: 4
  num_layers: 2
  dmrs_num_ports: 2
  dmrs_port_set: [0, 1]

pdsch:
  execution_profile: scheduler_truth
  prb_start: 0
  num_prb: 273
  layer_count: 2
  rank: 2
  modulation: 256QAM

pusch:
  execution_profile: scheduler_truth
  prb_start: 0
  num_prb: 273
  layer_count: 2
  num_layers: 2
  num_antenna_ports: 2
  transmission_scheme: codebook
  codebook_based_transmission: true
  codebook_type: codebook1_ng1n4n1
  tpmi: 0
  modulation: 256QAM
  mcs_index: 20
  dmrs_port_set: [0, 1]
  ptrs_enabled: true
  srs_authority:
    required: true
    max_age_slots: 20
    configuration_epoch_required: true
    configured_tpmi_fallback_allowed: false

# Top-level runtime authority mirrors the detailed canonical-control surface.
# buildInternalConfig consumes this resolved section after inheritance; keep
# it explicit so the SINR master cannot silently leave PT-RS disabled.
reference_signals:
  ptrs_enabled: true
  ptrs_port_association_policy: first_scheduled_dmrs_port
  ptrs_time_density: 2
  ptrs_frequency_density: 2
  ptrs_re_offset: '00'
  num_rb: 273
  expected_rb_start: 0
  expected_num_rb: 273
  expected_bandwidth_coverage_percent: 100
  coverage_requirement: full_carrier
  full_carrier_sounding_required: true
  full_carrier_coverage_tolerance_rb: 1

# A count-only AWGN shortcut cannot exercise the configured physical array.
# CDL-C consumes the same runtime 64-element gNB and 4-element UE array
# objects as the element-domain PDSCH/PUSCH waveform paths.
channels:
  runtime_element_expansion_chunk_samples: 4096
  model_type: CDL
  profile: CDL-C
  delay_spread_ns: 100
  doppler_hz: 0
  doppler_source_mode: configured
  mobility_kmph: 0
  normalize_path_gains: true
  normalize_channel_outputs: true
  spatial_consistency_enabled: false
  pathloss_enabled: false
  shadow_fading_enabled: false
  los_enabled: false

# The browser contract exposes channel-path and angle-spread evidence for
# fading scenarios. Produce it through the strict waveform-backed Channel/RF
# validator instead of inferring angles from configured delay spread.
channel_rf_configured_vs_applied:
  enabled: true
  require_channel_realization_id: true
  require_rf_impairment_chain_id: true
  require_waveform_hash_before_after_channel: true
  require_waveform_hash_before_after_rf: true
  require_path_gains_hash_for_cdl_tdl: true
  require_doppler_evidence: true
  require_noise_power_validation: true
  require_cfo_before_after_evidence: true
  require_phase_noise_evidence: true
  require_iq_imbalance_evidence: true
  require_pa_nonlinearity_evidence: true
  fail_if_cdl_configured_awgn_applied: true
  fail_if_impairment_configured_but_hash_unchanged: true
  fail_if_downstream_trials_lack_channel_reference: true

validation:
  run_class: adaptive_system_diagnostic
  fixed_snr_sweep_required: false
  geometry_evidence_required: false
  fixed_link_campaign:
    enabled: false
    fixed_reference_mode: false
    single_user_mode: false
    configuration_authority: master_yaml
    direction: both
    channel_model: AWGN
    noise_operating_mode: standalone_awgn_snr_argument
    snr_db: [-20, 0, 20]

# Raster publication is owned by the strict artifact-contract engine below.
# Disable the legacy waveform-summary plotters so an exact WebGUI run cannot
# mix their historical image layouts with the canonical per-component PNGs.
# Raw same-chain CSV evidence remains enabled and is consumed in memory by the
# contract adapters; this switch affects only uncontracted legacy figures.
output:
  save_figures: false
  generate_summary_plots: false

control_gating:
  pre_attach_ues_before_measurement: false
  pbch_required: true
  prach_required: true
  pdcch_required: true
  pucch_required: true
  srs_required: true
  srs_max_age_slots: 20
  trs_required: true
  trs_max_age_slots: 20

sweeps_and_matrix:
  snr_sweep:
    enabled: true
    state_policy: independent_link_state_per_point
    # This scenario qualifies initial access at every configured SNR. Each
    # point therefore starts from SEARCHING/PENDING and must generate its own
    # SSB/PBCH/PRACH/Msg2/Msg3/Msg4/RRCSetupComplete waveform evidence.
    initial_access_state_policy: independent_per_point
    values_db: [-20, 0, 20]
  fixed_link_calibration:
    enabled: false
    only: false
    direction: both
    channel_model: AWGN
    snr_db: [-20, 0, 20]
