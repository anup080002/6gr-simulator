inherits:
  - ./lls_true_snr_sweep_awgn_1ue.yaml

canonical_control:
  run:
    fixed_link_snr_grid_db: [-2, 4, 10]
    snr_db: -2
    noise_operating_mode: standalone_awgn_snr_argument
    min_trials_per_sinr_bin: 20
    max_trials_per_sinr_bin: 40
    num_workers: 1
    batch_size_links: 1
    auto_start_parallel_pool: false

run_control:
  num_workers: 1
  batch_size_links: 1
  auto_start_parallel_pool: false

simulation:
  snr_db: -2
  noise_operating_mode: standalone_awgn_snr_argument

validation:
  fixed_link_campaign:
    snr_db: [-2, 4, 10]
    min_tb_per_point: 20
    max_tb_per_point: 40

sweeps_and_matrix:
  snr_sweep:
    enabled: true
    values_db: [-2, 4, 10]
  fixed_link_calibration:
    enabled: true
    only: true
    snr_db: [-2, 4, 10]
    min_trials: 20
    max_trials: 40
    trials_per_drop: 10
