inherits:
  - ./lls_tdd_5mhz_rank2_shared_awgn_snr_sweep_saturated.yaml

meta:
  scenario_id: lls_tdd_2ghz_5mhz_rank2_shared_awgn_snr_sweep_saturated
  description: >
    NR band n39, 1.900 GHz, 5 MHz TDD, saturated-load, adaptive-rank physical
    waveform sweep at 40, 30, 20, 10, 0, -10, -20 and -30 dB. This is an
    evaluation carrier, not an operating-band conformance declaration.
  purpose: >
    Exercise the complete shared-clock 4TX/2RX rank-one/rank-two link,
    initial access, beam management, PDCCH, PDSCH, PUSCH, PUCCH, CSI-RS,
    SRS, TRS, PT-RS, HARQ, ILLA and OLLA at independent fixed-SNR points.
  research_class: optional_research_experiment
  tags: [lls, truth, tdd, 2ghz, 5mhz, saturated, adaptive-rank, shared-control, no-proxy]

# Keep every frequency-bearing authority aligned to the concrete TS 38.101-1
# n39 TDD band. Exact 2.000 GHz would resolve to an FDD band in SIB1 and is
# therefore not a valid TDD contribution configuration.
frequency:
  band_name: n39_1900mhz_5mhz_tdd
  center_frequency_hz: 1900000000
  bandwidth_hz: 5000000
  bandwidth_options_hz: [5000000]
  duplex_mode: TDD
  numerology_options_khz: [15]
  n_size_grid: 25

global_radio_scope:
  duplex_mode: TDD
  carrier_frequency_hz: 1900000000
  channel_bandwidth_hz: 5000000
  simulation_bandwidth_hz: 5000000
  occupied_bandwidth_hz: 4500000
  scs_hz: 15000
  numerology_mu: 0
  sample_rate_hz: 7680000
  fft_size: 512
  ifft_size: 512

random_access:
  frequency_range: FR1
  duplex_mode: TDD
  carrier_frequency_hz: 1900000000
  carrier_scs_khz: 15
  n_size_grid: 25

bwp:
  component_carriers:
    - cc_id: 0
      serving_cell_id: 1
      scheduling_cc_ids: [0]
      center_frequency_hz: 1900000000
      band: n39
      frequency_range: FR1
      channel_bandwidth_mhz: 5
      duplex_mode: TDD
      dl_carrier_grid: {n_start_grid: 0, n_size_grid: 25, scs_khz: 15}
      ul_carrier_grid: {n_start_grid: 0, n_size_grid: 25, scs_khz: 15}
      carrier_indicator_map:
        - {indicator: 0, scheduled_cc_id: 0}

scenario:
  runner_profile: generic_sweep
  sweep:
    base_profile: waveform_bundle
    execution_error_policy: retain_failure_and_continue
    output_name: lls_tdd_2ghz_5mhz_rank2_shared_awgn_snr_sweep_saturated
    overrides:
      - label: snr_40_db
        config:
          meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_40db}
          simulation: {snr_db: 40}
          # Detector qualification is SNR-independent and executes once.
          random_access_evidence:
            false_alarm_test_enabled: true
            missed_detection_test_enabled: true
          random_access:
            statistical_qualification:
              enabled: true
          control:
            pdcch_strict:
              statistical_qualification:
                enabled: true
                target_false_alarm_probability: 0.01
                confidence_level: 0.95
                minimum_waveform_trials: 25
                maximum_waveform_trials: 1000
                batch_size_waveform_trials: 25
                minimum_candidate_decisions: 500
                minimum_false_alarm_events: 0
                ci_width_target: 0.01
                planned_looks: 40
                deterministic_seeds: [240617, 240629, 240643, 240647]
            pucch_strict:
              statistical_qualification:
                enabled: true
                format: 2
                trials_per_hypothesis: 512
                confidence_level: 0.95
                target_false_alarm_probability: 0.01
                target_missed_feedback_probability: 0.01
                signal_present_snr_db: 20
                seed_base: 731001
          output: {profile: lls_tdd_2ghz_5mhz_rank2_40db}
      - {label: snr_30_db,  config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_30db},  simulation: {snr_db: 30},  output: {profile: lls_tdd_2ghz_5mhz_rank2_30db}}}
      - {label: snr_20_db,  config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_20db},  simulation: {snr_db: 20},  output: {profile: lls_tdd_2ghz_5mhz_rank2_20db}}}
      - {label: snr_10_db,  config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_10db},  simulation: {snr_db: 10},  output: {profile: lls_tdd_2ghz_5mhz_rank2_10db}}}
      - {label: snr_0_db,   config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_0db},   simulation: {snr_db: 0},   output: {profile: lls_tdd_2ghz_5mhz_rank2_0db}}}
      - {label: snr_m10_db, config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_m10db}, simulation: {snr_db: -10}, output: {profile: lls_tdd_2ghz_5mhz_rank2_m10db}}}
      - {label: snr_m20_db, config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_m20db}, simulation: {snr_db: -20}, output: {profile: lls_tdd_2ghz_5mhz_rank2_m20db}}}
      - {label: snr_m30_db, config: {meta: {scenario_id: lls_tdd_2ghz_5mhz_rank2_m30db}, simulation: {snr_db: -30}, output: {profile: lls_tdd_2ghz_5mhz_rank2_m30db}}}

output:
  profile: lls_tdd_2ghz_5mhz_rank2_shared_awgn_snr_sweep_saturated
