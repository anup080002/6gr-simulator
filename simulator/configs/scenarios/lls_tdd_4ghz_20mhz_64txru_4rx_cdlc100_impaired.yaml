inherits:
  - ./h4_100_cdlc100_connected_impaired_40db_adaptation.yaml
  - ../bands/n77_20mhz_15khz_tdd.yaml

meta:
  scenario_id: lls_tdd_4ghz_20mhz_64txru_4rx_cdlc100_impaired
  description: >
    Local 20 MHz TDD companion to the server's 100 MHz connected run.
    Nominal 4 GHz, 106 PRBs, 15 kHz data SCS, normal CP, 2048 FFT and 30.72 MSa/s;
    two-panel 64-TXRU gNB and four-chain UE with measured adaptive DL/UL rank
    up to four. Retains physical access, four SSB and eight CSI-RS beams,
    TCI/QCL, CSI/SRS, ILLA/OLLA, HARQ, CDL-C/100 ns and declared RF treatment.
    60 one-ms slots include access; no checkpoints, attachment deadline or forced rank increase.
    Configured 40 dB is normalized occupied-RE Es/N0, not measured SINR/dBm.
    RF impairment values are study assumptions, not 3GPP conformance limits.
  purpose: Local full-chain integration and measurement verification at 20 MHz.
  research_class: optional_research_experiment
  maturity_tag: experimental
  scenario_group: connected_tdd_bandwidth_validation
  tags: [lls, truth, tdd, fr1, 4ghz, 20mhz, cdl-c, adaptive_rank, no_proxy]

run_control:
  runtime_checkpoint_enable: false
  total_slots: 60
  total_time_ms: 60
  measurement_slots: 60
  measurement_time_ms: 60
simulation:
  n_frames: 6
  n_slots: 60
  n_subframes: 60
  min_duration_s: 0.06

tdd_timing:
  capability_profile_id: 38.214-v18.8.0-cap1-dmrs-pos0-mu0
  n1_pdsch_processing_time_symbols: 8
  n2_pusch_preparation_time_symbols: 10
  dl_to_ul_guard_time_us: 16.276

# Exact TBS and final grant validation remain mandatory.
system:
  scheduler:
    maxPRBAllocationPerUE: 106
scheduler:
  max_prbs_per_grant: 106

pdsch:
  start_symbol: 0
  num_symbols: 14
  time_domain_allocations: [[0, 0, 14, 0], [1, 0, 10, 0]]
  # Explicitly installed unavailable-resource pattern, shared by TX/RX.
  # Only the CORESET frequency region is excluded in its control symbols.
  rate_matching_pattern: [connected_coreset]
pusch:
  start_symbol: 0
  num_symbols: 13
  time_domain_allocations: [[0, 0, 13, 4], [1, 0, 13, 4]]

# These are implementation policies, not mandatory 3GPP smoothing rules.
# Apply a newly decoded, valid RI immediately, never a transmitter/oracle RI.
link_adaptation:
  rank_increase_confirmation_reports: 1
  cqi_smoothing_mode: fixed
  cqi_smoothing_alpha: 1
  outage_recovery_max_gap_slots: 10

initial_access:
  ssb:
    case: Case C
    # Type-0 SI for the four active beams ends in common slot 8 (mu=0).
    observation_subframes: 9
    # A 30-kHz SS/PBCH block spans 40 PRBs on the 15-kHz carrier.
    n_crb_ssb: 33
    k_ssb: 0
  sib1:
    observation_subframes: 9

control:
  # The inherited 48-PRB dedicated CORESET fits only after relocation.
  # Keep the exact candidate counts and AL policy; no detection changes.
  coreset_rb_start: 0

reference_signals:
  csi_rs_periodicity_slots: 10
  csi_rs_offset_slots: 1
  csi_rs_resource_num_rbs: [106, 106, 106, 106, 106, 106, 106, 106]
  csi_report_periodicity_slots: 10
  nzp_csi_rs:
    periodicity: 10ms
    periodicity_slots: 10
  csi_im:
    num_rbs: 108
    period_slots: 10
    offset_slots: 1
  srs:
    # Keep SRS at the end of the UL slot, allowing data symbols 0:12.
    symbol_start: 13
    c_srs: 25
    b_srs: 0
    num_rb: 106
    expected_num_rb: 106
    expected_bandwidth_coverage_percent: 98.11320754716981
    full_carrier_coverage_tolerance_rb: 2
  # Keep all 106 RBs; bandwidth >52 RBs requires more than 10 ms.
  trs_periodicity_slots: 20
  trs_periodicity_ms: 20
  trs:
    num_rb: 106
    periodicity: '20'
    periodicity_slots: 20
    period_offset: 2

csi_acquisition_and_reporting:
  csi_report_periodicity_slots: 10
  csi_report_offset_slots: 8
  report_periodicity: 10ms

random_access:
  num_slots: 60
  num_subframes: 60
  msg2_pdsch:
    prb_start: 31
  msg4_pdsch:
    prb_start: 31

# Keep the integer receiver-clock impairment at one sample. At the new
# rate it represents 32.552 ns (not the parent's 8.138 ns). No unsupported
# fractional-delay approximation is inserted to preserve a physical delay.
output:
  profile: lls_tdd_4ghz_20mhz_64txru_4rx_cdlc100_impaired
  phy_signal_diagnostic_fft_length: 2048
  live_csv_png_interval_slots: 10
