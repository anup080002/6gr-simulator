inherits:
  - ./master_scenaio_all_file.yaml

canonical_control:
  identity:
    scenario_id: lls_true_snr_sweep_awgn_1ue
    scenario_name: Fixed SNR and SINR sweep AWGN 1 UE LLS scenario
    description: WebGUI-selectable single-link waveform-bundle scenario for controlled AWGN SNR sweeps with one cell and one UE.
    comparison_group_name: fixed_snr_sweep_awgn_1ue
    tags:
      - lls
      - webgui
      - awgn
      - snr_sweep
      - sinr_sweep
      - 1ue
      - waveform_bundle
  launch:
    runner_profile: waveform_bundle
    run_class: fixed_snr_sweep_lls
    scenario_mode: fixed_snr_sweep
    sweep_enabled: true
    fixed_link_campaign_enabled: true
    geometry_enabled: false
    notes: Operator-facing SINR sweep label backed by controlled AWGN SNR input for a single-link truth run.
  run:
    fixed_link_campaign_enabled: true
    fixed_link_campaign_only: true
    fixed_link_snr_grid_db: [-6, -4, -2, 0, 2, 4, 6, 8, 10]
    min_trials_per_sinr_bin: 5000
    max_trials_per_sinr_bin: 20000
    max_ci_width: 0.10
    confidence_level: 0.95
    study_mode: campaign
    link_direction: both
    total_slots: 200
    measurement_slots: 200
    warmup_slots: 0
  topology:
    num_sites: 1
    num_sectors_per_site: 1
    num_cells: 1
    num_trps: 1
    num_ues: 1
    execution_model: slot_coupled_truth
  channel:
    model_type: AWGN
    profile: AWGN
    delay_spread_ns: 0
    doppler_hz: 0
    doppler_source_mode: configured
    mobility_kmph: 0
    los_enabled: true
    spatial_consistency_enabled: false
    pathloss_enabled: false
    shadow_fading_enabled: false
  mobility:
    ue_speed_kmh: 0
    speed_profile: static
    direction_model: fixed
    trajectory_model: static

validation:
  run_class: fixed_snr_sweep_lls
  fixed_link_campaign:
    enabled: true
    direction: both
    channel_model: AWGN
    snr_db: [-6, -4, -2, 0, 2, 4, 6, 8, 10]
    mcs: [20]
    rank: 1
    layers: 1
    n_prb: 50
    min_tb_per_point: 5000
    max_tb_per_point: 20000
    min_errors_for_ci: 100
    max_ci_half_width: 0.05
    seeds: [104729]
    target_bler: [0.1, 0.01]

sweeps_and_matrix:
  snr_sweep:
    enabled: true
    values_db: [-6, -4, -2, 0, 2, 4, 6, 8, 10]
  fixed_link_calibration:
    enabled: true
    only: true
    direction: both
    channel_model: AWGN
    snr_db: [-6, -4, -2, 0, 2, 4, 6, 8, 10]
    min_trials: 5000
    max_trials: 20000
    trials_per_drop: 200
    error_target: 100
    ci_width_target: 0.10
    confidence_level: 0.95
    target_bler: 0.1
    seed: 104729
    require_monotonic_bler: true
    require_high_snr_pass: true
    max_sinr_snr_delta_db: 0.5
    smoke_min_trials: 100
    truth_min_trials: 5000
