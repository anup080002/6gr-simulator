meta:
  scenario_id: lls_3gpp_rel20_anchor_30ghz_400mhz_waveform_honest_5gnb_15sector_150ue_50slot
  description: Strict waveform-honest FR2 NR/6G study run for 30 GHz TDD, 400 MHz, 5 gNBs, 15 sectors, 150 UEs, and 50 canonical slots.
  scenario_group: lls_3gpp_rel20_anchor_30ghz_400mhz_waveform_honest_5gnb_15sector_150ue_50slot
  scenario_name: Strict waveform-honest FR2 NR/6G study run for 30 GHz TDD, 400 MHz, 5 gNBs, 15 sectors, 150 UEs, and 50 canonical slots.
  scenario_family: lls_3gpp_rel20_anchor_30ghz_400mhz_waveform_honest_5gnb_15sector_150ue_50slot
  baseline_reference_name: lls_3gpp_rel20_anchor_30ghz_400mhz_waveform_honest_5gnb_15sector_150ue_50slot
  comparison_group_name: rel20_anchor_30ghz_400mhz_5gnb_15sector_150ue_50slot
  notes: >
    Browser-owned waveform_bundle scenario for a requested 400 MHz full-PRB run. The carrier is
    placed in FR2 at 30 GHz with 120 kHz SCS and NSizeGrid=264, because 400 MHz is not a normal
    FR1/4 GHz NR channel bandwidth. Scheduled PDSCH/PUSCH grants use the coupled waveform truth
    path with full per-link waveform interference and strict no-proxy/no-fallback output labeling.
  tags:
    - lls
    - matlab-first
    - mysql
    - browser
    - rel20
    - nr-baseline
    - 30ghz
    - 400mhz
    - fr2
    - tdd
    - 120khz
    - 5gnb
    - 15sector
    - 150ue
    - 50slot
    - strict
    - waveform_honest
    - no-proxy
    - coupled_truth
    - full_per_link_channel_waveform_sum

scenario:
  name: lls_3gpp_rel20_anchor_30ghz_400mhz_waveform_honest_5gnb_15sector_150ue_50slot
  description: Strict waveform-honest browser scenario for 30 GHz / 400 MHz / TDD with 5 gNBs, 15 sectors, 150 UEs, and 50 slots.
  runner_profile: waveform_bundle
  target_cases: [bundle]
  bundle_anchor_cases:
    - cell_search_mib_sib1
    - prach_detection
    - dl_pdsch_throughput
    - ul_pusch_throughput
    - ul_srs_channelest
    - ul_lowpapr
  honesty_mode: strict
  unsupported_output_policy: show_unavailable_with_reason
  provenance_logging: true
  notes: >
    This scenario intentionally enables DL/UL data, control, reference-signal, HARQ, CSI, RF
    impairment, and full per-link channel-interference processing. If a block is not supported by
    the runtime, strict validation or unavailable-with-reason outputs must expose that honestly.

