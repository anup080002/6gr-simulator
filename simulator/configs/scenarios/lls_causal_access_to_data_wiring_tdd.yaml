random_access_evidence:
  four_step_ra_required: true
  msg1_prach_required: true
  msg2_rar_pdcch_pdsch_required: true
  msg3_pusch_required: true
  msg4_contention_resolution_required: true
  ra_rnti_decode_required: true
  rar_mac_ce_decode_required: true
  timing_advance_required: true
  contention_resolution_identity_required: true
  require_runtime_stage_waveforms: true
  allow_runtime_stage_waveform_composition: true
  preamble_collision_test_enabled: false
  four_step_negative_test_enabled: false
  false_alarm_test_enabled: false
  missed_detection_test_enabled: false

control_gating:
  pbch_required: true
  prach_required: true
  pdcch_required: true
  srs_required: true
  srs_max_age_slots: 5
  trs_required: true
  trs_max_age_slots: 5

csi_acquisition_and_reporting:
  dl_csi_enabled: true
  ul_csi_enabled: true
  joint_dl_ul_csi_enabled: true
  joint_port_mapping_policy: explicit_joint_port_map
  joint_timeline_policy: scheduler_defined_joint_timeline
  csi_rs_baseline_flag: true
  dmrs_based_csi_flag: true
  srs_based_csi_flag: true
  reciprocity_based_flag: true
  feedback_based_flag: true
  channel_state_information_mode: PMI+CQI+RI+CRI
  pmi_codebook_mode: type1_su_mimo
  cqi_policy: baseline
  pmi_policy: baseline
  ri_policy: baseline
  cri_policy: baseline
  report_trigger: periodic
  report_periodicity: 5ms
  csi_report_periodicity_slots: 5
  csi_report_offset_slots: 1
  report_payload_mode: compressed
  crc_attached_mode: true
  crc_free_mode: false
  report_latency_model: configured
  measurement_timeline: slot_based
  application_timeline: slot_plus_one
  target_bler: 0.1

link_adaptation:
  fixed_or_amc: amc
  operating_point_mode: adaptive
  cqi_table: table1
  outer_loop_flag: true
  inner_loop_flag: true
  cqi_source: csi_feedback
  pdsch_link_adaptation_policy: baseline
  pusch_link_adaptation_policy: baseline
  rank_adaptation_policy: fixed
  al_adaptation_policy: cqi_aware
  beam_adaptation_policy: measured_reference_signal
  adaptation_periodicity: slot
  adaptation_delay_model: configured_feedback_delay
  feedback_delay_slots: 1
  delta_cqi_policy: none
  delta_mcs_policy: ack_nack_olla
  cqi_smoothing_alpha: 0.5
  cqi_smoothing_mode: fixed
  olla_step_down: 0.3
  # ACK/NACK OLLA equilibrium: 0.033333.../(0.3+0.033333...)=0.1.
  olla_step_up: 0.0333333333333333
  target_bler: 0.1
  # The SRS reconstruction residual is diagnostic and must never select a
  # PUSCH MCS.  Predict each candidate's data-channel post-equalization
  # SINR, anchor it to the measured receiver power/noise plane, and schedule
  # on the weakest selected layer.
  ul_srs_to_pusch_layer_sinr_policy: minimum_layer_mean_post_equalization
  ul_reference_signal_scheduling_backoff_db: 0

harq:
  enabled: true
  process_count: 8
  rv_sequence: [0, 2, 3, 1]
  feedback_timing_slots: 4
  combining_mode: soft
  max_retx: 3
  validation_mode: exercise

bwp:
  dl:
    bwp_id: 0
    direction: DL
    n_start_bwp: 0
    n_size_bwp: 25
    scs_khz: 15
    cp_type: normal
    active: true
    common_tdd_reference_scs_khz: 15
  ul:
    bwp_id: 0
    direction: UL
    n_start_bwp: 0
    n_size_bwp: 25
    scs_khz: 15
    cp_type: normal
    active: true
    common_tdd_reference_scs_khz: 15
  component_carriers:
    - cc_id: 0
      serving_cell_id: 1
      scheduling_cc_ids: [0]
      center_frequency_hz: 2350000000
      band: n40
      frequency_range: FR1
      channel_bandwidth_mhz: 5
      duplex_mode: TDD
      dl_carrier_grid: {n_start_grid: 0, n_size_grid: 25, scs_khz: 15}
      ul_carrier_grid: {n_start_grid: 0, n_size_grid: 25, scs_khz: 15}
      carrier_indicator_map:
        - {indicator: 0, scheduled_cc_id: 0}

traffic:
  model: full_buffer
  transport: UDP
  flowDirection: BIDIR
  dlRatio: 0.5
  ulRatio: 0.5
  packetDelayBudget_ms: 20
  packetSize_bytes: 512
  packetInterval_ms: 1
  targetRate_Mbps: 5
  jitterPct: 0
  fullBufferBitsPerTTI: 20000
  flows:
    - name: causal_bidirectional_flow
      qfi: 9
      fiveQi: 9
      protocol: UDP
      direction: BIDIR
      packetDelayBudget_ms: 20
      packetSize_bytes: 512
      packetInterval_ms: 1
      rate_Mbps: 5
      weight: 1
      jitterPct: 0
      burstiness: saturation
      service_profile: eMBB
      ue_class: UE_CLASS_EMBB
      ue_count: 1

output:
  constellation_capture_scope: full_allocation
  bucket: lls
  profile: lls_causal_access_to_data_wiring_tdd
  backend: filesystem
  save_csv: true
  save_mat: true
  save_figures: true
  save_png: true
  phy_signal_diagnostic_enabled: true
  phy_signal_diagnostic_full_channel_grid: true
  phy_signal_diagnostic_waveform_samples: 2048
  phy_signal_diagnostic_fft_length: 512
  # Bounded evidence budget. 4096 elements retain multiple exact temporal
  # samples even for multi-path 2x2 channel tensors, enabling measured
  # Doppler/correlation evidence without exposing channel state to the RX.
  phy_signal_diagnostic_channel_points: 4096
  phy_signal_diagnostic_constellation_points: 1024
  antenna_pattern_samples_enabled: true
  antenna_pattern_azimuth_min_deg: -180
  antenna_pattern_azimuth_max_deg: 180
  antenna_pattern_azimuth_step_deg: 5
  antenna_pattern_elevation_min_deg: -90
  antenna_pattern_elevation_max_deg: 90
  antenna_pattern_elevation_step_deg: 5
  live_publish_frame_interval: 1
  live_heavy_refresh_interval_frames: 1
  live_heavy_refresh_each_sweep_point: true
  # Exact source-file consumer evidence for the YAML causal-chain audit.
  profiler_enabled: true
  profiler_top_functions: 10000
  profiler_top_edges: 20000
  save_yaml_snapshot: true
  save_json_snapshot: true
  organize_by_block: true
  generate_summary_plots: true
  emit_placeholder_artifacts: false
  emit_disabled_audit_artifacts: true
  persistence_mode: results_folder
  persist_to_database: false
  persist_to_results_folder: true
  artifact_contract_engine:
    enabled: true
    catalog_scope: runtime_in_path
    contract_root: tests/vectors
    legacy_reference_root: artifacts
    legacy_reference_usage: coverage_inventory_only
    profiles: [base]
    domains: [initial_access, pdsch, pusch]
    publish_root: components
    source_policy: runtime_memory_only
    truth_only: true
    fail_on_missing_required: true
    evidence_scope: in_path
    require_identity_columns: true
    require_radio_identity_columns: true
    atomic_replace: true
    image_format: none
    raster_authority: post_run_csv_contract_materializer
    allow_svg: false
    allow_placeholder_evidence: false
