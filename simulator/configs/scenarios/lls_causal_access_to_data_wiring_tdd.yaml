  ssb_case: Case A
  ssb_scs_khz: 15
  ssb_lmax: 4
  pbch_enabled: true
  pdcch_dmrs_enabled: true
  pdsch_dmrs_ports: 2
  pusch_dmrs_ports: 1
  pdsch_dmrs:
