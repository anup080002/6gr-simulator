inherits:
  - ./lls_6g_4ghz_100mhz_19site_3sector_100ue_uma.yaml
  - ../impairments/causal_rf_stream.yaml

meta:
  scenario_id: lls_causal_access_to_data_wiring_tdd
  description: >
    Bounded, filesystem-published TDD causal-wiring scenario.  A single UE
    executes SSB/PBCH, SIB1, PRACH/four-step RA, PDCCH, PDSCH, PUCCH,
    PUSCH, CSI-RS, SRS, TRS, HARQ, beam selection and delayed CSI-driven
    AMC through the production waveform chain.  The 5 MHz carrier keeps
    the run short while retaining exact RE, symbol, slot and duplex gates.
  version: "1.0.0"
  owner: sixgr
  research_class: baseline_benchmark
  maturity_tag: regression
  scenario_group: causal_access_to_data_wiring
  tags: [lls, truth, tdd, 5mhz, causal, initial_access, beam, csi, amc]

synchronization:
  # Bounded acquisition window around each SS/PBCH occasion, resolved at
  # the actual waveform sample rate; channel delay is not trimmed away.
  max_timing_uncertainty_us: 10

canonical_control:
  launch:
    scenario_mode: ue_placement_geometry
    sweep_enabled: false
    fixed_link_campaign_enabled: false
    geometry_enabled: true
  integration:
    enabled: true
    configuration_epoch: 1
    run_mode: GEOMETRY_NETWORK
    radio_profile: nr_rel18_system_lls_strict
    subprofile: connected_network
    trace_profile: FULL_EVIDENCE
    configured_snr_is_link_authority: false
    common_pipeline_required: true
    measured_sinr_required: true
  isac:
    # This short causal access/data diagnostic records exact frequency/time/
    # port phase grids, but it does not execute a sensing scene.  Keep the
    # complete ISAC authority explicit so delay-Doppler evidence is reported
    # as feature-disabled rather than inferred, unknown, or fabricated.
    enabled: false
    researchTaxonomy: study_item_candidate
    approach: communication_centric_nr_ofdm
    sensingMode: monostatic_gnb
    waveformAuthority: exact_runtime_pdsch_waveform
    executionScope: first_committed_dl_grant
    channelModel: phased_scattering_mimo
    seed: 4702601
    coherentRepetitions: 4
    transmitPowerDbm: 46
    receiver:
      noiseFigureDb: 5
      referenceTemperatureK: 290
      gainDb: 0
    channel:
      simulateDirectPath: false
      warmupPulses: 1
    scene:
      nodePositionAuthority: coupled_runtime_topology
      numberTargets: 1
      targetPositionsM: [40, 10, 24]
      targetVelocitiesMps: [8, 0, 0]
      reflectionCoefficientReal: [1]
      reflectionCoefficientImag: [0]
    processing:
      observationSource: known_runtime_waveform_matched_filter
      matchedFilterImplementation: frequency_domain_exact_reference
      beamformer: conventional_phase_shift
      includeElementResponse: false
      backgroundRemoval: none
      maximumRangeM: 150
      rangeFFTSize: 131072
      dopplerFFTSize: 8
      azimuthGrid:
        minimumDeg: -90
        maximumDeg: 90
        stepDeg: 2
    detection:
      algorithm: ca_cfar_2d
      trainingCellsRange: 4
      trainingCellsAngle: 4
      guardCellsRange: 1
      guardCellsAngle: 1
      probabilityFalseAlarm: 0.01
      maximumDetections: 8
      nonMaximumSuppressionRangeBins: 3
      nonMaximumSuppressionAngleBins: 2
    acceptance:
      minimumMatchedTargets: 1
      maximumRangeErrorM: 15
      maximumAzimuthErrorDeg: 15
    output:
      enabled: true
      componentFolder: isac
      structuredComponentFolders: true
      saveCSV: true
      savePNG: true
      imageFormat: png
      imageResolutionDPI: 180
      prohibitSVG: true

run_control:
  seed: 4702601
  random_seed_master: 4702601
  random_seed_list: [4702601]
  num_seeds: 1
  num_drops: 1
  num_workers: 1
  auto_start_parallel_pool: false
  total_slots: 25
  warmup_slots: 0
  measurement_slots: 25
  total_time_ms: 25
  warmup_time_ms: 0
  measurement_time_ms: 25
  slot_level_logging_enable: true
  symbol_level_logging_enable: true
  per_ue_logging_enable: true
  per_cell_logging_enable: true
  raw_iq_capture_enable: true
  raw_grid_capture_enable: true
  save_constellations: true
  save_channel_tensors: true
  save_scheduler_decisions: true
  save_harq_buffers: true
  save_reference_signal_maps: true
  save_beam_weights: true
  save_link_budget_tables: true
  save_interference_breakdown: true
  batch_size_links: 1

scenario:
  runner_profile: system_level_lls
  target_cases: [bundle]
  bundle_anchor_cases: [ul_lowpapr]
  study_mode: baseline
  honesty_mode: strict
  notes: >
    No proxy or fallback rows are permitted.  Absolute RS power is measured
    at the pre-AGC antenna-connector plane.  Post-front-end normalized grid
    power is retained separately and must never be labelled dBm.

output_control:
  output_dir: results/lls
  artifact_formats: [json, csv, mat, png, md]
  save_resolved_config: true
  save_raw_waveforms: true
  save_llrs: true
  save_channel_snapshots: true
  save_constellations: true
  save_debug_events: true
  save_plots: true
  save_report: true
  compression: none
  impairment_visibility: full
  naming_template: "{scenario_id}/{run_tag_or_current}"

simulation:
  link_direction: both
  n_frames: 2
  n_slots: 25
  n_subframes: 25
  monte_carlo_iterations: 1
  random_seed: 4702601
  deterministic_mode: true
  snr_db: 12
  noise_operating_mode: receiver_noise_figure_thermal_noise
  min_duration_s: 0.025
  snr_sweep_offsets_db: [0]

