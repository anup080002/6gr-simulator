    frequency_position: 0
    n_rrc: 0
    enable_start_rb_hopping: false
    frequency_scaling_factor: 1
    start_rb_index: 0
    b_hop: 0
    c_srs: 6
    b_srs: 0
    num_rb: 24
    expected_rb_start: 0
    expected_num_rb: 24
    expected_bandwidth_coverage_percent: 96
    coverage_requirement: configured_band
    full_carrier_sounding_required: false
    full_carrier_coverage_tolerance_rb: 1
    purpose: ul_csi
    baseline_or_candidate_tag: baseline_benchmark
    time_density: configured
    frequency_density: configured
    periodicity: "5"
    aperiodic_trigger: none
    semi_persistent_flag: false
    num_ports: 1
    port_set: 0
    comb: "2"
    sequence_type: baseline_nr
    scrambling_id: 1
    cdm_grouping: "1"
    orthogonality_policy: baseline
    power: 0dB
    beam_association: ul_beam
    qcl_association: default
