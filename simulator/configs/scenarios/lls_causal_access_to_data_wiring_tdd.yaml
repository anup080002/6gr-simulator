    coexistence_constraints: baseline
    measurement_usage: csi
    interpolation_policy: 2d_linear
    trp_transmission_assumption: single_trp_only
  trs_enabled: true
  trs:
    enabled: true
    slot_numbers: [2, 7]
  tracking_rs_enabled: true
  ptrs_enabled: true
  ptrs_cpe_correction_enabled: true
  csi_reporting_enabled: true
  cqi_reporting_enabled: true
  pmi_reporting_enabled: true
  ri_reporting_enabled: true
  cri_reporting_enabled: true
  csi_feedback_mode: PMI+CQI+RI+CRI
  channel_state_information_mode: PMI+CQI+RI+CRI
  csi_acquisition_mode: joint_dl_ul
  operation_orientation: tdd_reciprocity
  pmi_codebook_mode: type1_su_mimo
  channel_estimation_mode: realistic_baseline
  receiver_example: mmse_irc
  pdsch_dmrs_config_type: 1
  pdsch_dmrs_type_a_position: 2
  pdsch_dmrs_num_cdm_groups_without_data: 1

mimo:
  n_tx_ant: 2
  n_rx_ant: 2
  n_layers: 1
  hybrid_beamforming_flag: false
  precoder_type: wideband
  codebook_type: type1
  reciprocity_mode: TDD
  beam_sweep_enabled: true
  beam_count: 4
  mtrp_ready: false
  multi_panel_ready: false
  panel_count: 1
  trp_count: 1
  precoding_granularity: prg_wideband
  max_dl_layers: 2
  max_ul_layers: 1
  phase07_strict:
    enabled: true
    profile_id: "fr1_typeI_single_panel_strict"
    specification_profile: "3GPP_R18_MIMO_CSI_V1"
    direction: "DL"
    codebook_type: "typeI-SinglePanel"
    ports: 2
    panels: 1
    n1: 1
    n2: 1
    o1: 1
    o2: 1
    max_rank: 2
    rank_domain: [1, 2]
    receiver: "MMSE"
    precoder_prg_size_rbs: 25
    require_active_tci_state: false
    measurement_max_age_slots: 8
    covariance:
      min_samples: 4
