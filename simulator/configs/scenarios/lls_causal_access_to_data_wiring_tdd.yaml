      max_age_slots: 8
      configured_override_forbidden: true

modulation:
  dl_modulation_order: 2
  ul_modulation_order: 2
  mcs_table: qam64_table1
  dl_mcs_index: 4
  ul_mcs_index: 4
  constellation_shaping_enabled: false

users:
  enabled: true
  n_users: 1
  rnti_start: 1
  seed_stride: 17
  execution_model: slot_coupled_truth
  beam_selection_strategy: runtime_best_beam_per_link
  save_user_tables: true

system:
  queueMaxBits: 10000000
  scheduler:
    type: PF
    maxActiveUEsPerSlot: 1
    maxPRBAllocationPerUE: 25
    fairnessAlpha: 1.0
    proportionalFairWindow_ms: 20
    beamAware: true
    energyAware: false
    qosAware: false
    sliceAware: false
    starvationGuard: true
    cellEdgeBoost: false
  measurement:
    periodSlots: 1
    filterAlpha: 0.5
  beam:
    enable: true
    numBeams: 4
    updatePeriod_slots: 1
    sectorSpan_deg: 120
    maxGain_dB: 3.0103
  handover:
    enable: false
    a3Offset_dB: 3
    hysteresis_dB: 2
    timeToTrigger_slots: 8
    minServingSlots: 8
    preparationSlots: 1
    interruptionSlots: 2
    blockDuringPreparation: false

control:
  pdcch_enabled: true
  blind_search_enabled: true
  coreset_type: common
  search_space_type: ue
  aggregation_levels: [1, 2, 4, 8, 16]
  # UE-specific connected-mode spatial scheduling uses the paired 0_1/1_1
  # formats so SRI/TPMI/ports and CSI/TCI fields are physically signalled.
  dci_formats: ["0_1", "1_1"]
  blind_decode_candidates: 8
  coreset_duration: 2
  coreset_frequency_resource_policy: full_bwp_groups
  coreset_frequency_resources: [1, 1, 1, 1]
  search_space_num_candidates: [4, 2, 1, 1, 0]
  pdcch_payload_bits: 64
  blind_decode_list_length: 16
  monitoring_mode: slot_level_baseline
  repetition_enabled: false
  detection_feedback_enabled: true
  pucch_enabled: true
  pucch_format: 2

pdsch:
  use_exact_flat_static_mimo_prg_estimator: false
  enabled: true
  execution_profile: scheduler_truth
  mapping_type: A
  prb_start: 0
  num_prb: 25
  start_symbol: 2
  num_symbols: 12
  layer_count: 1
  # Logical NR antenna ports are independent from the scheduled rank and
  # DM-RS port set.  Keep two ports so rank-one data and two-port CSI-RS
  # share the configured two-element/two-RF-chain gNB spatial subspace.
  num_antenna_ports: 2
  # Initial Type-I codebook PMI used only until the first causally delayed
  # CSI report is installed.  Runtime CSI remains authoritative thereafter.
  pmi: 0
  rank: 1
  modulation: QPSK
  mcs_table: qam64_table1
  fixed_mcs: 4
  link_adaptation_mode: amc
  amc_policy: baseline
  dmrs_residual_post_eq_sinr_bound_enabled: true
  decision_directed_post_eq_sinr_bound_enabled: true
  decoder_noise_variance_mode: post_equalization
  ptrs_policy: enabled_from_yaml
  beam_policy: measured_reference_signal

pusch:
  enabled: true
  execution_profile: scheduler_truth
  waveform: CP-OFDM
  transform_precoding: false
  mapping_type: A
  prb_start: 0
  num_prb: 25
  start_symbol: 0
  # Symbol 13 is reserved for the periodic SRS occasion.  A scheduled
  # PUSCH therefore occupies symbols 0..12; this prevents a hidden
  # PUSCH/SRS RE collision while preserving UL data in the same slot.
  num_symbols: 13
  layer_count: 1
  num_layers: 1
  num_antenna_ports: 1
  modulation: QPSK
  mcs_table: qam64_table1
  fixed_mcs: 4
  mcs_index: 4
  amc_policy: baseline
  decoder_noise_variance_mode: pre_equalization
  ptrs_policy: enabled_from_yaml
  uci_multiplexing_mode: harq_ack_on_pusch_when_pucch_collides
  beam_policy: measured_srs

pucch_resources:
  enabled: true
  profile: nr_rel18_pucch_strict
  configuration_epoch: 1
  resource_sets:
    -
      id: 0
      max_payload_bits: 2
