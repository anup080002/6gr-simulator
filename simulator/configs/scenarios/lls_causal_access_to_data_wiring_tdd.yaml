  require_spatial_dependency_contract: true
  polarization: "single"
  cross_pol_ratio: 0
  calibration_model: ideal
  mutual_coupling_model: none
  analog_beam_codebook: dft
  digital_precoder_family: wideband
  reciprocity_assumption: tdd_reciprocity
  amplitude_phase_mismatch: none
  srs_power_imbalance_model: none

power_and_rf_frontend:
  bs_tx_power_dbm: 30
  ue_tx_power_dbm: 23
  # A gNB transmit-power setting is the maximum full-BWP budget. Sparse
  # DL allocations retain fixed EPRE instead of concentrating the complete
  # cell budget into the occupied PRBs. UL remains allocation-aware under
  # the signal-specific TS 38.213 power-control equations.
  downlink_power_normalization_policy: fixed_epre_over_configured_bwp
  uplink_power_normalization_policy: active_ofdm_total_power
  ue_noise_figure_db: 7
  noise_figure: 5
  rx_gain_control: agc
  dac_resolution_bits: 12
  adc_resolution_bits: 12
  pa_model: ideal
  pa_nonlinearity_model: none
  cfr_enabled: false
  dpd_enabled: false
  iq_imbalance: none
  dc_offset: none
  lo_phase_noise_model: nominal
  cfo_model: low_nominal
  drift_rate_model: none
  saturation_model: none

# Canonical RF runtime authority.  These values are consumed by the same
# TS 38.213 UL power-control implementation for TDD and FDD; duplexing only
# determines when an UL allocation is legal, never the power equation.
rf_frontend:
  configuration_epoch: 1
  ul_power_control:
    enabled: true
    open_loop_enabled: true
    closed_loop_enabled: false
    phr_report_enabled: true
    require_measured_reference_rs: true
    max_pathloss_measurement_age_slots: 20
    configured_snr_pathloss_forbidden: true
    tpc_source: decoded_control_event
    tpc_mode: accumulation
    state_epoch_required: true
    pusch: {p0_dbm: -80, p0_ue_db: 0, alpha: 0.8, delta_tf_db: 0, pcmax_dbm: 23}
    pucch: {p0_dbm: -80, alpha: 0.8, delta_tf_db: 0, pcmax_dbm: 23}
    srs: {p0_dbm: -80, alpha: 0.8, delta_tf_db: 0, pcmax_dbm: 23}
    prach: {p0_dbm: -100, alpha: 1.0, delta_tf_db: 0, pcmax_dbm: 23}

channels:
  # CDL is intentional in this spatial wiring gate: unlike nrTDLChannel's
  # reduced correlation adapter, nrCDLChannel consumes the runtime array
  # geometry, element pattern, polarization and orientation assumptions.
  model_type: CDL
  profile: CDL-A
  # Evaluate fading on the waveform clock, independent of runtime chunk boundaries.
  per_sample_fading_enabled: true
  delay_spread_ns: 100
  doppler_hz: 7.838756
  doppler_source_mode: derive_from_ue_speed
  mobility_kmph: 3
  # Preserve physical per-connector voltage and power. MATLAB's optional
  # receive-antenna-count normalization would apply a different scale after
  # reversing unequal endpoint arrays and is therefore incompatible with
  # exact moving-TDD reciprocity.
  normalize_channel_outputs: false
  los_enabled: false
  spatial_consistency_enabled: true
  pathloss_enabled: true
  shadow_fading_enabled: false
  pathloss_model: nrPathLoss
  shadow_fading_std_db: 0

interference:
  inter_cell_interference_flag: false
  intra_cell_interference_flag: false
  mu_mimo_interference_flag: false
  # No interferer is enabled in this single-cell causal wiring profile.
  # Keep the execution mode identical to the observed disabled identity;
  # full waveform summation belongs only in an interference-enabled YAML.
  inter_cell_execution_mode: none
  cochannel_interference_profile: none
  adjacent_channel_interference: none
  uplink_interference_model: none
  interference_measurement_policy: disabled

reference_signals:
