  - simulator/configs/scenarios/high_doppler_stress.yaml
  - simulator/configs/scenarios/low_snr_stress.yaml
  - simulator/configs/scenarios/phase_noise_stress.yaml
  - simulator/configs/scenarios/cfo_stress.yaml
  - simulator/configs/scenarios/high_order_modulation_stress.yaml
  - simulator/configs/scenarios/ul_30ghz_impairment_stress.yaml
  - simulator/configs/scenarios/dl_30ghz_beam_tracking.yaml
