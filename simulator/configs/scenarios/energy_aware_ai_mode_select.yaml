    "inference_batch_size": 1,
    "latency_budget_us": 200,
    "flops_budget": 100000,
    "quantization_mode": "int8",
    "runtime_budget_us": 200,
    "fallback_enabled": true,
    "confidence_logging": true,
    "descriptor_type": "plugin_descriptor"
  }
