inherits:
  - ./lls_causal_access_to_data_wiring_tdd_short_continuous_iq.yaml
  - ../channels/cdl_c.yaml

meta:
  scenario_id: lls_2ghz_20mhz_rank2_cdlc_reference
  description: >
    Strict NR band n39, 1.900 GHz, 20 MHz, mu-0 TDD waveform LLS using
    concrete CDL-C fading. One UE executes physical SS/PBCH, Type-0/SIB1,
    four-step RA, PDCCH, PDSCH, PUCCH, PUSCH, CSI-RS, SRS, TRS, DM-RS,
    PT-RS, HARQ, Type-I PMI/RI/CQI/CRI and adaptive rank up to two.
  purpose: >
    Provide the clean controlled-SNR arm for contribution-oriented link
    evaluation. The n39 carrier keeps the requested 2 GHz-band study aligned
    with concrete TDD SIB1, PRACH and NR-ARFCN semantics.
  research_class: study_item_candidate
  maturity_tag: experimental
  scenario_group: ran1_style_fr1_tdd_link_evaluation
  tags: [lls, truth, tdd, fr1, 2ghz, 20mhz, cdl-c, rank-adaptive, shared-control, no-proxy]

scenario:
  runner_profile: waveform_bundle
  target_cases: [bundle]
  notes: >
    Configured SNR is occupied-RE Es/N0 at the declared waveform reference
    plane. Receiver SINR, BLER, BER, EVM and throughput are measurements and
    are not relabelled configured SNR. Pathloss and O2I are excluded from
    this controlled-SNR arm and belong to the thermal-noise companion.

simulation:
  link_direction: both
  n_frames: 10
  n_slots: 100
  n_subframes: 100
  monte_carlo_iterations: 1
  random_seed: 20260926
  deterministic_mode: true
  snr_db: 0
  noise_operating_mode: standalone_awgn_snr_argument
  min_duration_s: 0.1
  snr_sweep_offsets_db: [0]

integration:
  # A configured-SNR sweep is an occupied-RE Es/N0 experiment. Keep its
  # sample plane normalized so signal-specific TS 38.213 power-control values
  # cannot be mixed with noise calibrated from a different full-BWP power.
  power_reference_mode: normalized_unit_es

canonical_control:
  integration:
    power_reference_mode: normalized_unit_es
    configured_snr_is_link_authority: true

