      dci_formats: [1_1, 0_1]
      aggregation_levels: [1, 2, 4, 8]
      candidates_per_level: [2, 2, 2, 2]
      monitoring_periodicity_slots: 1
      monitoring_offset_slots: 0
  blind_decoding_attempts: 44
  dmrs_scrambling_id_source: physical_cell_id
  rnti_config:
    c_rnti_range: [1, 65519]
    tc_rnti: 65520
    si_rnti: 65535
    ra_rnti_base: 1
    p_rnti: 65534

control:
