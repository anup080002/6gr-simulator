meta:
  scenario_id: lls_mobile_2ue_100kmh_1sector_full_capture
  description: Actual-run-first 1-sector / 2UE / 100 km/h full-capture LLS study for 4 GHz TDD with exhaustive artifact readback and honest post-run auditing.
  version: "1.1.0"
  owner: codex
  author: codex
  created_at: "2026-06-17"
  release_reference: Rel-20 NR study context with actual MATLAB runtime evidence
  source_reference: user_requested_actual_mobile_2ue_full_phy_study
  research_class: study_item_candidate
  maturity_tag: experimental
  scenario_group: actual_mobile_2ue_full_phy_study
  scenario_name: Actual-run-first 1-sector / 2UE / 100 km/h full-capture LLS study for 4 GHz TDD.
  scenario_family: actual_mobile_2ue_full_phy_study
  purpose: Real MATLAB execution of a tightly scoped mobile 2UE scenario with exhaustive capture, readback, trace synthesis, and honest issue reporting.
  study_status: experimental
  baseline_reference_name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_4000slot
  comparison_group_name: mobile_2ue_100kmh_full_capture
  notes: >
    This authoritative study YAML requests a standards-consistent 100 MHz / 30 kHz / 122.88 Msps /
    273-RB carrier and explicitly enables the strict control, decoder, SIB1, random-access, and
    channel/RF evidence blocks required for honest post-run auditing.
  tags:
    - lls
    - actual-run
    - matlab-first
    - study
    - 4ghz
    - 100mhz
    - tdd
    - 30khz
    - 2ue
    - 1sector
    - 100kmh
    - full-capture
    - strict

scenario:
  name: lls_mobile_2ue_100kmh_1sector_full_capture
  description: Actual-run-first 1-sector / 2UE / 100 km/h strict LLS scenario with exhaustive capture and post-run audits.
  runner_profile: waveform_bundle
  target_cases: [bundle, pdcch, pucch]
  bundle_anchor_cases: [ul_lowpapr]
  honesty_mode: strict
  unsupported_output_policy: blank_unmeasured_values
  provenance_logging: true
  notes: >
    The runtime must use the real coupled system-level + waveform-backed replay path where implemented,
    must emit missing-evidence failures rather than label-only success, and must preserve the configured
    strict-validation objectives as explicit run-time gates rather than silently downgrading them.
  geometry:
    area_m: [1200, 200]
  sectorization:
    azimOffsets_deg: [0]
  bs:
    height_m: 25.0
    downtilt_deg: 6.0
    txPower_dBm: 46.0
    noiseFigure_dB: 7.0
    nTxAnt: 64
    nRxAnt: 64
    antenna:
      type: URA
      n_elements: 64
      element_spacing_wavelengths: 0.5
      element_gain_dBi: 18.0
      hpbw_horizontal_deg: 65.0
      hpbw_vertical_deg: 6.0
      front_to_back_ratio_dB: 25.0
      cross_pol_discrimination_dB: 25.0
      feeder_loss_dB: 0.5
      array_scan_range_az_deg: [-60, 60]
      array_scan_range_el_deg: [-15, 15]
      polarization: dual_slant_45
      pattern_model: 3GPP_UMa_18dBi
  ue:
    height_m: 1.5
    txPower_dBm: 23.0
    noiseFigure_dB: 7.0
    nTxAnt: 2
    nRxAnt: 4
    antenna:
      type: isotropic_2tx_4rx
      element_gain_dBi: 0.0
      inter_element_spacing_mm: 40.0
    distribution:
      type: uniform_random
      indoorFraction: 0.2
      min_bs_dist_m: 20.0
      max_bs_dist_m: 500.0
      height_distribution: fixed
      ue_clustering: false

