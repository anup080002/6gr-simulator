pdsch:
  execution_profile: scheduler_truth
  # The four CSI-RS ports define the Type-I PMI basis used by this
  # rank-two PDSCH.  Ports and layers are distinct NR dimensions.
  num_antenna_ports: 4
  resource_allocation_type: type1
  prb_start: 0
  num_prb: 273
  mapping_type: typeA
  start_symbol: 2
  num_symbols: 12
  # RRC PDSCH-TimeDomainResourceAllocationList rows:
  # [index, start symbol, length, K0].  Row 1 enables data on the ten
  # DL symbols remaining after the two-symbol PDCCH in the special slot.
  time_domain_allocations:
    - [0, 2, 12, 0]
    - [1, 2, 10, 0]
  vrb_to_prb_mapping: non_interleaved
  prb_bundling_type: static
  prb_bundle_size: wideband
  rate_matching_pattern: []
  xoh_pdsch: 0
  tbs_scaling: 1.0
  cbg_transmission: false

