inherits:
  - simulator/configs/scenarios/h4_100_cdlc100_connected_impaired_40db_gate.yaml
  - simulator/configs/rf/causal_agc_burst_headroom.yaml

meta:
  scenario_id: h4_100_cdlc100_connected_impaired_40db_adaptation
  description: >
    100-slot (50 ms) H4 4 GHz / 100 MHz TDD adaptive connected-mode check.
    Retains physical initial access, the original CSI/SRS/TRS calendars,
    adaptive DL/UL rank up to four, RF impairments and measurement exports.
    The horizon includes access and feedback delivery, not 100 data slots.
    Access is event-based; this configuration imposes no attachment deadline.
    Received CSI confirmations and future grants, not elapsed slots alone,
    establish adaptation. This is not statistical BLER/HARQ qualification.
    Receiver AGC uses declared 0.25 normalized RMS headroom and causal
    one-sample clip-flag gain reduction; all RF impairments remain enabled.
  purpose: Verify post-attach physical CSI delivery, adaptive grants and DL/UL execution.

# Duration aliases share the mu=1 clock. The original 60-slot repair check
# and 200-slot gate remain unchanged. Two 20-slot-period CSI confirmations
# are retained; they are not shortened or bypassed to force adaptation.
run_control:
  # Completed-slot checkpoints retain PHY/protocol state, not just CSVs.
  # Save after slots 49,52,55,...: after slot 49 resumes with slot 50. This is
  # an execution/recovery policy, not a change to channel/RF or radio clocks.
  # Already running MATLAB instances retain their loaded checkpoint cadence.
  runtime_checkpoint_enable: true
  checkpoint_first_slot: 49
  checkpoint_every_slots: 3
  total_slots: 100
  total_time_ms: 50
  measurement_slots: 100
  measurement_time_ms: 50

simulation:
  n_frames: 5
  n_slots: 100
  n_subframes: 50
  min_duration_s: 0.05
  random_seed: 20260927

random_access:
  num_slots: 100
  num_subframes: 50

output:
  profile: h4_100_cdlc100_connected_impaired_40db_adaptation
  # Execution diagnostics/display only. Measurements and terminal exports
  # remain complete; the first and final completed slots always publish.
  execution_stage_profile_enabled: true
  live_csv_png_interval_slots: 5
