inherits:
  - ./lls_700mhz_20mhz_3bs_30ue_tdlc_browser_coupled.yaml

meta:
  scenario_id: lls_6g_4ghz_100mhz_19site_3sector_100ue_uma
  description: 6G_4GHz_100MHz_19S3_100UE_UMa browser-owned multi-cell study family root for a 4 GHz / 100 MHz urban-macro deployment with 19 sites, 3 sectors per site, 57 sector cells, 100 UEs, wrap-around geometry, coupled LLS waveform truth, and DB-backed browser results.
  version: "1.0.0"
  owner: codex
  research_class: study_item_candidate
  maturity_tag: experimental
  scenario_group: 6G_4GHz_100MHz_19S3_100UE_UMa
  tags:
    - lls
    - browser
    - mysql
    - 4ghz
    - 100mhz
    - 19site
    - 57cell
    - 100ue
    - uma
    - multicell
    - interference

run_control:
  seed: 440100
  deterministic_mode: true
  execution_mode: LLS
  study_mode: baseline
  simulation_mode: full_phy
  run_profile: normal
  random_seed_master: 440100
  random_seed_list: [440100, 440101, 440102, 440103, 440104]
  num_seeds: 5
  num_drops: 20
  warmup_time_ms: 200
  measurement_time_ms: 1000
  total_time_ms: 1200
  slot_level_logging_enable: true
  symbol_level_logging_enable: false
  per_ue_logging_enable: true
  per_cell_logging_enable: true
  raw_iq_capture_enable: false
  raw_grid_capture_enable: false
  save_constellations: false
  save_channel_tensors: false
  save_scheduler_decisions: true
  save_harq_buffers: false
  save_reference_signal_maps: false
  save_beam_weights: false
  save_link_budget_tables: true
  save_interference_breakdown: true
  save_energy_trace: true
  batch_size_links: 16
  gpu_enable: false
  mixed_precision_enable: false
  fail_on_validation_warning: true
  num_workers: 8

scenario:
  runner_profile: system_level_lls
  target_cases: [bundle]
  bundle_anchor_cases: [ul_lowpapr]
  notes: >
    Browser-owned multi-cell study root. The active execution path is the truthful coupled
    browser-owned system-level LLS runner launched from /run, stored into MySQL, and consumed
    by /result and /analytics. Large-scale geometry, serving-cell selection, mobility, handover,
    scheduler grants, inter-cell interference state, and LLS-backed grant execution come from
    the same active runtime. The default study mode is full_phy, so scheduled grants must
    execute through the waveform-backed system PHY replay path. The selected interference
    mode is full_per_link_channel_waveform_sum; large-scale activity-power and overlap-only
    shortcut modes are not valid no-proxy LLS runtime choices.
  expected_outputs:
    - reports/csv/scenario_summary.csv
    - reports/csv/runtime_operating_mode.csv
    - reports/csv/config_roundtrip_verification.csv
    - reports/csv/browser_runtime_db_consistency.csv
    - reports/csv/summary_vs_raw_consistency.csv
    - reports/csv/value_source_audit.csv
    - packet_flow/csv/live_dl_scheduler_grants.csv
    - packet_flow/csv/live_ul_scheduler_grants.csv
    - air_interface/csv/dl_pdsch_trials.csv
    - air_interface/csv/ul_pusch_trials.csv

simulation:
  link_direction: both
  n_frames: 1
  n_slots: 4
  n_subframes: 4
  monte_carlo_iterations: 1
  random_seed: 440100
  deterministic_mode: true
  snr_db: 12
  noise_operating_mode: receiver_noise_figure_thermal_noise
  min_duration_s: 0.001
  snr_sweep_offsets_db: [0]

frequency:
  range_name: FR1
  band_name: 4ghz_100mhz_uma
  center_frequency_hz: 4000000000
  bandwidth_hz: 100000000
  bandwidth_options_hz: [100000000]
  duplex_mode: TDD
  carrier_count: 1
  carrier_aggregation_enabled: false
  numerology_options_khz: [30]
  max_mimo_size: 64
  n_size_grid: 273

frame:
  scs_khz: 30
  cp_type: normal
  slot_format: flexible
  tdd_pattern: DDDDU

waveform:
  dl_waveform: CP-OFDM
  ul_waveform: CP-OFDM
  fft_size: 4096
  sample_rate_hz: 122880000
  windowing_enabled: false
  transform_precoding_enabled: false

deployment_topology:
  scenario_type: multi-cell
  site_layout: hex_grid
  layout_type: hexagonal_wraparound
  cell_type: UMa
  inter_site_distance: 600
  num_sites: 19
  num_base_stations: 19
  num_cells: 57
  num_sectors_per_site: 3
  num_ues: 100
  num_trps: 57
  trp_topology: per_cell_trp
  trp_sync_mode: synchronous
  trp_switching_mode: disabled
  cell_free_flag: false
  full_duplex_flag: false
  self_interference_path_model: none
  wraparound_enabled: true

mobility:
  ue_speed_kmh: 3
  speed_profile: baseline_low_mobility_browser_profile
  direction_model: random
  trajectory_model: zigzag
  update_period_s: 0.0005
  zigzag_segment_duration_s: 0.0025
  zigzag_turn_angle_deg: 35
  acceleration_profile: none
  handover_context_flag: true
  beam_dynamics_model: mobile_uma
  spatial_consistency_flag: true

antenna_and_array:
  bs_array_geometry: ura
  ue_array_geometry: ula
  bs_num_txrus: 64
  bs_num_rxrus: 64
  bs_num_antenna_elements: 64
  ue_num_antenna_elements: 4
  panels: 2
  panel_spacing: 0.5
  element_spacing_h: 0.5
  element_spacing_v: 0.5
  polarization: cross
  cross_pol_ratio: 12
  calibration_model: ideal
  mutual_coupling_model: none
  analog_beam_codebook: dft
  digital_precoder_family: wideband
  hybrid_beamforming_flag: false
  reciprocity_assumption: fdd_feedback
  amplitude_phase_mismatch: none
  srs_power_imbalance_model: none

power_and_rf_frontend:
  bs_tx_power_dbm: 46
  ue_tx_power_dbm: 23
  ue_noise_figure_db: 7
  power_backoff_db: 0
  pa_model: ideal
  pa_efficiency_model: constant
  pa_nonlinearity_model: none
  cfr_enabled: false
  dpd_enabled: false
  dac_resolution_bits: 12
  adc_resolution_bits: 12
  iq_imbalance: none
  dc_offset: none
