  profile: TDL-C
  delay_spread_ns: 300
  doppler_hz: 11.1188031733
  doppler_source_mode: derive_from_ue_speed
  mobility_kmph: 3
  los_enabled: false
  spatial_consistency_enabled: true
  pathloss_enabled: true
  shadow_fading_enabled: true
  pathloss_model: nrPathLoss
  shadow_fading_std_db: 6

interference:
  inter_cell_interference_flag: true
  intra_cell_interference_flag: true
  mu_mimo_interference_flag: true
