    "beam_report_enabled": true,
    "pre_rach_refinement_enabled": true,
    "beam_clustering_enabled": true,
    "ro_clustering_enabled": true
  },
  "modulation": {
    "dl_modulation_order": 4,
    "ul_modulation_order": 4,
