    "tx_power_dbm": 26,
    "pa_efficiency": 0.35,
    "rf_chain_count": 2,
    "sleep_state_model": "micro_sleep",
    "duty_cycle_logging": true,
    "energy_per_bit_reporting": true,
    "ai_compute_energy_per_flop_score": 1e-6,
