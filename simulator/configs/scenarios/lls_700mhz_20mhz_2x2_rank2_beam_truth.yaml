  "reference_signals": {
    "ssb_enabled": true,
    "pbch_enabled": true,
    "pdcch_dmrs_enabled": true,
    "pdsch_dmrs_ports": 2,
    "pusch_dmrs_ports": 2,
    "csi_rs_enabled": true,
    "srs_enabled": true,
    "trs_enabled": true,
    "tracking_rs_enabled": true,
    "ptrs_enabled": true,
    "csi_reporting_enabled": true,
    "csi_feedback_mode": "PMI+CQI+RI+CRI",
    "cqi_reporting_enabled": true,
    "pmi_reporting_enabled": true,
    "ri_reporting_enabled": true,
    "cri_reporting_enabled": true,
    "pmi_codebook_mode": "type1_su_mimo",
    "srs_ports": 2,
    "sgcs_reporting_enabled": true,
    "nmse_reporting_enabled": true,
    "pdsch_dmrs_config_type": 1,
    "pdsch_dmrs_type_a_position": 2,
    "pdsch_dmrs_num_cdm_groups_without_data": 2
