  ],
  "meta": {
    "scenario_id": "lls_700mhz_20mhz_2x2_rank2_beam_truth",
    "description": "Strict no-proxy waveform LLS bundle at 700 MHz / 20 MHz with a sustained 2x2 nominal rank-2 operating point plus all supported waveform-truth control, HARQ, clustering, and energy features enabled.",
    "version": "1.0.0",
    "owner": "codex",
    "research_class": "baseline_benchmark",
    "maturity_tag": "baseline",
  "scenario_group": "lls_truth_validation",
  "tags": ["lls", "truth", "waveform", "700mhz", "20mhz", "2x2", "rank2", "beam", "no-proxy"]
  },
  "run_control": {
    "num_workers": 5
  },
  "scenario": {
    "runner_profile": "waveform_bundle",
    "target_cases": ["bundle", "dl", "ul", "pdsch", "pusch", "pdcch", "pucch", "pbch", "ssb", "prach", "csi_rs", "srs", "dmrs", "harq"],
    "notes": "Actual link-level only. 700 MHz FDD 20 MHz truth run with a sustained nominal rank-2 MIMO operating point, explicit no-proxy semantics, exercised HARQ retransmissions, enabled PDCCH repetition/detection-feedback/clustering/energy-saving controls, and profiling-oriented runtime size. Unsupported waveform-bundle families such as AI benchmark metadata, true initial-access procedure delay, and multi-TRP beamforming remain excluded rather than silently approximated."
  },
  "simulation": {
    "link_direction": "both",
    "n_frames": 20,
    "n_slots": 20,
    "n_subframes": 20,
    "monte_carlo_iterations": 10,
    "random_seed": 37,
    "deterministic_mode": true,
    "snr_db": 24,
    "min_duration_s": 0.02,
    "snr_sweep_offsets_db": [-20, -15, -10, -5, 0, 5]
  },
  "frequency": {
    "bandwidth_hz": 20000000,
    "n_size_grid": 106
  },
  "frame": {
    "scs_khz": 15,
    "cp_type": "normal"
  },
  "waveform": {
    "dl_waveform": "CP-OFDM",
    "ul_waveform": "CP-OFDM",
    "fft_size": 2048,
    "sample_rate_hz": 30720000,
    "windowing_enabled": false,
    "transform_precoding_enabled": false
  },
  "channels": {
    "model_type": "TDL",
    "profile": "TDL-A",
    "delay_spread_ns": 100,
    "doppler_hz": 30,
    "mobility_kmph": 3,
