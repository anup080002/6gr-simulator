  description: Strict waveform-honest NR Rel-20 study-anchor LLS scenario for 4 GHz TDD, 100 MHz, 200 randomly placed UEs, and 20 frames launched from the browser-owned MATLAB path.
  scenario_group: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_20frame
  scenario_name: Strict waveform-honest NR Rel-20 study-anchor LLS scenario for 4 GHz TDD, 100 MHz, 200 randomly placed UEs, and 20 frames launched from the browser-owned MATLAB path.
  scenario_family: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_20frame
  baseline_reference_name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_20frame
  comparison_group_name: rel20_anchor_4ghz_100mhz_200ue_20frame
  notes: >
    Canonical browser-default waveform_bundle scenario for a bounded truthful run. The launch contract,
    runtime accounting, and post-run artifact flow are all expected to remain explicitly truthful:
