  duplex_mode: TDD
  carrier_count: 1
  carrier_aggregation_enabled: false
  numerology_options_khz: [30]
  max_mimo_size: 64
  max_supported_center_frequency_hz: 7125000000
  custom_frequency_override_allowed: true
  mobility_defaults_kmph: 3
  channel_model_defaults: CDL-D
  reference_signal_defaults: tracking
  power_model_defaults: fr1_macro
  energy_model_defaults: fr1_energy
  rf_impairment_defaults: fr1_tracking
  n_size_grid: 273

