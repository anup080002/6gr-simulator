scenario:
  name: lls_3gpp_rel20_anchor_3p5ghz_100mhz_waveform_honest_2site_6sector_150ue_50slot
  description: Strict waveform-honest browser scenario for 3.5 GHz / 100 MHz / TDD with 2 sites, 6 sectors, 150 UEs, CSI-RS, MU-MIMO beamforming, and 50 canonical slots.
  runner_profile: waveform_bundle
  target_cases: [bundle]
  honesty_mode: strict
  unsupported_output_policy: show_unavailable_with_reason
  provenance_logging: true

run_control:
  run_profile: exhaustive
  total_frames: ~
  warmup_frames: ~
  measurement_frames: ~
  total_slots: 50
  warmup_slots: 5
  measurement_slots: 45
  checkpoint_every_slots: 1
  snapshot_every_slots: 1
  log_every_slots: 1
  batch_size_links: 32
  num_workers: 32
  parallel_pool_kind: processes
  parallel_pool_idle_timeout_minutes: 1440
  warmup_time_ms: 2.5
  measurement_time_ms: 22.5
  total_time_ms: 25
  max_runtime_guard: 86400
  symbol_level_logging_enable: true
  raw_iq_capture_enable: true
  save_channel_tensors: true
  save_harq_buffers: true
  trace_capture_level: full

simulation:
  link_direction: both
  n_frames: 3
  n_slots: 50
  n_subframes: 25
  monte_carlo_iterations: 1
  snr_db: 18
  noise_operating_mode: receiver_noise_figure_thermal_noise
  min_duration_s: 0.025
  snr_sweep_offsets_db: [0]

