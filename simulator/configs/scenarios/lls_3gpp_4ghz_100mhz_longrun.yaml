  runner_profile: system_level_lls
  target_cases: [bundle]
  bundle_anchor_cases: [ul_lowpapr]
  honesty_mode: strict
  unsupported_output_policy: show_unavailable_with_reason
  provenance_logging: true
  notes: >
    Locked default long-run scenario for the MATLAB-first LLS simulator. The runtime must
    preserve strict truth semantics: no smoke rows, no silent fallback, no configured values
    relabeled as measured output, and unsupported outputs must remain visible with exact
    unavailable reasons. Browser/backend launch uses the canonical MySQL-backed flow.

