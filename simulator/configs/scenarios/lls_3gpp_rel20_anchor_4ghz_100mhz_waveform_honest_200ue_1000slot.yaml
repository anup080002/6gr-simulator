  scenario_group: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_1000slot
  scenario_name: Strict waveform-labeled NR Rel-20 study-anchor LLS scenario for 4 GHz TDD, 100 MHz, 200 randomly placed UEs, and 1000 slots.
  scenario_family: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_1000slot
  baseline_reference_name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_1000slot
