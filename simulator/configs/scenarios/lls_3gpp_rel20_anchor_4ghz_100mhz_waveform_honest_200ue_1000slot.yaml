scenario:
  name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_1000slot
  description: Strict waveform-labeled NR study-anchor browser scenario for 4 GHz / 100 MHz / TDD with 200 UEs and 1000 slots.
  notes: >
    Legacy waveform_honest browser entry kept for compatibility with existing launch URLs and stored
    payload references. Browser /run must not present this as waveform truth while the resolved
    runner_profile remains system_level_lls; promote it to waveform_bundle only when the scenario
    should dispatch directly to the coupled waveform truth path.

