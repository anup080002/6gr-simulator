  "meta": {
    "scenario_id": "lls_100mhz_tdlc_bidirectional_truth",
    "description": "Strict no-proxy waveform LLS bundle at 100 MHz with TDL-C fading, mobility-enabled Doppler, and bidirectional DL/UL PHY validation coverage at a robust 2x2 one-layer operating point.",
    "version": "1.0.0",
    "owner": "codex",
    "maturity_tag": "regression",
    "scenario_group": "lls_truth_validation",
    "tags": ["lls", "truth", "waveform", "100mhz", "tdl-c", "bidirectional", "no-proxy"]
  },
  "scenario": {
    "runner_profile": "waveform_bundle",
    "target_cases": ["bundle", "dl", "ul", "pdsch", "pusch", "pdcch", "pucch", "pbch", "ssb", "prach", "csi_rs", "srs", "dmrs", "harq"],
    "notes": "True link-level only. Multi-cell topology, UE placement, network RSRP/SINR mobility traces, and traffic-coupled scheduling are outside LLS scope in this repo.",
    "expected_outputs": [
      "air_interface/csv/lls_kpi_summary.csv",
      "air_interface/csv/lls_measured_sinr_summary.csv",
      "air_interface/csv/dl_measured_sinr_bler_curve.csv",
      "air_interface/csv/ul_measured_sinr_bler_curve.csv",
      "air_interface/csv/dl_pdsch_trials.csv",
      "air_interface/csv/ul_pusch_trials.csv",
      "air_interface/csv/pbch_trials.csv",
      "air_interface/csv/pdcch_trials.csv",
      "air_interface/csv/prach_trials.csv",
      "air_interface/csv/pucch_trials.csv",
      "air_interface/csv/srs_trials.csv",
      "air_interface/mat/link_results.mat",
      "air_interface/image/link_truth_validation_summary.png",
      "reports/scenario_report.md",
      "meta/scenario_manifest.json",
      "logs/run.log"
    ]
  },
  "simulation": {
    "link_direction": "both",
    "n_frames": 16,
    "n_slots": 16,
    "n_subframes": 12,
    "monte_carlo_iterations": 6,
    "random_seed": 21,
    "deterministic_mode": true,
    "snr_db": 30,
