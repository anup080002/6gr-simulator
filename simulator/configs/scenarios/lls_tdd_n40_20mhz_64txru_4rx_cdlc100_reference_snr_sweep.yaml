inherits:
  - ./lls_tdd_n40_20mhz_64txru_4rx_cdlc100_impaired.yaml

# Calendar authority is YAML inheritance, not constants in the runner:
# - h4_100_common_connected.yaml: SSB=20 ms; SRS=5 slots/offset 4;
#   pucch_resources.scheduling_request_resources: SR=5 slots/offset 3.
# - lls_tdd_4ghz_20mhz_64txru_4rx_cdlc100_impaired.yaml: CSI-RS,
#   CSI-IM and CSI report periods=10 slots; CSI report offset=8.
# - immediate n40 parent: TRS=20 slots/10 ms, CSI-RS/CSI-IM offset=5,
#   TRS pair offset=6 (TS 38.214 5.1.6.1.1 tracking-specific period),
#   5-ms CSI period labels (10 slots at 30 kHz), per-resource symbols/widths.
# - connected_monitoring YAML: PDCCH period=1 slot/offset 0/duration=1.
# Type-0 occasions derive from configured MIB/SCS/SSB index; PRACH occasions
# derive from configuration index 157, B4/SCS and the duplex configuration.
# Current composite-broadcast implementation repeats SIB1 with the SSB
# burst period; independent SI repetition is not implemented by a new alias.
# PDSCH/PUSCH are grant driven. Their YAML TDRA/K0/K2 lists, not a fabricated
# periodic-data field, constrain the legal allocations. DM-RS/PT-RS follow
# the actual grant and their YAML mapping configuration.

meta:
  scenario_id: lls_tdd_n40_20mhz_64txru_4rx_cdlc100_reference_snr_sweep
  description: >
    Six independent n40 2.350 GHz, 20 MHz, 30 kHz absolute-power connected
    executions at nominal receive-reference Es/N0 30, 20, 10, 0, -10 and -20 dB,
    in that descending order.
    Each child executes 100 slots (50 ms), including physical initial access,
    retaining the parent's UMa NLOS attenuation, CDL-C/100 ns fading,
    64-TXRU gNB/four-chain UE, physical RF operators, absolute sqrt(mW)
    samples, UL power control/PHR, measured RSRP/SINR, received CSI/SRS
    adaptive rank 1--4, beam reporting, ILLA/OLLA and HARQ.
    A declared nominal full-BWP unity-array reference uses fixed 30/23 dBm
    DL/UL budgets and native nrPathLoss at the explicit reference geometry.
    Its noise PSD is frozen per child/direction and is independent of actual
    received samples, fading, beam/rank, scheduled powers and UL power control.
    These points are NOT measured SINR targets, thermal-noise qualification,
    a normative 3GPP normalization formula or hardware-accuracy certification.
    Configured noise figures remain metadata and are not added to this
    controlled noise. Original child measurements and failures are retained.
  purpose: Joint absolute UMa reference-Es/N0 and separately measured SINR comparison.
  research_class: optional_research_experiment
  maturity_tag: experimental
  scenario_group: connected_tdd_bandwidth_validation
  tags: [lls, truth, tdd, fr1, n40, 20mhz, 30khz, cdl-c, uma, absolute_power, adaptive_rank, nominal_reference_esn0, no_proxy]

# Keep original GEOMETRY_NETWORK/connected_network authority and all physical
# propagation/RF/power-control settings. This parent only changes the explicit
# noise reference and owns the sequential independent children.
run_control:
  runtime_checkpoint_enable: false
  total_slots: 100
  total_time_ms: 50
  measurement_slots: 100
  measurement_time_ms: 50

simulation:
  link_direction: both
  noise_operating_mode: absolute_reference_esn0
  snr_db: 0
  absolute_reference_esn0:
    reference_policy: nominal_full_bwp_unity_array
    reference_pathloss_scenario: UMa
    # Explicit NORMALIZATION reference, not current/estimated UE geometry.
    reference_bs_position_m: [0, 0, 25]
    reference_ue_position_m: [85, 0, 1.5]
    reference_los: false
    nominal_dl_tx_power_dbm: 30
    nominal_ul_tx_power_dbm: 23
    classification: optional_research_experiment
  snr_sweep_offsets_db: [0]
  reference_sweep_enabled: false
  adaptive_sweep_enabled: false
  monte_carlo_iterations: 1
  # Fresh access/channel/RF/traffic/beam/LA/HARQ owners at each point.
  random_seed: 20260927
  deterministic_mode: true
  n_frames: 5
  n_slots: 100
  n_subframes: 50
  min_duration_s: 0.05

random_access:
  # Match the declared campaign horizon. These bound standalone PRACH
  # diagnostics; connected RA occasions remain event/calendar driven.
  num_slots: 100
  num_subframes: 50

sweeps_and_matrix:
  snr_sweep:
    enabled: false
    state_policy: independent_link_state_per_point
    initial_access_state_policy: independent_per_point
    values_db: [0]

scenario:
  runner_profile: generic_sweep
  sweep:
    base_profile: waveform_bundle
    execution_error_policy: retain_failure_and_continue
    output_name: lls_tdd_n40_20mhz_64txru_4rx_cdlc100_reference_snr_sweep
    # Preserve failed access/decoding and unavailable populations. No forced
    # rank, detector, current-sample normalization or successful rescue rows.
    overrides:
      - label: reference_esn0_30_db
        config:
          meta: {scenario_id: lls_tdd_n40_20mhz_reference_esn0_30db}
          simulation: {snr_db: 30, random_seed: 20260927}
          output: {profile: lls_tdd_n40_20mhz_reference_esn0_30db}
      - label: reference_esn0_20_db
        config:
          meta: {scenario_id: lls_tdd_n40_20mhz_reference_esn0_20db}
          simulation: {snr_db: 20, random_seed: 20260927}
          output: {profile: lls_tdd_n40_20mhz_reference_esn0_20db}
      - label: reference_esn0_10_db
        config:
          meta: {scenario_id: lls_tdd_n40_20mhz_reference_esn0_10db}
          simulation: {snr_db: 10, random_seed: 20260927}
          output: {profile: lls_tdd_n40_20mhz_reference_esn0_10db}
      - label: reference_esn0_0_db
        config:
          meta: {scenario_id: lls_tdd_n40_20mhz_reference_esn0_0db}
          simulation: {snr_db: 0, random_seed: 20260927}
          output: {profile: lls_tdd_n40_20mhz_reference_esn0_0db}
      - label: reference_esn0_m10_db
        config:
          meta: {scenario_id: lls_tdd_n40_20mhz_reference_esn0_m10db}
          simulation: {snr_db: -10, random_seed: 20260927}
          output: {profile: lls_tdd_n40_20mhz_reference_esn0_m10db}
      - label: reference_esn0_m20_db
        config:
          meta: {scenario_id: lls_tdd_n40_20mhz_reference_esn0_m20db}
          simulation: {snr_db: -20, random_seed: 20260927}
          output: {profile: lls_tdd_n40_20mhz_reference_esn0_m20db}

output:
  profile: lls_tdd_n40_20mhz_64txru_4rx_cdlc100_reference_snr_sweep
