inherits:
  - ./lls_tdd_5mhz_rank2_4tx2rx_awgn_m10db.yaml

meta:
  scenario_id: lls_tdd_5mhz_rank2_shared_awgn_snr_sweep
  description: >
    Eight-point configured-SNR diagnostic using the complete saturated-load
    5 MHz TDD shared-clock 4TX/2RX fixed-matrix AWGN runtime with rank
    adaptation capped at rank two, TS 38.214 MCS tables, ILLA, OLLA,
    CSI-RS, SRS, DM-RS, HARQ and shared PUCCH/PUSCH feedback. Each SNR point
    starts with independent link and initial-access state. This is integrated
    truth evidence, not a statistically qualified BLER publication campaign.
  purpose: >
    Measure the same integrated 5 MHz rank-two runtime at 40, 30, 20, 10, 0,
    -10, -20 and -30 dB without carrying causal state between SNR points.
  research_class: optional_research_experiment
  tags: [lls, truth, tdd, 5mhz, shared_clock, identity_awgn, dl_rank2, ul_rank2, nr_mcs, illa, olla, configured_snr_sweep]

canonical_control:
  launch:
    scenario_mode: isolated_fixed_snr_points
    sweep_enabled: false
    fixed_link_campaign_enabled: false
    geometry_enabled: false

# The parent is orchestration-only. Each child below resolves one fixed SNR
# before its physical receiver, noise generator and channel owner are built.
simulation:
  snr_db: 0
  snr_sweep_offsets_db: [0]
  reference_sweep_enabled: false
  adaptive_sweep_enabled: false

sweeps_and_matrix:
  snr_sweep:
    enabled: false
    state_policy: independent_link_state_per_point
    initial_access_state_policy: independent_per_point
    values_db: [0]

scenario:
  runner_profile: generic_sweep
  sweep:
    base_profile: waveform_bundle
    # Retain unsuccessful points without preventing higher-SNR execution.
    # This does not waive child acceptance or required artifact checks.
    execution_error_policy: retain_failure_and_continue
    output_name: lls_tdd_5mhz_rank2_shared_awgn_snr_sweep
    overrides:
      - label: snr_40_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_40db
          simulation:
            snr_db: 40
          # Detector false-alarm probability is SNR-independent. Execute
          # the physical no-signal PRACH/PDCCH campaigns exactly once in
          # the first child rather than repeating them at all eight points.
          random_access_evidence:
            false_alarm_test_enabled: true
            missed_detection_test_enabled: true
          random_access:
            statistical_qualification:
              enabled: true
          control:
            pdcch_strict:
              statistical_qualification:
                enabled: true
                target_false_alarm_probability: 0.01
                confidence_level: 0.95
                minimum_waveform_trials: 25
                maximum_waveform_trials: 1000
                batch_size_waveform_trials: 25
                minimum_candidate_decisions: 500
                minimum_false_alarm_events: 0
                ci_width_target: 0.01
                planned_looks: 40
                deterministic_seeds: [240617, 240629, 240643, 240647]
            pucch_strict:
              # Fixed before execution. These independent observations use
              # the same installed format-2 threshold as the shared runtime;
              # no threshold is tuned from the observed campaign.
              statistical_qualification:
                enabled: true
                format: 2
                trials_per_hypothesis: 512
                confidence_level: 0.95
                target_false_alarm_probability: 0.01
                target_missed_feedback_probability: 0.01
                signal_present_snr_db: 20
                seed_base: 731001
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_40db
      - label: snr_30_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_30db
          simulation:
            snr_db: 30
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_30db
      - label: snr_20_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_20db_sweep_point
          simulation:
            snr_db: 20
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_20db_sweep_point
      - label: snr_10_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_10db
          simulation:
            snr_db: 10
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_10db
      - label: snr_0_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_0db
          simulation:
            snr_db: 0
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_0db
      - label: snr_m10_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_m10db
          simulation:
            snr_db: -10
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_m10db
      - label: snr_m20_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_m20db
          simulation:
            snr_db: -20
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_m20db
      - label: snr_m30_db
        config:
          meta:
            scenario_id: lls_tdd_5mhz_rank2_shared_awgn_m30db
          simulation:
            snr_db: -30
          output:
            profile: lls_tdd_5mhz_rank2_shared_awgn_m30db
output:
  profile: lls_tdd_5mhz_rank2_shared_awgn_snr_sweep
