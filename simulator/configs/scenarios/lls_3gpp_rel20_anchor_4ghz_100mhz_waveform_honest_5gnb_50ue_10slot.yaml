scenario:
  name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_5gnb_50ue_10slot
  description: Strict waveform-honest NR study-anchor browser scenario for 4 GHz / 100 MHz / TDD with 5 gNBs, 50 UEs, and 10 canonical slots.
  runner_profile: waveform_bundle
  notes: >
    Browser-owned canonical waveform_bundle scenario. This path dispatches directly to the coupled
    waveform truth loop and relies on the runtime's canonical slot accounting plus configured TDD duplex
    pattern handling. Unsupported browser labels must remain explicit and truthful.

run_control:
  run_profile: exhaustive
  total_slots: 10
  warmup_slots: 2
  measurement_slots: 8
  checkpoint_every_slots: 1
  snapshot_every_slots: 1
  log_every_slots: 1
  warmup_time_ms: 1
  measurement_time_ms: 4
  total_time_ms: 5
  batch_size_links: 16
  num_workers: 8
  max_runtime_guard: 7200

simulation:
  n_frames: 1
  n_slots: 10
  n_subframes: 5
  min_duration_s: 0.005

random_access:
  enabled: true
  prach_format: B4
  preamble_length_mode: short
  preamble_count: 64
  zero_correlation_zone: 8
  detection_threshold: 0.5
  msg3_enabled: true
  configuration_index: 167
  subcarrier_spacing_khz: 30
  root_sequence_index: 1
  preamble_index: 0

deployment_topology:
  num_sites: 5
  num_base_stations: 5
  num_cells: 5
  num_sectors_per_site: 1
  num_ues: 50
  num_trps: 5
  wraparound_enabled: false

users:
  enabled: true
  n_users: 50
  execution_model: slot_coupled_truth
  save_user_tables: true

mimo:
  trp_count: 5

traffic:
  flows:
    ue_count: 50

output:
  profile: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_5gnb_50ue_10slot
