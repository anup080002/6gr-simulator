inherits:
  - ./lls_pdcch_shared_queue_fixture.yaml

meta:
  scenario_id: lls_pusch_csi_delivery_fixture
  description: Shared CSI-RS receiver publication and PUSCH feedback with deferred scheduler delivery.
  purpose: Shared DL CSI source and UL transport; isolated coded DL HARQ source; prescribed access state; not integrated 12 dB qualification.
  research_class: optional_research_experiment

link_adaptation:
  # The actual CSI-RS producer is one-based slot 3 (absolute slot 2), the
  # newest configured occasion before the slot-10 report's reference-resource
  # boundary.  This component intentionally defers that received measurement
  # seven slots so its UCI shares the scheduled slot-10 PUSCH.  Producer
  # selection must never be inferred as `report slot - feedback delay`.
  feedback_delay_slots: 7
