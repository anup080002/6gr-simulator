inherits:
  - ./lls_pdcch_shared_queue_fixture.yaml

meta:
  scenario_id: lls_pusch_csi_delivery_fixture
  description: Shared post-SIB1 CSI-RS reception and configured periodic CSI on PUSCH with deferred receiver delivery.
  purpose: Actual SSB/MIB/SIB1 and shared CSI/UCI transport; isolated coded DL HARQ sources; declared initial connected RA/TAG; not full access, RRC or integrated 12 dB qualification.
  research_class: optional_research_experiment

# The component installs the initial connected RA/TAG context explicitly.
# Actual received SIB1 still gates measurement installation; production n40
# retains its required cold-access procedure.
control_gating:
  prach_required: false

# Source slot 6 is the configured reference resource for report slot 10.
# The actual slot-10 PUSCH receiver result is delivered at slot 11; neither
# that delivery nor the report occasion is inferred from the AMC delay.
csi_acquisition_and_reporting:
  csi_report_periodicity_slots: 5
  csi_report_offset_slots: 4

link_adaptation:
  # Independent generic feedback-delay authority, deliberately different
  # from the periodic CSI source-to-report interval. Metadata-only enqueue
  # tests cover this delay; this waveform fixture covers periodic UCI.
  feedback_delay_slots: 7
