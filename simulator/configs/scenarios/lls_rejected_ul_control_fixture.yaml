inherits:
  - ./lls_pdcch_shared_queue_fixture.yaml

meta:
  scenario_id: lls_rejected_ul_control_fixture
  description: Known-candidate PDCCH carrying retained UL grant bits at a negative operating point.
  purpose: Physical rejection stimulus for receive-only contracts, not acquired timing or connected blind monitoring.
  research_class: optional_research_experiment

simulation:
  snr_db: -30

# This endpoint deliberately tests rejection of one installed candidate.
# The shared-queue parent also serves blind-monitoring tests; inheriting
# that policy changes this fixture's declared experiment before decoding.
control:
  blind_search_enabled: false

# No initial-access or SI decoder is executed at this endpoint. Keep the
# installed known-candidate policy consistent with that bounded scope.
initial_access:
  sib1:
    enabled: false
