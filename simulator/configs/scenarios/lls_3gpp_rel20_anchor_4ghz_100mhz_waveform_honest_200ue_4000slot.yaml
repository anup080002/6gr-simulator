  rank: 2
  modulation: 256QAM

pusch:
  layer_count: 2
  num_layers: 2
  num_antenna_ports: 2
  modulation: 256QAM

# Coupled execution consumes the monitored control-region allocation from
# YAML.  It must not infer a PDCCH region from a CORESET duration or from a
# MATLAB default because either would bypass the scenario authority.
pdcch:
  enabled: true
  start_symbol: 0
  num_symbols: 2

