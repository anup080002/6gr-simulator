  release_reference: Rel-20 NR study anchor with current NR PHY/MAC baseline
  source_reference: TS 38.201/202/211/212/213/214/215/321/331 with TR 38.901 study-aligned channel assumptions
  research_class: baseline_benchmark
  maturity_tag: baseline
  scenario_group: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_4000slot
  scenario_name: Strict waveform-backed honest NR Rel-20 study-anchor LLS scenario for 4 GHz TDD, 100 MHz, 200 randomly placed UEs, and 4000 slots.
  scenario_family: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_4000slot
  purpose: Browser-launched MATLAB-first LLS study anchored on current NR PHY/MAC with strict truth labeling and no placeholder telemetry.
  study_status: baseline
  baseline_reference_name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_4000slot
  comparison_group_name: rel20_anchor_4ghz_100mhz_200ue_4000slot
  notes: >
    Canonical browser-default honest LLS scenario anchored on current NR PHY/MAC execution,
    with Rel-20 treated as study context only. Unsupported outputs must remain explicitly unavailable.
  tags:
    - lls
