scenario:
  name: lls_3gpp_rel20_anchor_4ghz_100mhz_waveform_honest_200ue_4000slot
  description: Strict waveform-backed honest NR study-anchor browser scenario for 4 GHz / 100 MHz / TDD with 200 UEs and 4000 slots.
  runner_profile: system_level_lls
  target_cases: [bundle]
  bundle_anchor_cases: [ul_lowpapr]
  honesty_mode: strict
  unsupported_output_policy: show_unavailable_with_reason
  provenance_logging: true
  notes: >
    Browser-owned canonical default scenario. The active execution path is the truthful
    MATLAB-first system-level LLS runner launched from /run. Grants execute through the
    waveform-backed system PHY replay path where the repo supports it; outputs that remain
    abstraction-level or unavailable must stay labeled explicitly and must not be promoted
    to waveform truth. This canonical default disables long-run grant audit deferral so the
    browser-launched run does not report zero served traffic by suppressing most waveform
    grant executions.

