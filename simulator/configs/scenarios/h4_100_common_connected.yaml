    bwp_id: 0
    direction: DL
    n_start_bwp: 0
    n_size_bwp: 273
    scs_khz: 30
    cp_type: normal
    active: true
    common_tdd_reference_scs_khz: 30
  ul:
    bwp_id: 0
    direction: UL
    n_start_bwp: 0
    n_size_bwp: 273
    scs_khz: 30
    cp_type: normal
    active: true
    common_tdd_reference_scs_khz: 30
  component_carriers:
    - cc_id: 0
      serving_cell_id: 1
      scheduling_cc_ids: [0]
      center_frequency_hz: 4000000000
      band: H4
      frequency_range: FR1
      channel_bandwidth_mhz: 100
      duplex_mode: TDD
      dl_carrier_grid: {n_start_grid: 0, n_size_grid: 273, scs_khz: 30}
      ul_carrier_grid: {n_start_grid: 0, n_size_grid: 273, scs_khz: 30}
      carrier_indicator_map:
        - {indicator: 0, scheduled_cc_id: 0}

tdd_timing:
