  pdcch_to_pdsch_k0: 0
  pdcch_to_pusch_k2: 1
  ul_grant_k2: 1
  dl_harq_feedback_k1: [1, 2, 3, 4, 5, 6, 7, 8]
  k1_selection_policy: first_valid_configured
  harq_roundtrip_slots: 8
  dl_to_ul_guard_time_us: 8.138
  timing_advance_max_us: 667
  timing_advance_ticks: 0
  n1_pdsch_processing_time_symbols: 8
  n2_pusch_preparation_time_symbols: 10

initial_access:
