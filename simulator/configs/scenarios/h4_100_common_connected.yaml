  report_configuration:
    report_config_id: h4-csi-report-0
    epoch: 0
    n1: 2
    n2: 1
    o1: 4
    o2: 1
    panels: 2
    codebook_mode: 1
    report_quantity: cri-RI-PMI-CQI
    number_of_beams: 8
    frequency_granularity: wideband
    uci_channel: PUCCH
    num_subbands: 1
    phase_alphabet_size: 4

mimo_and_beam_management:
  beam_sweeping: true
  beam_refinement: true
  beam_switching: true
  beam_tracking: true
  beam_prediction: false
  rank_set: [1, 2, 4]
  codebook_family: typeI-MultiPanel
  reciprocity_mode: TDD
  ssb_beam_count: 4
  csi_rs_beam_count: 8
  data_beam_count: 8
  selection_authority: received_ssb_and_csirs_measurements
  geometry_oracle_forbidden: true
  runtime_state_machine_enabled: true
  require_received_tci_for_data: true
  tci_activation_authority: decoded_pdcch_tci_codepoint
  # The four measured SSB candidates seed four coarse CSI/data states. A
  # later independently received CRI may select any of the eight states.
  ssb_to_initial_csi_resource_ids: [0, 2, 4, 6]
  csi_rs_resource_to_tci_state_ids: [16, 17, 18, 19, 20, 21, 22, 23]
  csi_rs_resource_to_tci_codepoints: [0, 1, 2, 3, 4, 5, 6, 7]
