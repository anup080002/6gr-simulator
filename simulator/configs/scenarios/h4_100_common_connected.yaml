inherits:
  - ./lls_causal_access_to_data_wiring_tdd_short_continuous_iq.yaml
  - ../bands/h4_100_4ghz_tdd.yaml
  - ../mimo/ran1_h4_64txru_4rx.yaml
  - ../control/pdcch_joint_tdd_admission.yaml

meta:
  scenario_id: h4_100_common_connected
  description: Common 4 GHz 100 MHz H4 TDD connected-waveform contract with four active SSB beams, eight CSI-RS/data beam states, receiver-derived CRI/RI/PMI/CQI, and rank up to four in both directions.
  purpose: YAML-owned H4 waveform family base; executable children select A0, TDL-A/30 ns or CDL-C/100 ns.
  research_class: study_item_candidate
  maturity_tag: experimental
  scenario_group: h4_100_ran1_link_evaluation
  tags: [lls, truth, tdd, fr1, 4ghz, 100mhz, h4, beam_management, adaptive_rank, no_proxy]

scenario:
  runner_profile: waveform_bundle
  target_cases: [bundle]

run_control:
  total_slots: 200
  total_time_ms: 100

simulation:
  link_direction: both
  n_frames: 10
  n_slots: 200
  n_subframes: 100
  monte_carlo_iterations: 1
  random_seed: 20260927
  deterministic_mode: true
  snr_db: 20
  noise_operating_mode: standalone_awgn_snr_argument
  min_duration_s: 0.1
  snr_sweep_offsets_db: [0]

integration:
  power_reference_mode: normalized_unit_es

system:
  scheduler:
    # Grant TBS is calculated from the materialized allocation with nrTBS.
    # No fast-NRE approximation is permitted in this H4 family.
    tbsMode: faithful
    fastNREApprox: false

power_and_rf_frontend:
  bs_tx_power_dbm: 30
  ue_tx_power_dbm: 23
  downlink_power_normalization_policy: fixed_epre_over_configured_bwp
  uplink_power_normalization_policy: active_ofdm_total_power
  ssb_power_reference_policy: quantized_full_bwp_epre
  ue_noise_figure_db: 7
  noise_figure: 5
  rx_gain_control: agc
  dac_resolution_bits: 12
  adc_resolution_bits: 12
  pa_model: ideal
  pa_nonlinearity_model: none
  cfr_enabled: false
  dpd_enabled: false
  iq_imbalance: none
  dc_offset: none
  lo_phase_noise_model: none
  cfo_model: none
  drift_rate_model: none
  saturation_model: none

canonical_control:
  integration:
    power_reference_mode: normalized_unit_es
    configured_snr_is_link_authority: true
  mimo:
    n_layers: 1
    max_dl_layers: 4
    max_ul_layers: 4
  pdsch:
    layer_count: 1
    rank: 1

bwp:
