        {"label": "low_correlation_srs_sequence", "config": {"reference_signals": {"srs_sequence_family": "low_correlation_candidate"}}},
        {"label": "receiver_mmse_irc", "config": {"reference_signals": {"receiver_example": "mmse_irc", "sgcs_reporting_enabled": true, "nmse_reporting_enabled": true}}},
