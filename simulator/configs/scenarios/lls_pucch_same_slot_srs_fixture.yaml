inherits:
  # Install the same independently configured DL/UL DCI used by the other
  # physical feedback-clock cases; the legacy queue fixture lacks it.
  - ../validation/lls_pucch_feedback_clock_connected.yaml

meta:
  scenario_id: lls_pucch_same_slot_srs_fixture
  description: Buffered PUCCH timing from a completed same-slot SRS with disjoint symbols.
  purpose: Qualify receive-clock causality; declared access state and no PUSCH execution.
  research_class: optional_research_experiment

reference_signals:
  srs:
    # Full UL slot: SRS symbol 11 precedes PUCCH symbols 12/13. No
    # superposition of same-UE reference and feedback on the same REs.
    symbol_start: 11
