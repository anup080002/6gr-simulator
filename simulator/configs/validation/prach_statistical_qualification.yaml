# Simulator qualification policy, not a 3GPP-mandated population size.
# This is an independent physical PRACH campaign, not connected-access proof.
# Keep the false-alarm/missed-detection gates explicit; reaching a cap without
# satisfying them remains statistically unqualified.
random_access:
  statistical_qualification:
    enabled: true
    target_false_alarm_probability: 0.001
    confidence_level: 0.95
    minimum_trials: 3000
    maximum_trials: 12000
    batch_size_trials: 250
    minimum_false_alarm_events: 0
    ci_width_target: 0.001
    planned_looks: 48
    target_missed_detection_probability: 0.01
    required_detection_snr_db: [6, 12]
    minimum_detection_trials: 300
    maximum_detection_trials: 2000
    batch_size_detection_trials: 50
    minimum_missed_detection_events: 0
    detection_ci_width_target: 0.01
    detection_planned_looks: 40
    deterministic_seeds: [240616, 240631, 240641, 240659]
