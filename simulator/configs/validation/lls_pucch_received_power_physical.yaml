inherits:
  - ./lls_pucch_feedback_clock_connected.yaml
meta:
  scenario_id: lls_pucch_received_power_physical
  research_class: optional_research_experiment
  description: Physical-power shared PUCCH received-command component fixture
canonical_control:
  launch:
    run_class: ue_placement_geometry_lls
    scenario_mode: ue_placement_geometry
    sweep_enabled: false
    fixed_link_campaign_enabled: false
    geometry_enabled: true
  integration:
    run_mode: GEOMETRY_NETWORK
    subprofile: connected_network
    configured_snr_is_link_authority: false
    power_reference_mode: absolute_calibrated_sqrt_mw
simulation:
  noise_operating_mode: receiver_noise_figure_thermal_noise
channels:
  pathloss_enabled: true
initial_access:
  sib1:
    enabled: true
    pusch_config_common:
      pusch_TimeDomainAllocationList:
        # Original common allocation: K2=4, symbols 0..10 (11 symbols).
        - {k2: 4, mappingType: typeA, startSymbolAndLength: 69}
