# Connected bidirectional regression resource plan. The full physical access
# parent is retained; this is not a pre-attached or ideal-feedback shortcut.
inherits:
  - lls_fdd_staged_data_connected_dci.yaml

meta:
  scenario_id: lls_bidirectional_disjoint_ul
  research_class: baseline_benchmark
  description: Connected bidirectional data with disjoint PUSCH, SRS and PUCCH symbols.

pusch:
  # Zero-based symbols 0..10; both configured waveform and installed DCI
  # TDRA must describe the same allocation. TBS is recalculated natively.
  start_symbol: 0
  num_symbols: 11
  time_domain_allocations:
    - [0, 0, 11, 1]

reference_signals:
  srs:
    # PUCCH resources use 12/13. Keeping SRS on 13 repeatedly suppressed
    # the timing pilot; widening the receiver freshness limit is not a fix.
    symbol_start: 11
    pucch_collision_policy: require_disjoint_symbols_for_first_measurement
