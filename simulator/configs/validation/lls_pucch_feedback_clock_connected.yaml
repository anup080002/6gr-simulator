# Paired installed DCI for a shared SRS/PUCCH component test. Source DL
# decoding is an isolated waveform fixture, not measured shared access.
inherits:
  - ../scenarios/lls_pucch_baseline_signal_fixture.yaml
meta:
  scenario_id: lls_pucch_feedback_clock_connected
  research_class: optional_research_experiment
  description: Installed connected control for the SRS and PUCCH clock regression
simulation:
  snr_db: 60
  noise_operating_mode: standalone_awgn_snr_argument
deployment_topology:
  indoor_ue_fraction: 0.0
channels:
  o2i_model: none
csi_acquisition_and_reporting:
  # Keep calendar causality enabled, but place CSI outside this dedicated
  # 10/11-slot HARQ-clock test. Combined UCI has its own receiver tests.
  # Slot 19 is a legal UL reporting occasion (zero-based offset 18).
  report_periodicity: 20ms
  csi_report_periodicity_slots: 20
  csi_report_offset_slots: 18
link_adaptation:
  # The parent uses five-slot reports. Retain its two-report recovery rule,
  # but make the permitted gap consistent with this fixture's own calendar.
  # Do not disable the production cadence validator or confirmation policy.
  outage_recovery_max_gap_slots: 20
pucch_resources:
  # Retain the enabled CSI calendar for its initialization/causality guard.
  # This HARQ clock test has no configured scheduling-request producer.
  sr_resource_ids: []
  scheduling_request_resources: []
  overlap_policy:
    uci_on_pusch_enabled: false
initial_access:
  sib1:
    enabled: false
mimo:
  qcl_tci:
    enabled: false
control:
  connected_dci:
    tci_present: false
  coreset_qcl_association:
    configuration_epoch: 1
    serving_cell_index: 0
    component_carrier_index: 0
    bwp_id: 0
    coreset_id: 0
    activation_absolute_slot0: 0
    source_reference_signal: SSB
    source_reference_signal_id: 0
    qcl_types: [A]
    initialization_source: lls_preconfigured_higher_layer_context
