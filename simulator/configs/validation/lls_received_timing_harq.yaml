inherits:
  - ../scenarios/lls_causal_access_to_data_wiring_tdd_short_continuous_iq.yaml
  - ../channels/shared_identity_awgn.yaml
  - ../control/pdcch_joint_tdd_admission.yaml

meta:
  scenario_id: lls_received_timing_harq
  description: Physical access followed by fixed-rate bidirectional HARQ on the shared TDD sample clock.
  research_class: baseline_benchmark
  maturity_tag: regression

# Access and data traverse the same noise plane. High-rate data may fail;
# never synthesize a NACK or retry a TB after successful CRC.
simulation:
  snr_db: 12
  random_seed: 43
  monte_carlo_iterations: 1

run_control:
  continuous_raw_iq_capture_enable: false
  batch_size_links: 1
  num_workers: 1

modulation:
  dl_modulation_order: 6
  ul_modulation_order: 6
  mcs_table: qam64_table1
  dl_mcs_index: 28
  ul_mcs_index: 28

modulation_and_mapping:
  qam_order: 6
  pdsch_modulation: 64QAM
  pusch_modulation: 64QAM
  dl_max_modulation: 64QAM
  ul_max_modulation: 64QAM
  dl_mcs_index: 28
  ul_mcs_index: 28
  ul_mcs_table: qam64_table1

link_adaptation:
  operating_point_mode: fixed
  fixed_or_amc: fixed
  pdsch_link_adaptation_policy: fixed
  pusch_link_adaptation_policy: fixed
  rank_adaptation_policy: fixed
  beam_adaptation_policy: fixed

pdsch:
  execution_profile: scheduler_truth
  fixed_mcs: 28
  modulation: 64QAM
  mcs_table: qam64_table1
  link_adaptation_mode: fixed
  layer_count: 1
  rank: 1

pusch:
  execution_profile: scheduler_truth
  fixed_mcs: 28
  mcs_index: 28
  modulation: 64QAM
  mcs_table: qam64_table1
  target_code_rate_per_codeword: [0.92578125]
  layer_count: 1
  num_layers: 1

output_control:
  save_raw_waveforms: false
  save_llrs: false
  save_channel_snapshots: false
  save_constellations: false
  save_debug_events: false
  save_plots: false

output:
  profile: lls_received_timing_harq
  save_figures: false
  save_mat: false
  save_png: false
  phy_signal_diagnostic_enabled: false
  live_heavy_refresh_interval_frames: 58
