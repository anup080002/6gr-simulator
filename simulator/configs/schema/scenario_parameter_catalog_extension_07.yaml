top_level_order:
  - canonical_control
  - initial_access
  - bwp
  - pdsch6gr
  - pdsch
  - pusch
  - pdcch
  - channel_estimation
  - equalization
  - synchronization
  - rf_hardware
  - rf_frontend
  - tdd_timing
  - execution_scales
  - validation
sections:
  canonical_control:
    required: false
    parameters:
      identity: {required: false, type: struct}
      launch: {required: false, type: struct}
      run: {required: false, type: struct}
      topology: {required: false, type: struct}
      radio: {required: false, type: struct}
      channel: {required: false, type: struct}
      mobility: {required: false, type: struct}
      antenna: {required: false, type: struct}
      power: {required: false, type: struct}
      mimo: {required: false, type: struct}
      scheduler: {required: false, type: struct}
      traffic: {required: false, type: struct}
      reference_signals: {required: false, type: struct}
      csi: {required: false, type: struct}
      control: {required: false, type: struct}
      initial_access: {required: false, type: struct}
      random_access: {required: false, type: struct}
      random_access_evidence: {required: false, type: struct}
      coding: {required: false, type: struct}
      modulation: {required: false, type: struct}
      harq: {required: false, type: struct}
      receiver: {required: false, type: struct}
      pdsch: {required: false, type: struct}
      impairments: {required: false, type: struct}
      ai_ml: {required: false, type: struct}
      energy: {required: false, type: struct}
      kpis: {required: false, type: struct}
      output: {required: false, type: struct}
      logging: {required: false, type: struct}
      sweeps: {required: false, type: struct}
      validation: {required: false, type: struct}
      manifest: {required: false, type: struct}
      runtime_overrides: {required: false, type: struct_array}
  initial_access:
    required: false
    parameters:
      enabled: {required: true, type: boolean}
      profile: {required: true, type: string}
      configuration_epoch: {required: true, type: integer, min: 0}
      band_context: {required: true, type: string}
      spectrum: {required: true, type: string}
      shared_spectrum: {required: true, type: boolean}
      random_access_procedure: {required: true, type: string}
      require_explicit_ssb_bitmap: {required: true, type: boolean}
      validation_snr_db: {required: true, type: number}
      validation_seed: {required: true, type: integer, min: 0}
      ssb: {required: true, type: struct}
      mib: {required: true, type: struct}
      type0: {required: true, type: struct}
      sib1: {required: true, type: struct}
      rrc: {required: true, type: struct}
      extensions: {required: true, type: struct}
  simulation:
    required: false
    parameters:
      noise_operating_mode:
        required: false
        type: string
        allowed_values: [receiver_noise_figure_thermal_noise, standalone_awgn_snr_argument]
  bwp:
    required: false
    parameters:
      dl: {required: false, type: struct}
      ul: {required: false, type: struct}
      component_carriers: {required: false, type: struct_array}
      switch_commands: {required: false, type: struct_array}
  pdsch:
    required: false
    parameters:
      execution_profile:
        required: false
        type: string
        allowed_values: [connected_strict, sps_strict, ra_si_strict, phy_calibration]
      prb_set: {required: false, type: number_list, integer: true, min_items: 1}
      prb_start: {required: false, type: integer, min: 0}
      num_prb: {required: false, type: integer, min: 1}
      resource_allocation_type: {required: false, type: string}
      mapping_type: {required: false, type: string}
      start_symbol: {required: false, type: integer, min: 0}
      num_symbols: {required: false, type: integer, min: 1}
      vrb_to_prb_mapping: {required: false, type: string}
      prb_bundling_type: {required: false, type: string}
      prb_bundle_size: {required: false, type: string_or_number}
      rate_matching_pattern: {required: false, type: string_list}
      xoh_pdsch: {required: false, type: number}
      tbs_scaling: {required: false, type: number, min_exclusive: 0}
      cbg_transmission: {required: false, type: boolean}
  pusch:
    required: false
    parameters:
      prb_set: {required: false, type: number_list, integer: true, min_items: 1}
      prb_start: {required: false, type: integer, min: 0}
      num_prb: {required: false, type: integer, min: 1}
      resource_allocation_type: {required: false, type: string}
      mapping_type: {required: false, type: string}
      start_symbol: {required: false, type: integer, min: 0}
      num_symbols: {required: false, type: integer, min: 1}
      rnti: {required: false, type: integer, min: 0, max: 65535}
      scrambling_id: {required: false, type: integer, min: 0, max: 1023}
      mcs_table: {required: false, type: string}
      mcs_index: {required: false, type: integer, min: 0, max: 31}
      modulation: {required: false, type: string}
      target_code_rate_per_codeword: {required: false, type: number_list, min_items: 1}
      num_layers: {required: false, type: integer, min: 1, max: 8}
      num_antenna_ports: {required: false, type: integer, min: 1, max: 8}
      transmission_scheme: {required: false, type: string, allowed_values: [codebook, nonCodebook]}
      codebook_type: {required: false, type: string}
      tpmi: {required: false, type: integer, min: 0}
      sri: {required: false, type: integer, min: 0}
      rv_per_codeword: {required: false, type: number_list, integer: true, min_items: 1}
      ndi_per_codeword: {required: false, type: number_list, integer: true, min_items: 1}
      harq_process_id: {required: false, type: integer, min: 0}
      frequency_hopping:
        required: false
        type: string
        allowed_values: [none, disabled, intra_slot, inter_slot]
      second_hop_start_prb: {required: false, type: integer, min: 0}
      intra_slot_frequency_hopping: {required: false, type: boolean}
      inter_slot_frequency_hopping: {required: false, type: boolean}
      transform_precoding: {required: false, type: boolean}
      codebook_based_transmission: {required: false, type: boolean}
      dmrs_configuration_type: {required: false, type: integer, allowed_numeric_values: [1, 2]}
      dmrs_length: {required: false, type: integer, allowed_numeric_values: [1, 2]}
      dmrs_additional_position: {required: false, type: integer, min: 0, max: 3}
      dmrs_type_a_position: {required: false, type: integer, allowed_numeric_values: [2, 3]}
      dmrs_num_cdm_groups_without_data: {required: false, type: integer, min: 1, max: 3}
      dmrs_port_set: {required: false, type: number_list, integer: true, min_items: 1}
      dmrs_nid_nscid: {required: false, type: integer, min: 0, max: 65535}
      dmrs_nscid: {required: false, type: integer, allowed_numeric_values: [0, 1]}
      dmrs_nrs_id: {required: false, type: integer, min: 0, max: 1007}
      dmrs_group_hopping: {required: false, type: boolean}
      dmrs_sequence_hopping: {required: false, type: boolean}
      ptrs_enabled: {required: false, type: boolean}
      ptrs_time_density: {required: false, type: integer, allowed_numeric_values: [1, 2, 4]}
      ptrs_frequency_density: {required: false, type: integer, allowed_numeric_values: [2, 4]}
      ptrs_re_offset: {required: false, type: string, allowed_values: ['00', '01', '10', '11']}
      ptrs_port_set: {required: false, type: number_list, integer: true, min_items: 1}
      ptrs_nid: {required: false, type: integer, min: 0, max: 1007}
      uci_beta_offset_ack: {required: false, type: number, min: 0}
      uci_beta_offset_csi1: {required: false, type: number, min: 0}
      uci_beta_offset_csi2: {required: false, type: number, min: 0}
      uci_scaling: {required: false, type: number, min: 0, max: 1}
      repetition_type: {required: false, type: string}
      repetition_count: {required: false, type: integer, min: 1}
      power_control: {required: false, type: string_or_struct}
      srs_authority: {required: false, type: struct}
      xoh_pusch: {required: false, type: number}
      cbg_transmission: {required: false, type: boolean}
      tp_pi2_bpsk: {required: false, type: boolean}
  pdcch:
    required: false
    parameters:
      start_symbol: {required: false, type: integer, min: 0}
      num_symbols: {required: false, type: integer, min: 1}
      coreset: {required: false, type: struct_array}
      coresets: {required: false, type: struct_array}
      search_spaces: {required: false, type: struct_array}
      blind_decoding_attempts: {required: false, type: integer, min: 1}
      dmrs_scrambling_id_source: {required: false, type: string}
      rnti_config: {required: false, type: struct}
  channel_estimation:
    required: false
