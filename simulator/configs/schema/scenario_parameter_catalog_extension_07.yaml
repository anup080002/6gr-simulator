      specification_version: {required: false, type: string}
      claim_class: {required: false, type: string}
      configuration_epoch: {required: false, type: integer, min: 1}
      reference_plane: {required: false, type: struct}
      oscillator: {required: false, type: struct}
      timing_and_sample_clock: {required: false, type: struct}
      phase_noise: {required: false, type: struct}
      iq_and_lo_leakage: {required: false, type: struct}
      pa: {required: false, type: struct}
      cfr: {required: false, type: struct}
      dpd: {required: false, type: struct}
      dac: {required: false, type: struct}
      receiver: {required: false, type: struct}
      blocker: {required: false, type: struct}
      measurements: {required: false, type: struct}
      ul_power_control: {required: false, type: struct}
  tdd_timing:
    required: false
