      type2_codebook_oversampling_factor_O1: {required: false, type: integer, min: 1}
      type2_codebook_oversampling_factor_O2: {required: false, type: integer, min: 1}
      csi_rs_based_precoder_update: {required: false, type: boolean}
  reference_signals:
    parameters:
      pdsch_dmrs_typeA_position: {required: false, type: integer, allowed_numeric_values: [2, 3]}
      pusch_dmrs_typeA_position: {required: false, type: integer, allowed_numeric_values: [2, 3]}
      srs_comb_size: {required: false, type: integer, min: 1}
      srs_comb_offset: {required: false, type: integer, min: 0}
      srs_nrof_symbols: {required: false, type: integer, min: 1}
      srs_nrof_antenna_ports: {required: false, type: integer, min: 1}
      srs_guard_band_nrof_rbs: {required: false, type: integer, min: 0}
      srs_freq_domain_position: {required: false, type: integer, min: 0}
      srs_freq_domain_shift: {required: false, type: integer, min: 0}
      srs_cyclic_shift: {required: false, type: integer, min: 0}
      srs_resource_type: {required: false, type: string}
      csi_rs_row_index: {required: false, type: integer, min: 1}
      csi_rs_first_ofdm_symbol_in_time_domain: {required: false, type: integer, min: 0}
      csi_rs_sequence_id: {required: false, type: integer, min: 0}
      dmrs_scrambling_id_source: {required: false, type: string}
      dmrs_scrambling_id: {required: false, type: integer, min: 0}
      dmrs_port_to_layer_mapping: {required: false, type: string}
      rsla_strict: {required: false, type: struct}
  link_adaptation:
    parameters:
      olla_init_offset_db: {required: false, type: number}
      olla_max_offset_db: {required: false, type: number}
      olla_min_offset_db: {required: false, type: number}
      olla_window_size_slots: {required: false, type: integer, min: 1}
      olla_forgetting_factor: {required: false, type: number, min: 0}
      bootstrap_preview_backoff_db: {required: false, type: number, min: 0}
      bootstrap_min_cqi_for_scheduling: {required: false, type: integer, min: 1, max: 15}
      dl_bootstrap_min_cqi_for_scheduling: {required: false, type: integer, min: 1, max: 15}
      ul_bootstrap_min_cqi_for_scheduling: {required: false, type: integer, min: 1, max: 15}
      ul_srs_to_pusch_sinr_backoff_db: {required: false, type: number, min: 0}
      ul_reference_signal_scheduling_backoff_db: {required: false, type: number, min: 0}
      mcs_backoff_dl_db: {required: false, type: number, min: 0}
      mcs_backoff_ul_db: {required: false, type: number, min: 0}
      sinr_to_cqi_mapping_table: {required: false, type: string}
      queue_aware_rank_mcs_reduction_enable: {required: false, type: boolean}
      queue_aware_layer_decrement_max: {required: false, type: integer, min: 0}
      queue_aware_mcs_decrement_max: {required: false, type: integer, min: 0}
      queue_aware_mcs_decrement_step1: {required: false, type: integer, min: 0}
      queue_aware_mcs_decrement_step2: {required: false, type: integer, min: 0}
      queue_aware_prb_delta1_fraction: {required: false, type: number, min: 0}
      queue_aware_prb_delta2_fraction: {required: false, type: number, min: 0}
  channels:
    parameters:
      cdl_delay_profile_scaling: {required: false, type: boolean}
      xpr_db: {required: false, type: number}
      antenna_element_spacing_dl_lambda: {required: false, type: number, min_exclusive: 0}
      antenna_element_spacing_ul_lambda: {required: false, type: number, min_exclusive: 0}
      spatial_filter_order: {required: false, type: integer, min: 1}
      channel_filter_length_samples: {required: false, type: integer, min: 1}
      perfect_csi: {required: false, type: boolean}
  harq:
    parameters:
      cbg_nrof_code_block_groups: {required: false, type: integer, min: 1}
      dl_harq_ack_codebook_type: {required: false, type: string}
      harq_process_ndi_initialization: {required: false, type: string}
  impairments:
    parameters:
      clipping_ratio_db: {required: false, type: number, min: 0}
      oob_emission_limit_dBr: {required: false, type: number}
      rx_spur_level_dBc: {required: false, type: number}
      local_oscillator_leakage_dBc: {required: false, type: number}
  validation:
    required: false
    parameters:
      RunClass:
        required: false
        type: string
        allowed_values: [fixed_lls_anchor, adaptive_system_diagnostic, hybrid_validation, fixed_snr_sweep_lls, ue_placement_geometry_lls]
      run_class:
        required: false
        type: string
        allowed_values: [fixed_lls_anchor, adaptive_system_diagnostic, hybrid_validation, fixed_snr_sweep_lls, ue_placement_geometry_lls]
      publication_mode: {required: false, type: string}
      required_artifact_audit: {required: false, type: boolean}
      fixed_snr_sweep_required: {required: false, type: boolean}
      geometry_evidence_required: {required: false, type: boolean}
      strict_after_run_artifact_audit: {required: false, type: boolean}
      fixed_link_campaign: {required: false, type: struct, nested_rule: validation_fixed_link_campaign}
nested_sections:
  validation_fixed_link_campaign:
    parameters:
      enabled: {required: false, type: boolean}
      direction:
        required: false
        type: string
        allowed_values: [DL, UL, both, dl, ul]
      channel_model:
        required: false
        type: string
        allowed_values: [AWGN, TDL, CDL, awgn, tdl, cdl]
      snr_db: {required: false, type: number_list}
      mcs: {required: false, type: number_list, integer: true}
      rank: {required: false, type: integer, min: 1}
      layers: {required: false, type: integer, min: 1}
      n_prb: {required: false, type: integer, min: 1}
      min_tb_per_point: {required: false, type: integer, min: 1}
      max_tb_per_point: {required: false, type: integer, min: 1}
      min_errors_for_ci: {required: false, type: integer, min: 0}
      max_ci_half_width: {required: false, type: number, min: 0}
      confidence_level: {required: false, type: number, min_exclusive: 0, max: 1}
      trials_per_drop: {required: false, type: integer, min: 1}
      disable_auxiliary_signals: {required: false, type: boolean}
      enable_ptrs: {required: false, type: boolean}
      fixed_reference_mode: {required: false, type: boolean}
      noise_operating_mode:
        required: false
        type: string
        allowed_values: [standalone_awgn_snr_argument]
      pdsch_execution_profile:
        required: false
        type: string
        allowed_values: [phy_calibration]
      link_adaptation_mode:
        required: false
        type: string
        allowed_values: [fixed]
      harq_enabled: {required: false, type: boolean}
      single_user_mode: {required: false, type: boolean}
      configuration_authority:
        required: false
        type: string
        allowed_values: [master_yaml]
      seeds: {required: false, type: number_list, integer: true}
      target_bler: {required: false, type: number_list, min_items: 1}
