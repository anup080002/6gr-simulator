version: 1
ui_groups:
  PHY_L1:
    sections:
      Carrier_Numerology_Grid:
        feature_family: Carrier_Numerology_Grid
        include_prefixes: [frequency., frame., frame_timing., bandwidth_operation., global_radio_scope.]
        shared_dependency: true
      Synchronization_SSB_PBCH:
        feature_family: Synchronization_SSB_PBCH
        include_prefixes: [signals_and_channels_common.ssb., signals_and_channels_common.pss., signals_and_channels_common.sss., signals_and_channels_common.pbch., signals_and_channels_common.pbch_dmrs., reference_signals.pbch, pbch., ssb.]
        shared_dependency: false
      Common_Signals_Channels:
        feature_family: Common_Signals_Channels
        include_prefixes: [signals_and_channels_common.sib1_related_pdcch., signals_and_channels_common.sib1_related_pdsch., signals_and_channels_common.paging_related_resources., signals_and_channels_common.]
        shared_dependency: false
      DL_Control_PDCCH_DCI:
        feature_family: DL_Control_PDCCH_DCI
        include_prefixes: [pdcch., control.]
        shared_dependency: false
      DL_Data_PDSCH:
        feature_family: DL_Data_PDSCH
        include_prefixes: [pdsch., pdsch6gr., channel_coding.]
        shared_dependency: false
      UL_Data_PUSCH:
        feature_family: UL_Data_PUSCH
        include_prefixes: [pusch.]
        shared_dependency: false
      UL_Control_PUCCH:
        feature_family: UL_Control_PUCCH
        include_prefixes: [pucch.]
        shared_dependency: false
      Random_Access_PRACH:
        feature_family: Random_Access_PRACH
        include_prefixes: [random_access., prach.]
        shared_dependency: false
        show_when:
          any: [random_access.enabled]
        dependencies:
          shared_sections: [Carrier_Numerology_Grid, Channel_Propagation]
          shared_paths: [frequency.center_frequency_hz, frequency.bandwidth_hz, frequency.duplex_mode, frequency.n_size_grid, frame.scs_khz, frame.cp_type]
        hide_prefixes: [pdcch., pucch., pusch., pdsch., reference_signals.nzp_csi_rs., reference_signals.trs., reference_signals.ptrs., csi_acquisition_and_reporting.]
      Reference_Signals_CSI_RS:
        feature_family: Reference_Signals_CSI_RS
        include_prefixes: [reference_signals.nzp_csi_rs., reference_signals.zp_csi_rs., reference_signals.csi]
        shared_dependency: false
      Reference_Signals_SRS:
        feature_family: Reference_Signals_SRS
        include_prefixes: [reference_signals.srs.]
        shared_dependency: false
      Reference_Signals_TRS_PTRS:
        feature_family: Reference_Signals_TRS_PTRS
        include_prefixes: [reference_signals.trs., reference_signals.tracking_rs., reference_signals.ptrs.]
        shared_dependency: false
      Reference_Signals_Common:
        feature_family: Reference_Signals_Common
        include_prefixes: [reference_signals.self_interference_rs., reference_signals.custom_rs., reference_signals.]
        shared_dependency: false
      DMRS:
        feature_family: DMRS
        include_prefixes: [reference_signals.pdsch_dmrs., reference_signals.pusch_dmrs., reference_signals.pdcch_dmrs.]
        shared_dependency: false
      Link_Adaptation_CQI_PMI_RI_MCS:
        feature_family: Link_Adaptation_CQI_PMI_RI_MCS
        include_prefixes: [link_adaptation., csi_acquisition_and_reporting.]
        shared_dependency: false
      MIMO_Beamforming:
        feature_family: MIMO_Beamforming
        include_prefixes: [mimo., mimo_and_beam_management., antenna_and_array.]
        shared_dependency: false
      RF_Impairments:
        feature_family: RF_Impairments
        include_prefixes: [impairments., power_and_rf_frontend.]
        shared_dependency: false
      Channel_Propagation:
        feature_family: Channel_Propagation
        include_prefixes: [channels., channel_model., interference.]
        shared_dependency: false
      Channel_Coding:
        feature_family: Channel_Coding
        include_prefixes: [channel_coding., coding.]
        shared_dependency: false
      Modulation_Mapping:
        feature_family: Modulation_Mapping
        include_prefixes: [modulation_and_mapping., modulation.]
        shared_dependency: false
      Receiver_Algorithms:
        feature_family: Receiver_Algorithms
        include_prefixes: [receiver_algorithms., receiver.]
        shared_dependency: false
      Synchronization_Tracking:
        feature_family: Synchronization_Tracking
        include_prefixes: [synchronization_and_tracking.]
        shared_dependency: false
      Waveform_Processing:
        feature_family: Waveform_Processing
        include_prefixes: [waveform., processing_chains.]
        shared_dependency: false
  MAC:
