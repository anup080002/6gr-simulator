kind: scenario
top_level_order:
  - inherits
  - meta
  - scenario
  - simulation
  - frequency
  - frame
  - waveform
  - channels
  - reference_signals
  - mimo
  - users
  - coding
  - modulation
  - control
  - pdsch6gr
  - research_ul
  - research_dl
  - research_link
  - lab_waveform
  - research_spatial
  - research_receiver
  - research_harq
  - research_awgn_mimo
  - research_pusch_uci
  - research_adaptation
  - harq
  - random_access
  - impairments
  - ai_ml
  - energy_efficiency
  - kpis
  - logging
  - output
sections:
  meta:
    required: true
    parameters:
      scenario_id: {required: true, type: string, nonempty: true}
      description: {required: true, type: string, nonempty: true}
      version: {required: true, type: string, nonempty: true}
      schema_version: {required: false, type: string}
      schemaVersion: {required: false, type: string}
      owner: {required: true, type: string, nonempty: true}
      research_class:
        required: false
        type: string
        allowed_values:
          - baseline_benchmark
          - agreed_starting_point
          - study_item_candidate
          - optional_research_experiment
      maturity_tag:
        required: true
        type: string
        allowed_values: [baseline, smoke, regression, stress, experimental, lab]
      scenario_group: {required: false, type: string}
      tags: {required: false, type: string_list}
  scenario:
    required: true
    parameters:
      name:
        required: false
        type: string
      description:
        required: false
        type: string
      honesty_mode:
        required: false
        type: string
        allowed_values: [strict]
      unsupported_output_policy:
        required: false
        type: string
        allowed_values: [blank_unmeasured_values, show_unavailable_with_reason]
      provenance_logging:
        required: false
        type: boolean
      runner_profile:
        required: true
        type: string
        allowed_values: [waveform_bundle, research_tdd_link, lab_waveform_campaign, system_level_lls, full_stack_qualification, pdcch_blind_decode_sweep, pdcch_strict_validation, trs_strict_validation, srs_strict_validation, channel_rf_strict_validation, prach_detection, prach_strict_validation, random_access_four_step, ctrl6gr_pdcch_study, pdsch6gr_truth_study, generic_sweep, ai_benchmark]
      scale_profile:
        required: false
        type: string
      study_mode:
        required: false
        type: string
        allowed_values: [smoke, debug, baseline, campaign, publication, runner_smoke]
      target_cases:
        required: true
        type: string_list
        min_items: 1
        allowed_values: [bundle, dl, ul, pdsch, pusch, pdcch, pucch, pbch, ssb, prach, csi_rs, srs, dmrs, trs, harq, channel_rf]
      bundle_anchor_cases:
        required: false
        type: string_list
        min_items: 1
        allowed_values:
          - cell_search_mib_sib1
          - pdcch_strict_validation
          - trs_strict_validation
          - srs_strict_validation
          - channel_rf_strict_validation
          - prach_detection
          - prach_strict_validation
          - random_access_four_step
          - dl_pdsch_throughput
          - ul_pusch_throughput
          - ul_srs_channelest
          - ul_lowpapr
      notes: {required: true, type: string}
      bs: {required: false, type: struct, nested_rule: scenario_bs}
      geometry: {required: false, type: struct, nested_rule: scenario_geometry}
      sectorization: {required: false, type: struct, nested_rule: scenario_sectorization}
      sweep: {required: false, type: struct}
      ai_benchmark: {required: false, type: struct}
      expected_outputs: {required: false, type: string_list}
  simulation:
    required: true
    parameters:
      link_direction:
        required: true
        type: string
        allowed_values: [dl, ul, both]
      n_frames: {required: true, type: integer, min: 1}
      n_slots: {required: true, type: integer, min: 1}
      n_subframes: {required: true, type: integer, min: 1}
      monte_carlo_iterations: {required: true, type: integer, min: 1}
      random_seed: {required: true, type: integer, min: 0}
      deterministic_mode: {required: true, type: boolean}
      snr_db: {required: true, type: number}
      awgn_reference_re_energy: {required: false, type: number, min_exclusive: 0}
      noise_operating_mode:
        required: false
        type: string
        allowed_values: [receiver_noise_figure_thermal_noise]
      min_duration_s: {required: true, type: number, min_exclusive: 0}
      snr_sweep_offsets_db: {required: true, type: number_list, min_items: 0}
      reference_sweep_enabled: {required: true, type: boolean}
      reference_trials_per_snr: {required: true, type: integer, min: 0}
      harq_diagnostics_enabled: {required: true, type: boolean}
      adaptive_sweep_enabled: {required: true, type: boolean}
      adaptive_sweep_step_db: {required: true, type: number, min_exclusive: 0}
      adaptive_sweep_max_points: {required: true, type: integer, min: 0}
      max_raw_rows_per_sweep: {required: true, type: integer, min: 0}
  frequency:
    required: true
    parameters:
      range_name:
        required: true
        type: string
        allowed_values: [FR1, FR2-1, FR2-2, FR3]
      center_frequency_hz: {required: true, type: number, min_exclusive: 0}
      dl_center_frequency_hz: {required: false, type: number, min_exclusive: 0}
      ul_center_frequency_hz: {required: false, type: number, min_exclusive: 0}
      bandwidth_hz: {required: true, type: number, min_exclusive: 0}
      duplex_mode:
        required: true
        type: string
        allowed_values: [FDD, TDD]
      carrier_count: {required: true, type: integer, min: 1}
      carrier_aggregation_enabled: {required: true, type: boolean}
      band_name:
        required: true
        type: string
        nonempty: true
      bandwidth_options_hz: {required: true, type: number_list, min_items: 1}
      numerology_options_khz:
        required: true
        type: number_list
        min_items: 1
        allowed_numeric_values: [15, 30, 60, 120, 240, 480, 960]
      max_mimo_size: {required: true, type: integer, min: 1}
      max_supported_center_frequency_hz: {required: false, type: number, min_exclusive: 0}
      custom_frequency_override_allowed: {required: false, type: boolean}
      research_mode: {required: false, type: boolean}
      minimum_low_guardband_hz: {required: false, type: number, min: 0}
      minimum_high_guardband_hz: {required: false, type: number, min: 0}
      mobility_defaults_kmph: {required: true, type: number, min: 0}
      channel_model_defaults: {required: true, type: string}
      reference_signal_defaults: {required: true, type: string}
      power_model_defaults: {required: true, type: string}
      energy_model_defaults: {required: true, type: string}
      rf_impairment_defaults: {required: true, type: string}
      n_size_grid: {required: true, type: integer, min: 1}
  frame:
    required: true
    parameters:
      scs_khz:
        required: true
        type: number
        allowed_numeric_values: [15, 30, 60, 120, 240, 480, 960]
      cp_type:
        required: true
        type: string
        allowed_values: [normal, extended]
      slot_format:
        required: true
        type: string
        allowed_values: [dl, ul, flexible, mixed, fdd_separate_carriers]
      tdd_common: {required: false, type: struct}
      tdd_dedicated: {required: false, type: struct_array}
  waveform:
    required: true
    parameters:
      dl_waveform:
        required: true
        type: string
        allowed_values: [CP-OFDM, DFT-s-OFDM]
      ul_waveform:
        required: true
        type: string
        allowed_values: [CP-OFDM, DFT-s-OFDM]
      fft_size: {required: true, type: integer, min: 64}
      sample_rate_hz: {required: true, type: number, min_exclusive: 0}
      explicit_fft_size: {required: false, type: integer, min: 64}
      explicit_sample_rate_hz: {required: false, type: number, min_exclusive: 0}
      windowing_samples: {required: false, type: integer, min: 0}
      windowing_enabled: {required: true, type: boolean}
      transform_precoding_enabled: {required: true, type: boolean}
      experimental_dl_dfts_ofdm_enabled: {required: false, type: boolean}
      ul_layer_support_mode:
        required: false
        type: string
        allowed_values: [all_supported_layers, single_layer_baseline, multi_layer_candidate]
      low_papr_mode:
        required: false
        type: string
        allowed_values: [none, tone_reservation, frequency_domain_truncation, candidate_enhanced]
      tone_reservation_enabled: {required: false, type: boolean}
      frequency_domain_truncation_enabled: {required: false, type: boolean}
      flexible_dft_size_enabled: {required: false, type: boolean}
      noncontiguous_mapping_enabled: {required: false, type: boolean}
      dmrs_data_multiplexing_mode:
        required: false
        type: string
        allowed_values: [baseline, enhanced_candidate]
      ue_coherence_mode:
        required: false
        type: string
        allowed_values: [coherent, partially_coherent]
      ue_power_limited: {required: false, type: boolean}
  channels:
    required: true
    parameters:
      model_type:
        required: true
        type: string
        allowed_values: [AWGN, TDL, CDL]
      profile:
        required: true
        type: string
        allowed_values: [AWGN, TDL-A, TDL-B, TDL-C, TDL-D, TDL-E, CDL-A, CDL-B, CDL-C, CDL-D, CDL-E]
      delay_spread_ns: {required: true, type: number, min: 0}
      doppler_hz: {required: true, type: number, min: 0}
      per_sample_fading_enabled: {required: false, type: boolean}
      shared_identity_awgn_enabled: {required: false, type: boolean}
      awgn_spatial_matrix_dl_real: {required: false, type: number_list, min_items: 1}
      awgn_spatial_matrix_dl_imag: {required: false, type: number_list, min_items: 1}
      doppler_source_mode: {required: false, type: string, allowed_values: [configured, derive_from_ue_speed]}
      mobility_kmph: {required: true, type: number, min: 0}
      los_enabled: {required: true, type: boolean}
      spatial_consistency_enabled: {required: true, type: boolean}
      pathloss_enabled: {required: true, type: boolean}
      shadow_fading_enabled: {required: true, type: boolean}
      pathloss_model:
        required: true
        type: string
        allowed_values: [nrPathLoss, freeSpace, none]
      shadow_fading_std_db: {required: true, type: number, min: 0}
      runtime_element_expansion_chunk_samples: {required: false, type: integer, min: 1}
      phase10_strict: {required: false, type: struct}
  reference_signals:
    required: true
    parameters:
      ssb_enabled: {required: true, type: boolean}
      ssb_case:
        required: true
        type: string
        allowed_values: ["Case A", "Case B", "Case C", "Case D", "Case E", "Case F", "Case G"]
      ssb_scs_khz:
        required: true
        type: number
        allowed_numeric_values: [15, 30, 120, 240, 480, 960]
      ssb_lmax:
        required: true
        type: integer
        allowed_numeric_values: [4, 8, 64]
      pbch_enabled: {required: true, type: boolean}
      pdcch_dmrs_enabled: {required: true, type: boolean}
      pdsch_dmrs_ports: {required: true, type: integer, min: 1}
      pusch_dmrs_ports: {required: true, type: integer, min: 1}
      pusch_dmrs_num_cdm_groups_without_data: {required: false, type: integer, min: 1, max: 3}
      csi_rs_enabled: {required: true, type: boolean}
      csi_rs_runtime_channel_estimator: {required: false, type: string, allowed_values: [nr_channel_estimate, flat_static_awgn_ls]}
      csi_rs_scrambling_id: {required: false, type: integer, min: 0}
      csirs_scrambling_id: {required: false, type: integer, min: 0}
      csi_im: {required: false, type: struct, nested_rule: csi_im_resource}
      srs_enabled: {required: true, type: boolean}
      trs_enabled: {required: true, type: boolean}
      tracking_rs_enabled: {required: false, type: boolean}
      ptrs_enabled: {required: true, type: boolean}
      ptrs_cpe_correction_enabled: {required: true, type: boolean}
      ptrs_port_association_policy:
        required: false
        type: string
        allowed_values: [configured_absolute_port, first_scheduled_dmrs_port]
      ptrs_time_density:
        required: false
        type: integer
        allowed_numeric_values: [1, 2, 4, 8]
      ptrs_frequency_density:
        required: false
        type: integer
        allowed_numeric_values: [2, 4]
      ptrs_re_offset:
        required: false
        type: string
        allowed_values: ['00', '01', '10', '11']
      csi_reporting_enabled: {required: false, type: boolean}
      csi_feedback_mode:
        required: true
        type: string
        allowed_values: [none, CQI, PMI, RI, CRI, PMI+CQI, PMI+CQI+RI, PMI+CQI+RI+CRI]
      csi_acquisition_mode:
        required: false
        type: string
        allowed_values: [dl_based, ul_based, joint_dl_ul]
      operation_orientation:
        required: false
        type: string
        allowed_values: [tdd_reciprocity, fdd_feedback]
      dmrs_csi_tracking_enabled: {required: false, type: boolean}
      srs_ports:
        required: false
        type: integer
        allowed_numeric_values: [1, 2, 3, 4, 8]
      srs_sequence_family:
        required: false
        type: string
        allowed_values: [baseline_nr, low_papr_candidate, low_correlation_candidate]
      srs_periodicity_ms:
        required: false
        type: number
        allowed_numeric_values: [5, 10, 20, 40, 80, 160]
      srs_periodicity_slots:
        required: false
        type: integer
        min: 1
      trs_periodicity_slots:
        required: false
        type: integer
        min: 1
      csi_rs_periodicity_slots:
        required: false
        type: integer
        min: 1
      csi_rs_offset_slots:
        required: false
        type: integer
        min: 0
      srs_max_ues_per_slot:
        required: false
        type: integer
        min: 1
      srs_scheduling_policy:
        required: false
        type: string
        allowed_values: [round_robin_phase, multiplex_due_users]
      channel_estimation_mode:
        required: false
        type: string
        allowed_values: [realistic_baseline, dmrs_tracking_candidate, ai_assisted_candidate]
      receiver_example:
        required: false
        type: string
        allowed_values: [mmse_irc, rml]
      sgcs_reporting_enabled: {required: false, type: boolean}
      nmse_reporting_enabled: {required: false, type: boolean}
      cqi_reporting_enabled: {required: true, type: boolean}
      pmi_reporting_enabled: {required: true, type: boolean}
      ri_reporting_enabled: {required: true, type: boolean}
      cri_reporting_enabled: {required: false, type: boolean}
      pmi_codebook_mode:
        required: false
        type: string
        allowed_values: [type1_su_mimo, type2_mu_mimo, etype2_candidate, noncodebook]
      channel_state_information_mode:
        required: false
        type: string
        allowed_values: [none, CQI, PMI, RI, CRI, PMI+CQI, PMI+CQI+RI, PMI+CQI+RI+CRI]
      pdsch_dmrs_config_type:
        required: true
        type: integer
        allowed_numeric_values: [1, 2]
      pdsch_dmrs_type_a_position:
        required: true
        type: integer
        allowed_numeric_values: [2, 3]
      pdsch_dmrs_additional_positions:
        required: false
        type: integer
        allowed_numeric_values: [0, 1, 2, 3]
      pdsch_dmrs_max_length:
        required: false
        type: integer
        allowed_numeric_values: [1, 2]
      pdsch_dmrs_num_cdm_groups_without_data:
        required: true
        type: integer
        allowed_numeric_values: [1, 2, 3]
      pusch_dmrs_config_type:
        required: false
        type: integer
        allowed_numeric_values: [1, 2]
      pusch_dmrs_type_a_position:
        required: false
        type: integer
        allowed_numeric_values: [2, 3]
      pusch_dmrs_additional_positions:
        required: false
        type: integer
        allowed_numeric_values: [0, 1, 2, 3]
      pusch_dmrs_max_length:
        required: false
        type: integer
        allowed_numeric_values: [1, 2]
  mimo:
    required: true
    parameters:
      n_tx_ant: {required: true, type: integer, min: 1}
      n_rx_ant: {required: true, type: integer, min: 1}
      n_layers: {required: true, type: integer, min: 1}
      precoder_type:
        required: true
        type: string
        allowed_values: [none, wideband, subband]
      codebook_type:
        required: true
        type: string
        allowed_values: [type1, type2, etype2, noncodebook]
      mu_mimo_enable:
        required: false
        type: boolean
      ul_mu_mimo_enable:
        required: false
        type: boolean
      mu_mimo_max_users_per_prb:
        required: false
        type: integer
        min: 2
      mu_mimo_precoder_leakage_threshold_db:
        required: false
        type: number
        max: 0
      mu_mimo_minimum_desired_subspace_gain_db:
        required: false
        type: number
        max: 0
      mu_mimo_hybrid_rf_design_policy:
        required: false
        type: string
        allowed_values: [fixed_configured_matrix, measured_srs_phase_only_subarray]
      mu_mimo_spatial_signature_mode:
        required: false
        type: string
        allowed_values: [dominant_scheduled_rank, complete_detectable_subspace]
      ul_mu_mimo_receive_processing_mode:
        required: false
        type: string
        allowed_values: [full_dimensional_per_re_irc]
        description: Preserve all received antenna branches and perform interference rejection per resource element using measured channel and covariance evidence.
      mu_mimo_spatial_subspace_noise_margin_db:
        required: false
        type: number
        min: 0
        max: 60
        units: dB
        description: Receiver-noise margin for detecting complete frequency-selective SRS spatial subspaces.
      mu_mimo_phase_only_projection_max_iterations:
        required: false
        type: integer
        min: 1
      mu_mimo_phase_only_projection_tolerance:
        required: false
        type: number
        min_exclusive: 0
        max_exclusive: 1
      reciprocity_mode:
        required: true
        type: string
        allowed_values: [FDD, TDD]
      beam_sweep_enabled: {required: true, type: boolean}
      beam_count: {required: true, type: integer, min: 1}
      mtrp_ready: {required: true, type: boolean}
      multi_panel_ready: {required: true, type: boolean}
      panel_count: {required: true, type: integer, min: 1}
      trp_count:
        required: false
        type: integer
        min: 1
      precoding_granularity:
        required: false
        type: string
        allowed_values: [prg_wideband]
      phase07_strict:
        required: false
        type: struct
        nested_rule: mimo_phase07_strict
      qcl_tci:
        required: false
        type: struct
        nested_rule: mimo_qcl_tci
  users:
    required: false
    parameters:
      enabled: {required: true, type: boolean}
      n_users: {required: true, type: integer, min: 1}
      rnti_start: {required: true, type: integer, min: 1}
      seed_stride: {required: true, type: integer, min: 1}
      execution_model:
        required: true
        type: string
        allowed_values: [independent_link_sweep, slot_coupled_truth]
      beam_selection_strategy:
        required: true
        type: string
        allowed_values: [fixed_first_beam, round_robin_codebook, runtime_best_beam_per_link]
      save_user_tables: {required: true, type: boolean}
  coding:
    required: true
    parameters:
      data_code_type:
        required: true
        type: string
        allowed_values: [LDPC]
      control_code_type:
        required: true
        type: string
        allowed_values: [Polar]
      tb_crc_type:
        required: true
        type: string
        allowed_values: [16, 24A, 24B]
      cb_crc_type:
        required: true
        type: string
        allowed_values: [16, 24A, 24B]
      base_graph:
        required: true
        type: integer
        allowed_numeric_values: [1, 2]
      max_decoder_iterations: {required: true, type: integer, min: 1}
      csi_code_type:
        required: false
        type: string
        allowed_values: [Polar, LDPC, none]
      candidate_base_graph_mode:
        required: false
        type: string
        allowed_values: [nr_like_bg, sixg_candidate_bg]
      outer_code_enabled: {required: false, type: boolean}
      outer_code_type:
        required: false
        type: string
        allowed_values: [none, inter_cb, outer_packet, parity_cb]
      retransmission_granularity:
        required: false
        type: string
        allowed_values: [tb, cbg, parity_cb, packet_level]
      nuc_mode:
        required: false
        type: string
        allowed_values: [none, nuc, 2d_nuc]
      mixed_modulation_enabled: {required: false, type: boolean}
      dcm_enabled: {required: false, type: boolean}
      joint_coding_modulation_mode:
        required: false
        type: string
        allowed_values: [none, joint_coding_modulation, mgcm, dbicm, tb_dbicm]
      distribution_matching_mode:
        required: false
        type: string
        allowed_values: [none, ccdm, mpdm, ess, ecc_dm, arithmetic_variant]
      distribution_matching_before_coding: {required: false, type: boolean}
      shaping_retransmission_mode:
        required: false
        type: string
        allowed_values: [repeat_original, redraw_distribution, study_dimension]
      packet_level_coding_enabled: {required: false, type: boolean}
  modulation:
    required: true
    parameters:
      dl_modulation_order:
        required: true
        type: integer
        allowed_numeric_values: [1, 2, 4, 6, 8, 10, 12]
      ul_modulation_order:
        required: true
        type: integer
        allowed_numeric_values: [1, 2, 4, 6, 8, 10, 12]
      pi2_bpsk_enabled: {required: true, type: boolean}
      constellation_shaping_enabled: {required: true, type: boolean}
      mcs_table:
        required: true
        type: string
        allowed_values: [qam64_table1, qam256_table2, qam64LowSE_table3]
      # Defined-rate qam64 tables include row 28; table-specific validity is
      # checked after inheritance. Reserved retransmission rows are not a
      # valid configured initial operating point.
      dl_mcs_index: {required: true, type: integer, min: 0, max: 28}
      ul_mcs_index: {required: true, type: integer, min: 0, max: 28}
  research_ul:
    required: false
    parameters: &research_shared_channel_parameters
      enabled: {required: true, type: boolean}
      modulation: {required: true, type: string, allowed_values: [QPSK, 16QAM, 64QAM, 256QAM, 1024QAM]}
      target_code_rate: {required: true, type: number, min_exclusive: 0, max: 1}
      num_layers: {required: true, type: integer, min: 1, max: 4}
      prb_start: {required: true, type: integer, min: 0}
      num_prbs: {required: true, type: integer, min: 1, max: 275}
      symbol_allocation: {required: true, type: number_list}
      mapping_type: {required: true, type: string, allowed_values: [A, B]}
      rnti: {required: true, type: integer, min: 0, max: 65535}
      nid: {required: true, type: integer, min: 0, max: 1023}
      transform_precoding: {required: true, type: boolean}
      uci_enabled: {required: true, type: boolean}
      harq_enabled: {required: true, type: boolean}
      precoding: {required: true, type: string, allowed_values: [identity_unit_total_power]}
      dmrs_configuration_type: {required: true, type: integer, min: 1, max: 2}
      dmrs_length: {required: true, type: integer, min: 1, max: 2}
      dmrs_type_a_position: {required: true, type: integer, min: 2, max: 3}
      dmrs_additional_position: {required: true, type: integer, min: 0, max: 3}
      dmrs_cdm_groups_without_data: {required: true, type: integer, min: 1, max: 3}
      dmrs_port_set: {required: true, type: number_list}
      dmrs_identity: {required: true, type: integer, min: 0, max: 65535}
      dmrs_n_scid: {required: true, type: integer, min: 0, max: 1}
