# Status/export regression: physical failing DL/UL trials, not a detector campaign.
inherits:
  - ../scenarios/lls_100mhz_tdlc_bidirectional_truth.yaml
meta:
  scenario_id: lls_status_propagation_failure
  description: Bounded physical status-propagation regression
  version: "1"
  owner: test
  maturity_tag: smoke
scenario:
  # Retain ordinary PRACH reception in the bundle, but do not request the
  # separate multi-thousand-trial PRACH qualification component anchor.
  target_cases: [bundle, dl, ul, pdsch, pusch, pdcch, pucch, pbch, ssb, csi_rs, srs, dmrs, harq]
simulation:
  n_frames: 1
  n_slots: 4
  monte_carlo_iterations: 2
  random_seed: 11
  snr_db: -10
  snr_sweep_offsets_db: [0]
run_control:
  num_workers: 1
  auto_start_parallel_pool: false
  total_slots: 4
  warmup_slots: 0
  measurement_slots: 4
  total_time_ms: 2
  warmup_time_ms: 0
  measurement_time_ms: 2
sweeps_and_matrix:
  snr_sweep:
    enabled: false
    values_db: [-10]
modulation:
  mcs_table: qam256_table2
  dl_modulation_order: 8
  ul_modulation_order: 8
  dl_mcs_index: 27
  ul_mcs_index: 27
link_adaptation:
  fixed_or_amc: fixed
  pdsch_link_adaptation_policy: fixed
  pusch_link_adaptation_policy: fixed
output:
  save_figures: false
  save_png: false
  save_mat: true
  phy_signal_diagnostic_enabled: false
