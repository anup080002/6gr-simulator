inherits: dut_base.yaml
dut:
  id: dmrs_dut
  title: PDSCH/PUSCH/PDCCH DMRS DUT
  block: dmrs
  direction: DL_UL
  target_cases: [dmrs, dl, ul]
  tx_chain: [dmrs_sequence_generation, dmrs_port_mapping, dmrs_resource_mapping]
  rx_chain: [dmrs_extraction, channel_estimate, interpolation]
  config_paths:
    - reference_signals.pdsch_dmrs
    - reference_signals.pusch_dmrs
    - reference_signals.pdcch_dmrs
    - canonical_control.reference_signals.pdsch_dmrs_ports
    - canonical_control.reference_signals.pusch_dmrs_ports
  runtime_overrides:
    - path: scenario.target_cases
      value: [dmrs, dl, ul]
    - path: reference_signals.pdcch_dmrs_enabled
      value: true
