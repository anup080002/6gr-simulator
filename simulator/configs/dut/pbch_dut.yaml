inherits: dut_base.yaml
dut:
  id: pbch_dut
  title: PBCH and PBCH-DMRS DUT
  block: pbch
  direction: DL
  target_cases: [pbch]
  tx_chain: [pbch_encode, pbch_dmrs_tx, ssb_grid_mapping, ofdm_modulation]
  rx_chain: [pbch_channel_estimate, pbch_demod, mib_decode]
  config_paths:
    - canonical_control.reference_signals.pbch_enabled
    - signals_and_channels_common.pbch
    - signals_and_channels_common.pbch_dmrs
    - reference_signals.pbch_dmrs
  runtime_overrides:
    - path: scenario.target_cases
      value: [pbch]
    - path: reference_signals.pbch_enabled
      value: true
