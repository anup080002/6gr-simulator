inherits:
  - ./c4_20_4ghz_tdd.yaml

# TS 38.104 Table 5.3.2-1: 20 MHz / 30 kHz uses 51 PRBs.
# Retain the requested nominal 4 GHz baseband study center. This fragment
# does not assert RF channel/synchronization-raster conformance.
frequency:
  band_name: n77

bwp:
  component_carriers:
    - cc_id: 0
      serving_cell_id: 1
      scheduling_cc_ids: [0]
      center_frequency_hz: 4000000000
      band: n77
      frequency_range: FR1
      channel_bandwidth_mhz: 20
      duplex_mode: TDD
      dl_carrier_grid: {n_start_grid: 0, n_size_grid: 51, scs_khz: 30}
      ul_carrier_grid: {n_start_grid: 0, n_size_grid: 51, scs_khz: 30}
      carrier_indicator_map:
        - {indicator: 0, scheduled_cc_id: 0}
