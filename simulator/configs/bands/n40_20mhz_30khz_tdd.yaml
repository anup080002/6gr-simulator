inherits:
  - ./n77_20mhz_30khz_tdd.yaml

# TS 38.104 V18.8.0 Tables 5.3.2-1 and 5.4.3.3-1:
# n40, 20 MHz / 30 kHz -> 51 PRBs; SS/PBCH uses 30 kHz Case C.
# NR-ARFCN 470000 -> 2350 MHz. Point A = 2340.820 MHz.
# SSREF = Point A + (12*30+2)*15 kHz + 120*30 kHz = 2349.850 MHz.
# GSCN = 3*1958+(5-3)/2 = 5875, within n40's 5762:5989 raster.
frequency:
  band_name: n40
  center_frequency_hz: 2350000000
global_radio_scope:
  carrier_frequency_hz: 2350000000
bwp:
  component_carriers:
    - cc_id: 0
      serving_cell_id: 1
      scheduling_cc_ids: [0]
      center_frequency_hz: 2350000000
      band: n40
      frequency_range: FR1
      channel_bandwidth_mhz: 20
      duplex_mode: TDD
      dl_carrier_grid: {n_start_grid: 0, n_size_grid: 51, scs_khz: 30}
      ul_carrier_grid: {n_start_grid: 0, n_size_grid: 51, scs_khz: 30}
      carrier_indicator_map:
        - {indicator: 0, scheduled_cc_id: 0}
reference_signals:
  ssb_case: Case C
  ssb_scs_khz: 30
  ssb_lmax: 8
  ssb_Lmax: 8
initial_access:
  band_context: n40
  spectrum: unpaired
  ssb:
    case: Case C
    scs_khz: 30
    lmax: 8
    positions_in_burst: '11110000'
    per_ssb_power_db: [0, 0, 0, 0, 0, 0, 0, 0]
    precoder_ids: [dft_ura_beam_0, dft_ura_beam_8, dft_ura_beam_16, dft_ura_beam_24, dft_ura_beam_32, dft_ura_beam_40, dft_ura_beam_48, dft_ura_beam_56]
    precoder_codebook:
      beam_indices: [0, 8, 16, 24, 32, 40, 48, 56]
    n_crb_ssb: 30
    k_ssb: 2
random_access:
  carrier_frequency_hz: 2350000000
  # Short-preamble B4 at 30 kHz is legal per TS 38.211 6.3.3.1-2.
  subcarrier_spacing_khz: 30
