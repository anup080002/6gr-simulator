channels:
  model_type: CDL
  profile: CDL-C
  # Exact persistent-object stream partitioning.  At 64 TXRU x 4 RX,
  # 4096 samples makes nrCDLChannel reserve hundreds of MB for each
  # path/ray tensor and forces paging.  512 changes neither channel state
  # nor samples; focused chunk-vs-whole tests require numerical equivalence.
  runtime_element_expansion_chunk_samples: 512
  delay_spread_ns: 100
  doppler_hz: 11.118803
  doppler_source_mode: configured
  mobility_kmph: 3
  los_enabled: false
  pathloss_enabled: false
  shadow_fading_enabled: false
  o2i_model: none
