# H4 physical array/RF-chain capability. Logical ports, beams and layers are
# intentionally distinct from physical elements and TXRUs.
mimo:
  n_tx_ant: 64
  n_rx_ant: 4
  n_layers: 1
  max_dl_layers: 4
  max_ul_layers: 4
  rank_adaptation_policy: measured_ri
  precoder_type: wideband
  codebook_type: type1
  reciprocity_mode: TDD
  beam_sweep_enabled: true
  beam_count: 8
  panel_count: 2
  phase07_strict:
    enabled: true
    profile_id: fr1_typeI_multi_panel_strict
    specification_profile: 3GPP_R18_MIMO_CSI_V1
    direction: DL
    codebook_type: typeI-MultiPanel
    ports: 8
    panels: 2
    n1: 2
    n2: 1
    o1: 4
    o2: 1
    max_rank: 4
    rank_domain: [1, 2, 4]
    receiver: MMSE
    precoder_prg_size_rbs: 273
    require_active_tci_state: true
    measurement_max_age_slots: 20
    covariance:
      min_samples: 4
      max_age_slots: 20
      shrinkage_factor: 0.05
      condition_number_limit: 1000000000000
    csi_report:
      report_config_id: h4-csi-report-0
      epoch: 0
      codebook_mode: 1
      report_quantity: cri-RI-PMI-CQI
      num_csi_resources: 8
      frequency_granularity: wideband
      uci_channel: PUCCH
      num_subbands: 1
      number_of_beams: 8
      phase_alphabet_size: 4
    ul_srs_authority:
      enabled: true
      max_age_slots: 10
      configured_override_forbidden: true

antenna_and_array:
  # Two panels; each panel is 4x4 spatial positions x H/V polarizations.
  bs_array_geometry: URA
  bs_array_rows: 4
  bs_array_columns: 4
  bs_panel_count: 2
  bs_num_antenna_elements: 64
  bs_num_txrus: 64
  bs_num_rxrus: 64
  # UE: 1x2 spatial positions x H/V polarizations, with all four element
  # dimensions connected to independent TX/RX RF chains.
  ue_array_geometry: URA
  ue_array_rows: 1
  ue_array_columns: 2
  ue_panel_count: 1
  ue_num_antenna_elements: 4
  ue_num_rxrus: 4
  ue_num_txrus: 4
  panels: 2
  panel_spacing: 0.5
  element_spacing_h: 0.5
  element_spacing_v: 0.5
  bs_element_spacing_horizontal_lambda: 0.5
  bs_element_spacing_vertical_lambda: 0.5
  ue_element_spacing_horizontal_lambda: 0.5
  ue_element_spacing_vertical_lambda: 0.5
  polarization: dual_pol
  bs_element_polarization_angles_deg: [0, 90]
  ue_element_polarization_angles_deg: [0, 90]
  bs_element_polarization_model: 2
  ue_element_polarization_model: 2
  bs_boresight_azimuth_deg: 0
  bs_boresight_elevation_deg: 0
  bs_boresight_slant_deg: 0
  ue_boresight_azimuth_deg: 180
  ue_boresight_elevation_deg: 0
  ue_boresight_slant_deg: 0
  bs_element_model: isotropic
  ue_element_model: isotropic
  bs_element_frequency_min_hz: 3900000000
  bs_element_frequency_max_hz: 4100000000
  ue_element_frequency_min_hz: 3900000000
  ue_element_frequency_max_hz: 4100000000
  bs_element_azimuth_hpbw_deg: 180
  bs_element_elevation_hpbw_deg: 180
  ue_element_azimuth_hpbw_deg: 180
  ue_element_elevation_hpbw_deg: 180
  bs_element_azimuth_sidelobe_attenuation_db: 30
  bs_element_elevation_sidelobe_attenuation_db: 30
  ue_element_azimuth_sidelobe_attenuation_db: 30
  ue_element_elevation_sidelobe_attenuation_db: 30
  bs_element_maximum_attenuation_db: 30
  ue_element_maximum_attenuation_db: 30
  bs_element_maximum_gain_dbi: 1
  ue_element_maximum_gain_dbi: 1
  require_element_pattern_in_channel: false
  require_spatial_dependency_contract: true
  cross_pol_ratio: 0
  calibration_model: ideal_calibrated
  mutual_coupling_model: none
  analog_beam_codebook: oversampled_dft_ura
  digital_precoder_family: wideband
  hybrid_beamforming_flag: true
  reciprocity_assumption: calibrated_tdd
  amplitude_phase_mismatch: none
  srs_power_imbalance_model: none

control:
  ul_precoding:
    num_ports: 4
    max_rank: 4
    codebook_subset: fullyAndPartialAndNonCoherent
    transmission_scheme: codebook

pdsch:
  layer_count: 1
  rank: 1
  num_antenna_ports: 8
  precoder_normalization_convention: unit_frobenius

pusch:
  layer_count: 1
  num_layers: 1
  num_antenna_ports: 4
  precoder_normalization_convention: unit_frobenius

reference_signals:
  pdsch_dmrs_ports: 4
  pdsch_dmrs:
    port_set: [0, 1, 2, 3]
  pusch_dmrs_ports: 4
  pusch_dmrs:
    port_set: [0, 1, 2, 3]
  srs_ports: 4
  srs:
    num_ports: 4
    port_set: [0, 1, 2, 3]
  csi_rs_ports: 8
  csi_rs_port_count: 8
