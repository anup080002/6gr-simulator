# Shared physical/logical four-port capability; rank is receiver-selected.
inherits:
  - ../control/connected_four_port_ul.yaml
  - research_identity_4x4.yaml
frequency:
  max_mimo_size: 4
mimo:
  n_tx_ant: 4
  n_rx_ant: 4
  # Capability ceiling only. The scenario keeps pdsch.layer_count=1 as its
  # bootstrap allocation and permits received CSI RI to select future ranks.
  max_dl_layers: 4
  phase07_strict:
    ports: 4
    n1: 2
    o1: 4
    max_rank: 4
    rank_domain: [1, 2, 3, 4]
antenna_and_array:
  bs_num_txrus: 4
  bs_num_rxrus: 4
  bs_num_antenna_elements: 4
  ue_num_txrus: 4
  ue_num_rxrus: 4
  ue_num_antenna_elements: 4
initial_access:
  ssb:
    precoder_codebook:
      physical_element_count: 4
reference_signals:
  pdsch_dmrs_ports: 4
  pdsch_dmrs:
    port_set: [0, 1, 2, 3]
  csi_rs_port_count: 4
  csi_rs_ports: 4
  csi_rs_resource_row_numbers: [4]
  csi_rs_precoder_codebook:
    physical_element_count: 4
    beam_indices_port_2: [2]
    beam_indices_port_3: [3]
csi_acquisition_and_reporting:
  report_configuration:
    n1: 2
    o1: 4
