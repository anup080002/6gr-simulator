# Explicit receiver-installed two-port FDD control and TDRA context.
# No noise, RF, carrier, traffic or execution-mode override belongs here.
pdsch:
  dmrs_nscid: 0
  time_domain_allocations:
    - [0, 2, 12, 0]
pusch:
  dmrs_nscid: 0
  time_domain_allocations:
    - [0, 0, 14, 1]
reference_signals:
  pdsch_dmrs_max_length: 1
  pusch_dmrs_config_type: 1
  pusch_dmrs_max_length: 1
  pusch_dmrs_num_cdm_groups_without_data: 2

control:
  # Absent-TCI PDSCH retains the scheduling CORESET's installed association.
  # This is not a decoded TCI command, a timing estimate or spatial reuse.
  coreset_qcl_association:
    configuration_epoch: 1
    serving_cell_index: 0
    component_carrier_index: 0
    bwp_id: 0
    coreset_id: 0
    activation_absolute_slot0: 0
    source_reference_signal: SSB
    source_reference_signal_id: 0
    qcl_types: [A]
    initialization_source: lls_preconfigured_higher_layer_context
  connected_monitoring:
    cce_reg_mapping: noninterleaved
    reg_bundle_size: 6
    interleaver_size: 0
    shift_index: 1
    precoder_granularity: sameAsREG-bundle
    start_symbol: 0
    period_slots: 1
    offset_slots: 0
    duration_slots: 1
    dmrs_scrambling_id: 1
  connected_dci:
    spec_release: Release-18
    spec_version: "18.8.0"
    configuration_epoch: 1
    serving_cell_index: 0
    component_carrier_index: 0
    search_space_id: 1
    coreset_id: 0
    rnti_type: C-RNTI
    frequency_allocation_type: type1_riv
    vrb_interleaving: false
    prb_bundling: staticBundling
    rate_match_pattern_group_count: 0
    aperiodic_zp_csirs_resource_set_count: 0
    harq_ack_codebook: dynamic
    supplementary_uplink: false
    cross_carrier_scheduling: false
    cbg_enabled: false
    csi_request_bits: 0
    beta_offsets: semiStatic
    tci_present: false
    additional_dci_features: []
  dl_reference_signaling:
    dmrs_configuration_type: 1
    dmrs_max_length: 1
    dmrs_type_enhanced: false
    two_tci_states: false
    max_codewords: 1
  ul_reference_signaling:
    srs_resource_count: 1
    dmrs_configuration_type: 1
    dmrs_max_length: 1
    dmrs_type_enhanced: false
    multipanel_sdm: false
  ul_precoding:
    num_ports: 2
    max_rank: 2
    codebook_subset: fullyAndPartialAndNonCoherent
    transmission_scheme: codebook
    full_power_mode: not_configured
