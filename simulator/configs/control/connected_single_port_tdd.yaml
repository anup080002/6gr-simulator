# Explicit installed control for the existing single-port/rank-one UL TDD
# path. No carrier, RF, noise, beam choice or execution-mode override.
# Connected configuration is declared higher-layer LLS initialization, not
# a claim that dedicated RRC or a TCI activation command was received.
control:
  connected_monitoring:
    cce_reg_mapping: noninterleaved
    reg_bundle_size: 6
    interleaver_size: 0
    shift_index: 1
    precoder_granularity: sameAsREG-bundle
    start_symbol: 0
    period_slots: 1
    offset_slots: 0
    duration_slots: 1
    dmrs_scrambling_id: 1
  connected_dci:
    spec_release: Release-18
    spec_version: "18.8.0"
    configuration_epoch: 1
    serving_cell_index: 0
    component_carrier_index: 0
    search_space_id: 1
    coreset_id: 0
    rnti_type: C-RNTI
    frequency_allocation_type: type1_riv
    vrb_interleaving: false
    prb_bundling: staticBundling
    rate_match_pattern_group_count: 0
    aperiodic_zp_csirs_resource_set_count: 0
    harq_ack_codebook: dynamic
    supplementary_uplink: false
    cross_carrier_scheduling: false
    cbg_enabled: false
    csi_request_bits: 0
    beta_offsets: semiStatic
    tci_present: false
    additional_dci_features: []
  # Absent-TCI data uses the configured scheduling CORESET association.
  # This does not force the selected access beam or supply received timing.
  coreset_qcl_association:
    configuration_epoch: 1
    serving_cell_index: 0
    component_carrier_index: 0
    bwp_id: 0
    coreset_id: 0
    activation_absolute_slot0: 0
    source_reference_signal: SSB
    source_reference_signal_id: 0
    qcl_types: [A]
    initialization_source: lls_preconfigured_higher_layer_context
  dl_reference_signaling:
    dmrs_configuration_type: 1
    dmrs_max_length: 1
    dmrs_type_enhanced: false
    two_tci_states: false
    max_codewords: 1
  ul_reference_signaling:
    srs_resource_count: 1
    dmrs_configuration_type: 1
    dmrs_max_length: 1
    dmrs_type_enhanced: false
    multipanel_sdm: false
  ul_precoding:
    num_ports: 1
    max_rank: 1
    codebook_subset: fullyAndPartialAndNonCoherent
    transmission_scheme: codebook
    full_power_mode: not_configured

pdsch:
  dmrs_nscid: 0
  # Full-DL and special-slot rows; these are configured alternatives, not
  # permission to schedule in an illegal TDD partition.
  time_domain_allocations:
    - [0, 2, 12, 0]
    - [1, 2, 8, 0]
pusch:
  dmrs_nscid: 0
  time_domain_allocations:
    - [0, 0, 13, 1]
    - [1, 0, 13, 2]
reference_signals:
  pdsch_dmrs_max_length: 1
  pusch_dmrs_config_type: 1
  pusch_dmrs_max_length: 1
  pusch_dmrs_num_cdm_groups_without_data: 2

pucch_resources:
  # Existing resource 0, symbols 12:13, at legal TDD UL occasions 4,9,... .
  # A configured opportunity is not a positive UE scheduling request.
  scheduling_request_resources:
    - scheduling_request_resource_id: 1
      scheduling_request_id: 0
      resource_id: 0
      periodicity_slots: 5
      offset_slots: 3
      priority_index: 0
      additional_periodicity_capability: false
